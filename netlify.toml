[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # La apiKey de Firebase en index.html NO es un secreto: es una clave pública
  # de identificación del proyecto; la seguridad real la dan las reglas de
  # Firestore/Auth. Se excluye este archivo del escaneo de secretos de Netlify
  # para evitar que el build falle por un falso positivo.
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[functions]
  node_bundler = "esbuild"

# firebase-admin tiene problemas conocidos y documentados al empaquetarse con
# esbuild (requires dinámicos internos que esbuild no resuelve bien), lo que
# provoca que la función falle por completo en producción (error 502) aunque
# el build parezca exitoso. Para esta función específica se usa el
# empaquetador clásico de Netlify (zisi), que simplemente incluye
# node_modules tal cual sin intentar transformarlo — mucho más confiable para
# paquetes complejos como este. Las otras funciones (sin dependencias) siguen
# con esbuild, sin cambios.
[functions."crear_usuario"]
  node_bundler = "zisi"

[[redirects]]
  from = "/api/analizar"
  to = "/.netlify/functions/analizar"
  status = 200

[[redirects]]
  from = "/api/leer-enlace"
  to = "/.netlify/functions/leer_enlace"
  status = 200

[[redirects]]
  from = "/api/crear-usuario"
  to = "/.netlify/functions/crear_usuario"
  status = 200
