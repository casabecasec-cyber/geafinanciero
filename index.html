}

/* =========================================================================
   MÓDULO: DIVIDENDOS
   Importa el libro Excel (Resumen Capital, Resumen Dividendos, hojas por
   empresa), audita su consistencia, permite editar/agregar años manualmente,
   y genera recomendaciones de distribución con IA según la normativa vigente.
   ========================================================================= */
let datosDividendosCache = null;
let dividendoVistaActual = "importar";
let empresaDividendoSeleccionada = null;
let accionistaDividendoSeleccionado = null;

function normalizarNombreEmpresa(nombre){
  return String(nombre||"").toUpperCase().replace(/\s+S\.?A\.?S?\.?\s*$/,"").trim();
}

/* --- Utilidades de parseo de hojas --- */
function detectarFilaHeader(filas, desde){
  for(let i=desde||0; i<filas.length; i++){
    const fila = filas[i]||[];
    if(fila.some(c => String(c||"").trim().toUpperCase()==="ACCIONISTA")) return i;
  }
  return -1;
}

function mapearColumnasHeader(headerRow){
  const cols = { anios:{}, colIdentificacion:-1, colAccionista:-1, colFecha:-1, colEmpresa:-1, colTotal:-1, colImpuestoRenta:-1, colDividendoPagar:-1 };
  (headerRow||[]).forEach((val, idx) => {
    const txt = String(val==null?"":val).trim().toUpperCase();
    if(txt==="EMPRESA") cols.colEmpresa = idx;
    else if(txt==="IDENTIFICACION") cols.colIdentificacion = idx;
    else if(txt==="ACCIONISTA") cols.colAccionista = idx;
    else if(txt==="FECHA") cols.colFecha = idx;
    else if(txt==="TOTAL") cols.colTotal = idx;
    else if(txt==="IMPUESTO RENTA") cols.colImpuestoRenta = idx;
    else if(txt==="DIVIDENDO A PAGAR") cols.colDividendoPagar = idx;
    else if(/^(19|20)\d{2}$/.test(txt)) cols.anios[txt] = idx;
    else if(typeof val==="number" && val>=1990 && val<=2035) cols.anios[String(Math.round(val))] = idx;
  });
  return cols;
}

function parsearHojaResumen(filas){
  const headerIdx = detectarFilaHeader(filas, 0);
  if(headerIdx===-1) return null;
  const cols = mapearColumnasHeader(filas[headerIdx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const empresas = {};
  let empresaActual = null;
  for(let i=headerIdx+1; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    const empresaVal = cols.colEmpresa>-1 ? String(fila[cols.colEmpresa]||"").trim() : null;
    if(empresaVal && empresaVal.toUpperCase().includes("RESUMEN GENERAL")) break;
    if(accionistaVal.toUpperCase()==="TOTAL") break;
    if(accionistaVal.toUpperCase().startsWith("COMPROBACI")) break;
    if(!accionistaVal && !empresaVal) continue;
    if(empresaVal) empresaActual = empresaVal;
    if(!empresaActual) continue;
    const claveEmpresa = normalizarNombreEmpresa(empresaActual);
    if(!empresas[claveEmpresa]) empresas[claveEmpresa] = { nombreOriginal: empresaActual, filas: [], suman: {} };
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a => { empresas[claveEmpresa].suman[a] = Number(fila[cols.anios[a]])||0; });
      empresaActual = null;
      continue;
    }
    const filaDatos = { identificacion: cols.colIdentificacion>-1 ? String(fila[cols.colIdentificacion]||"") : "", accionista: accionistaVal, valores: {} };
    anios.forEach(a => { filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    filaDatos.total = cols.colTotal>-1 ? (Number(fila[cols.colTotal])||0) : anios.reduce((s,a)=>s+filaDatos.valores[a],0);
    if(cols.colImpuestoRenta>-1) filaDatos.impuestoRenta = Number(fila[cols.colImpuestoRenta])||0;
    if(cols.colDividendoPagar>-1) filaDatos.dividendoPagar = Number(fila[cols.colDividendoPagar])||0;
    empresas[claveEmpresa].filas.push(filaDatos);
  }
  return { anios, empresas };
}

function parsearHojaEmpresa(filas){
  const header1Idx = detectarFilaHeader(filas, 0);
  if(header1Idx===-1) return null;
  const cols = mapearColumnasHeader(filas[header1Idx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const capital = { filas: [], suman: {} };
  let i = header1Idx+1;
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ capital.suman[a] = Number(fila[cols.anios[a]])||0; });
      i++;
      break;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    capital.filas.push(filaDatos);
  }
  const utilidad = { filas: [], suman: {}, totalDeclarado: {} };
  for(; i<filas.length; i++){
    const fila = filas[i]||[];
    const col0 = String(fila[0]||"").trim();
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(col0.toUpperCase().startsWith("UTILIDAD NO DISTRIBUIDA")){
      anios.forEach(a=>{ utilidad.totalDeclarado[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(accionistaVal.toUpperCase()==="SUMAN:"){
      anios.forEach(a=>{ utilidad.suman[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    if(!accionistaVal) continue;
    const filaDatos = { identificacion: String(fila[cols.colIdentificacion]||""), accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    utilidad.filas.push(filaDatos);
  }
  return { anios, capital, utilidad };
}

async function parsearLibroDividendos(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const hojaCapital = wb.Sheets["Resumen Capital"];
  const hojaDividendos = wb.Sheets["Resumen Dividendos"];
  if(!hojaCapital || !hojaDividendos) throw new Error('El libro debe tener las hojas "Resumen Capital" y "Resumen Dividendos".');
  const filasCapital = XLSX.utils.sheet_to_json(hojaCapital, {header:1, defval:null, raw:true});
  const filasDividendos = XLSX.utils.sheet_to_json(hojaDividendos, {header:1, defval:null, raw:true});
  const resumenCapital = parsearHojaResumen(filasCapital);
  const resumenDividendos = parsearHojaResumen(filasDividendos);
  const nombresHojasEmpresas = wb.SheetNames.filter(n => n!=="Resumen Capital" && n!=="Resumen Dividendos");
  const porEmpresa = {};
  nombresHojasEmpresas.forEach(nombreHoja => {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
    const parsed = parsearHojaEmpresa(filas);
    if(parsed) porEmpresa[normalizarNombreEmpresa(nombreHoja)] = { nombreHoja, ...parsed };
  });
  return { resumenCapital, resumenDividendos, porEmpresa, fechaImportacion: Date.now(), nombreArchivo: file.name };
}

/* --- Parseo genérico de una hoja simple (Accionista + columnas de año +
   fila de total), usado por el informe de resumen de una sola empresa.
   A diferencia de parsearHojaEmpresa/parsearHojaResumen, aquí la fila de
   total puede venir como "SUMAN" o "SUMAN:" (el informe que emite la propia
   app usa "SUMAN" sin dos puntos). --- */
function parsearFilasSimples(filas){
  const headerIdx = detectarFilaHeader(filas, 0);
  if(headerIdx===-1) return null;
  const cols = mapearColumnasHeader(filas[headerIdx]);
  const anios = Object.keys(cols.anios).map(Number).sort((a,b)=>a-b);
  const resultado = { anios, filas: [], suman: {} };
  for(let i=headerIdx+1; i<filas.length; i++){
    const fila = filas[i]||[];
    const accionistaVal = String(fila[cols.colAccionista]||"").trim();
    if(!accionistaVal) continue;
    if(accionistaVal.toUpperCase().replace(/:$/,"")==="SUMAN"){
      anios.forEach(a=>{ resultado.suman[a] = Number(fila[cols.anios[a]])||0; });
      continue;
    }
    const filaDatos = { identificacion: cols.colIdentificacion>-1 ? String(fila[cols.colIdentificacion]||"") : "", accionista: accionistaVal, valores:{} };
    anios.forEach(a=>{ filaDatos.valores[a] = Number(fila[cols.anios[a]])||0; });
    filaDatos.total = anios.reduce((s,a)=>s+filaDatos.valores[a],0);
    resultado.filas.push(filaDatos);
  }
  return resultado;
}

/* --- Importa el "Informe de Resumen" de UNA empresa, en el mismo formato
   que la propia app genera para descargar (hojas "Capital Social",
   "Historial Dividendos" y "Conciliación" — esta última no se usa para
   importar, es solo de referencia/auditoría en el archivo). Útil para
   traer de vuelta datos que se habían exportado antes (p. ej. desde otra
   instancia de la app) sin tener que rearmar el libro maestro completo. --- */
async function parsearInformeResumenEmpresa(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const hojaCapital = wb.Sheets["Capital Social"];
  const hojaDividendos = wb.Sheets["Historial Dividendos"];
  if(!hojaCapital || !hojaDividendos) throw new Error('El archivo debe tener las hojas "Capital Social" y "Historial Dividendos" — es el formato del informe de resumen que la propia app genera para descargar.');
  const filasCapital = XLSX.utils.sheet_to_json(hojaCapital, {header:1, defval:null, raw:true});
  const filasDividendos = XLSX.utils.sheet_to_json(hojaDividendos, {header:1, defval:null, raw:true});
  const capitalParsed = parsearFilasSimples(filasCapital);
  const dividendosParsed = parsearFilasSimples(filasDividendos);
  if(!capitalParsed || !dividendosParsed) throw new Error('No se encontró la fila de encabezado ("Accionista") en alguna de las hojas.');

  // El título en A1 de "Capital Social" suele ser "Historial de Capital Social — NombreEmpresa".
  const tituloCapital = String((filasCapital[0]||[])[0]||"");
  let nombreEmpresa = tituloCapital.includes("—") ? tituloCapital.split("—").pop().trim() : "";
  if(!nombreEmpresa) nombreEmpresa = file.name.replace(/^Informe_Resumenes_/i,"").replace(/\.xlsx$/i,"").replace(/_/g," ").trim();
  if(!nombreEmpresa) nombreEmpresa = "Empresa importada";
  const clave = normalizarNombreEmpresa(nombreEmpresa);

  return {
    resumenCapital: { anios: capitalParsed.anios, empresas: { [clave]: { nombreOriginal: nombreEmpresa, filas: capitalParsed.filas, suman: capitalParsed.suman } } },
    resumenDividendos: { anios: dividendosParsed.anios, empresas: { [clave]: { nombreOriginal: nombreEmpresa, filas: dividendosParsed.filas, suman: dividendosParsed.suman } } },
    porEmpresa: { [clave]: { nombreHoja: nombreEmpresa, capital: { filas: capitalParsed.filas, suman: capitalParsed.suman }, utilidad: { filas: dividendosParsed.filas, suman: dividendosParsed.suman, totalDeclarado: {} } } },
    fechaImportacion: Date.now(), nombreArchivo: file.name
  };
}

/* --- Fusiona un nuevo archivo importado con los datos ya existentes.
   Si una empresa ya existía, el archivo más reciente la reemplaza por completo
   (no se mezclan campo por campo); los años se acumulan (unión). --- */
function fusionarDatosDividendos(base, nuevo){
  if(!base){
    return { resumenCapital: nuevo.resumenCapital, resumenDividendos: nuevo.resumenDividendos, porEmpresa: nuevo.porEmpresa,
      fechaImportacion: nuevo.fechaImportacion, nombreArchivo: nuevo.nombreArchivo };
  }
  const resultado = JSON.parse(JSON.stringify(base));
  if(!resultado.resumenCapital) resultado.resumenCapital = {anios:[], empresas:{}};
  if(!resultado.resumenDividendos) resultado.resumenDividendos = {anios:[], empresas:{}};
  if(!resultado.porEmpresa) resultado.porEmpresa = {};

  resultado.resumenCapital.anios = Array.from(new Set([...(resultado.resumenCapital.anios||[]), ...(nuevo.resumenCapital?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenCapital?.empresas||{}).forEach(clave => { resultado.resumenCapital.empresas[clave] = nuevo.resumenCapital.empresas[clave]; });

  resultado.resumenDividendos.anios = Array.from(new Set([...(resultado.resumenDividendos.anios||[]), ...(nuevo.resumenDividendos?.anios||[])])).sort((a,b)=>a-b);
  Object.keys(nuevo.resumenDividendos?.empresas||{}).forEach(clave => { resultado.resumenDividendos.empresas[clave] = nuevo.resumenDividendos.empresas[clave]; });

  Object.keys(nuevo.porEmpresa||{}).forEach(clave => { resultado.porEmpresa[clave] = nuevo.porEmpresa[clave]; });

  resultado.nombreArchivo = nuevo.nombreArchivo;
  resultado.fechaImportacion = nuevo.fechaImportacion;
  return resultado;
}

/* --- Creación manual de una empresa con sus accionistas, cuando no hay plantilla Excel --- */
function crearEmpresaManualDividendos(nombre, accionistas){
  const clave = normalizarNombreEmpresa(nombre);
  const anioActual = new Date().getFullYear();
  if(!datosDividendosCache){
    datosDividendosCache = { resumenCapital:{anios:[],empresas:{}}, resumenDividendos:{anios:[],empresas:{}}, porEmpresa:{} };
  }
  if(!datosDividendosCache.resumenCapital.anios.includes(anioActual)){
    datosDividendosCache.resumenCapital.anios.push(anioActual);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  const filasCapital = accionistas.map(a => ({ identificacion:"", accionista:a.nombre, valores:{ [anioActual]: a.porcentaje } }));
  datosDividendosCache.resumenCapital.empresas[clave] = { nombreOriginal: nombre, filas: filasCapital, suman: { [anioActual]: 100 } };
  datosDividendosCache.resumenDividendos.empresas[clave] = {
    nombreOriginal: nombre,
    filas: accionistas.map(a => ({ accionista:a.nombre, valores:{}, total:0, impuestoRenta:0, dividendoPagar:0 })),
    suman: {}
  };
  datosDividendosCache.porEmpresa[clave] = {
    nombreHoja: nombre, anios: [anioActual], origenManual: true,
    capital: { filas: JSON.parse(JSON.stringify(filasCapital)), suman: { [anioActual]: 100 } },
    utilidad: { filas: [], suman: {}, totalDeclarado: {} }
  };
  return clave;
}

/* --- Auditoría: cruces de consistencia --- */
function ejecutarAuditoriaDividendos(datos){
  const hallazgos = [];
  const TOL = 0.05;
  const empresasResumenCap = Object.keys(datos.resumenCapital?.empresas||{});
  const empresasResumenDiv = Object.keys(datos.resumenDividendos?.empresas||{});
  const todasEmpresas = Array.from(new Set([...empresasResumenCap, ...empresasResumenDiv, ...Object.keys(datos.porEmpresa||{})]));

  todasEmpresas.forEach(clave => {
    const nombreOriginal = (datos.resumenCapital?.empresas?.[clave]?.nombreOriginal) || (datos.resumenDividendos?.empresas?.[clave]?.nombreOriginal) || clave;
    const hojaEmpresa = datos.porEmpresa?.[clave];

    // 1. Capital: Resumen Capital SUMAN vs hoja de empresa (capital SUMAN)
    if(datos.resumenCapital?.empresas?.[clave] && hojaEmpresa){
      datos.resumenCapital.anios.forEach(a => {
        const v1 = datos.resumenCapital.empresas[clave].suman[a]||0;
        const v2 = hojaEmpresa.capital?.suman?.[a]||0;
        if(Math.abs(v1-v2) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Capital: Resumen vs hoja empresa", valorA:v1, valorB:v2, diferencia: v1-v2 });
        }
      });
    }
    // 2. Dividendos: Resumen Dividendos SUMAN vs hoja de empresa (utilidad SUMAN y totalDeclarado)
    if(datos.resumenDividendos?.empresas?.[clave] && hojaEmpresa){
      datos.resumenDividendos.anios.forEach(a => {
        const vResumen = datos.resumenDividendos.empresas[clave].suman[a]||0;
        const vHojaSuman = hojaEmpresa.utilidad?.suman?.[a]||0;
        const vHojaDeclarado = hojaEmpresa.utilidad?.totalDeclarado?.[a];
        if(Math.abs(vResumen-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: Resumen vs SUMAN hoja empresa", valorA:vResumen, valorB:vHojaSuman, diferencia:vResumen-vHojaSuman });
        }
        if(vHojaDeclarado!==undefined && Math.abs(vHojaDeclarado-vHojaSuman) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:a, tipo:"Dividendos: total declarado vs SUMAN accionistas (hoja empresa)", valorA:vHojaDeclarado, valorB:vHojaSuman, diferencia:vHojaDeclarado-vHojaSuman });
        }
      });
    }
    // 3. Por accionista en Resumen Dividendos: TOTAL = suma de años; DIVIDENDO A PAGAR = TOTAL - IMPUESTO RENTA
    if(datos.resumenDividendos?.empresas?.[clave]){
      datos.resumenDividendos.empresas[clave].filas.forEach(f => {
        const sumaAnios = Object.values(f.valores).reduce((s,v)=>s+(v||0),0);
        if(f.total!==undefined && Math.abs(f.total-sumaAnios) > TOL){
          hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`TOTAL no coincide con suma de años (${f.accionista})`, valorA:f.total, valorB:sumaAnios, diferencia:f.total-sumaAnios });
        }
        if(f.total!==undefined && f.impuestoRenta!==undefined && f.dividendoPagar!==undefined){
          const esperado = f.total - f.impuestoRenta;
          if(Math.abs(esperado-f.dividendoPagar) > TOL){
            hallazgos.push({ empresa: nombreOriginal, anio:"-", tipo:`DIVIDENDO A PAGAR no coincide con TOTAL - IMPUESTO RENTA (${f.accionista})`, valorA:esperado, valorB:f.dividendoPagar, diferencia:esperado-f.dividendoPagar });
          }
        }
      });
    }
  });
  return hallazgos;
}

async function ejecutarImportarDividendos(){
  const input = document.getElementById("archivoDividendos");

  if(!file){ alert("Selecciona el archivo Excel primero."); return; }
  const estadoEl = document.getElementById("estadoImportarDividendos");

    datosDividendosCache = fusionarDatosDividendos(datosDividendosCache, datosArchivo);
    await guardarDatosDividendos(datosDividendosCache);
    await guardarArchivoDividendos(datosArchivo);

// Escapa un texto para insertarlo dentro de un string JS de comillas simples
// en un atributo onclick/onchange (ej. nombres de accionistas con apóstrofes).
function escJs(s){
  return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

// Edición de los datos históricos importados: cualquier valor de capital o
// dividendos se puede corregir a mano en cualquier momento, y se guarda solo.
async function actualizarCapitalHistorico(clave, accionista, anio, valor){
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const fila = datosCapital.filas.find(f=>f.accionista===accionista);
  if(!fila) return;
  fila.valores[anio] = valor===""? 0 : parseFloat(valor);
  datosCapital.suman[anio] = datosCapital.filas.reduce((s,f)=>s+(f.valores[anio]||0),0);
  await guardarDatosDividendos(datosDividendosCache);
  pintarDetalleEmpresaDividendo();
}

async function actualizarDividendoHistoricoValor(clave, accionista, anio, valor){
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const fila = datosResumen.filas.find(f=>f.accionista===accionista);
  if(!fila) return;
  fila.valores[anio] = valor===""? 0 : parseFloat(valor);
  datosResumen.suman[anio] = datosResumen.filas.reduce((s,f)=>s+(f.valores[anio]||0),0);
  await guardarDatosDividendos(datosDividendosCache);

// Recalcula el Historial de Dividendos por accionista tomando, para cada año,
// la "Utilidad a Distribuir" del Comparativo SRI/Súper Cías/Contable y
// repartiéndola entre los accionistas según su % real de participación ese
// año (capital de cada accionista ese año / capital total de la empresa ese
// año, del Historial de capital social). Así el historial de dividendos
// queda consistente con esas dos fuentes en vez de depender solo del Excel
// original importado.
async function recalcularHistorialDividendosDesdeComparativo(){
  const clave = empresaDividendoSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  if(!datosCapital || !datosResumen){ alert("Faltan datos de capital o de dividendos para esta empresa."); return; }
  if(!confirm(`Esto reemplaza, año por año, el valor de cada accionista en el Historial de Dividendos.

Para cada año se usa el AUMENTO real de la Utilidad Acumulada de ese año respecto al anterior (no solo el campo "Utilidad a Distribuir") — así, si algún año no tiene "Utilidad a Distribuir" registrada pero el acumulado sí subió (por ejemplo, por un ajuste manual del acumulado), esa diferencia igual se reparte y el total siempre cuadra con la Utilidad Acumulada final.

Si un año no tiene su propio dato de capital social, se usa el capital del año siguiente más cercano que sí tenga datos.

Los montos de IMP. RENTA y A PAGAR no se tocan. ¿Continuar?`)) return;

  const filasComparativo = calcularFilasComparativo(clave); // ya viene ordenado por año, con acumuladoMostrado encadenado
  const aniosCapitalLocal = datosDividendosCache.resumenCapital.anios;
  // Unión de todos los años relevantes: los del Comparativo (que ya cubren
  // 1992-año actual) y los que ya existan en el Historial de capital.
  const todosLosAnios = Array.from(new Set([...aniosCapitalLocal, ...filasComparativo.map(f=>f.anio)])).sort((a,b)=>a-b);

  // Busca el año más cercano (primero hacia adelante, luego hacia atrás si no
  // hay ninguno) que sí tenga datos de capital social, para usar su % cuando
  // el año en cuestión no tenga capital propio registrado.
  function anioConCapitalMasCercano(anio){
    if((datosCapital.suman[anio]||0) > 0) return anio;
    const haciaAdelante = aniosCapitalLocal.filter(a=>a>=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>a-b);
    if(haciaAdelante.length) return haciaAdelante[0];
    const haciaAtras = aniosCapitalLocal.filter(a=>a<=anio && (datosCapital.suman[a]||0)>0).sort((a,b)=>b-a);
    return haciaAtras.length ? haciaAtras[0] : null;
  }

  // Unión de accionistas (capital + dividendos ya existentes), para no perder a nadie
  const nombresUnion = Array.from(new Set([
    ...datosCapital.filas.map(f=>f.accionista),
    ...datosResumen.filas.map(f=>f.accionista)
  ]));
  // Reconstruye (o crea) la fila de dividendos de cada accionista, conservando
  // impuestoRenta/dividendoPagar si ya existían.
  const filasNuevas = nombresUnion.map(nombre => {
    const existente = datosResumen.filas.find(f=>f.accionista===nombre);
    return {
      accionista: nombre,
      valores: {},
      total: 0,
      impuestoRenta: existente?.impuestoRenta || 0,
      dividendoPagar: existente?.dividendoPagar || 0,
    };
  });

  const sumanNuevo = {};
  let acumuladoAnterior = 0; // arranca en 0 (año 1991, igual que en el Comparativo)
  for(const anio of todosLosAnios){
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const acumuladoEsteAnio = filaComp ? (filaComp.acumuladoMostrado||0) : acumuladoAnterior;
    // Monto EFECTIVO a repartir este año = cuánto subió el acumulado respecto
    // al año anterior — esto captura tanto la "Utilidad a Distribuir" normal
    // de ese año, como cualquier salto que venga de un ajuste manual del
    // acumulado sin una "Utilidad a Distribuir" explícita ese mismo año.
    const montoEfectivo = acumuladoEsteAnio - acumuladoAnterior;
    acumuladoAnterior = acumuladoEsteAnio;

    if(Math.abs(montoEfectivo) < 0.005){ sumanNuevo[anio] = 0; continue; }

    const anioCapitalAUsar = anioConCapitalMasCercano(anio);
    const totalCapitalAnio = anioCapitalAUsar!==null ? (datosCapital.suman[anioCapitalAUsar]||0) : 0;
    let sumaAnio = 0;
    filasNuevas.forEach(fn => {
      const filaCap = anioCapitalAUsar!==null ? datosCapital.filas.find(f=>f.accionista===fn.accionista) : null;
      const capitalAccionista = filaCap ? (filaCap.valores[anioCapitalAUsar]||0) : 0;
      const porcentaje = totalCapitalAnio ? (capitalAccionista/totalCapitalAnio) : 0;
      const valorAsignado = montoEfectivo * porcentaje;
      fn.valores[anio] = valorAsignado;
      sumaAnio += valorAsignado;
    });
    sumanNuevo[anio] = sumaAnio;
  }
  filasNuevas.forEach(fn => {
    fn.total = Object.values(fn.valores).reduce((s,v)=>s+(v||0), 0);
  });

  datosResumen.filas = filasNuevas;
  datosResumen.suman = sumanNuevo;
  datosDividendosCache.resumenDividendos.anios = todosLosAnios;

  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Historial de dividendos recalculado desde Comparativo SRI + % de capital (con ajuste de saltos de acumulado): ${datosDividendosCache.porEmpresa[clave]?.nombreHoja||clave}`);
  pintarDetalleEmpresaDividendo();
}

// Concilia, año por año, la Utilidad Acumulada CORRIDA del Comparativo SRI...
// contra la Utilidad Acumulada corrida del Historial de Dividendos (suma
// corrida de SUMAN) — la MISMA lógica que ya usa la fila "TOTAL ACUMULADO
// EMPRESA" en pantalla. Se compara por acumulados (no por el campo "Utilidad
// a Distribuir" en crudo de cada año) porque el recálculo reparte según el
// AUMENTO real del acumulado de cada año, que puede venir de una "Utilidad a
// Distribuir" explícita o de un ajuste manual del acumulado — comparar los
// acumulados corridos es lo único que siempre refleja correctamente si ya
// cuadra o no, en cualquiera de los dos casos.
function calcularConciliacionComparativoVsDividendos(clave){
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const filasComparativo = calcularFilasComparativo(clave);
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios || [];
  const aniosUnion = Array.from(new Set([...filasComparativo.map(f=>f.anio), ...aniosDividendos])).sort((a,b)=>a-b);

  let acumuladoDividendosCorrido = 0;
  const filas = aniosUnion.map(anio => {
    const filaComp = filasComparativo.find(f=>f.anio===anio);
    const utilidadDistribuirComparativo = filaComp ? (filaComp.utilidadMostrada||0) : 0;
    const acumuladoComparativo = filaComp ? (filaComp.acumuladoMostrado||0) : null;
    const sumanDividendos = (datosResumen?.suman[anio])||0;
    acumuladoDividendosCorrido += sumanDividendos;
    const diferencia = acumuladoComparativo!==null ? (acumuladoDividendosCorrido - acumuladoComparativo) : 0;
    const cuadra = acumuladoComparativo===null ? true : Math.abs(diferencia) < 0.5;
    return { anio, utilidadDistribuirComparativo, sumanDividendos, acumuladoComparativo, acumuladoDividendosCorrido, diferencia, cuadra };
  }).filter(f => Math.abs(f.utilidadDistribuirComparativo) > 0.001 || Math.abs(f.sumanDividendos) > 0.001 || (f.acumuladoComparativo!==null && Math.abs(f.acumuladoComparativo) > 0.001));

  const ultima = filas[filas.length-1];
  const totalDiferencia = ultima ? ultima.diferencia : 0;
  const totalComparativo = ultima ? (ultima.acumuladoComparativo||0) : 0;
  const totalDividendos = ultima ? ultima.acumuladoDividendosCorrido : 0;
  return { filas, totalDiferencia, totalComparativo, totalDividendos };
}

async function guardarNuevoAnioCapital(){
  const anio = parseInt(document.getElementById("nuevoAnioCapital").value, 10);
  if(!anio){ alert("Ingresa el año a agregar."); return; }
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaDividendoSeleccionada];
  if(!datosCapital){ alert("Genera primero las filas de accionistas."); return; }
  let sumaAnio = 0;
  datosCapital.filas.forEach((f, idx) => {
    const input = document.getElementById("nuevoCapitalMonto_"+idx);
    if(!input) return;
    const monto = parseFloat(input.value)||0;
    f.valores[anio] = monto;
    sumaAnio += monto;
  });
  datosCapital.suman[anio] = sumaAnio;
  if(!datosDividendosCache.resumenCapital.anios.includes(anio)){
    datosDividendosCache.resumenCapital.anios.push(anio);
    datosDividendosCache.resumenCapital.anios.sort((a,b)=>a-b);
  }
  // Reflejar también en la hoja individual de la empresa, si existe
  const hojaEmpresa = datosDividendosCache.porEmpresa[empresaDividendoSeleccionada];
  if(hojaEmpresa){
    if(!hojaEmpresa.anios.includes(anio)){ hojaEmpresa.anios.push(anio); hojaEmpresa.anios.sort((a,b)=>a-b); }
    hojaEmpresa.capital.filas.forEach(f => {
      const filaResumen = datosCapital.filas.find(x=>x.accionista===f.accionista);
      if(filaResumen) f.valores[anio] = filaResumen.valores[anio];
    });
    hojaEmpresa.capital.suman[anio] = sumaAnio;
  }
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Año ${anio} de capital agregado manualmente a ${datosDividendosCache.porEmpresa[empresaDividendoSeleccionada]?.nombreHoja||empresaDividendoSeleccionada}`);
  pintarDetalleEmpresaDividendo();
}

}

async function guardarNuevoAnioDividendo(){
  const anio = parseInt(document.getElementById("nuevoAnioDiv").value, 10);
  if(!anio){ alert("Ingresa el año a agregar."); return; }
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[empresaDividendoSeleccionada];
  datosResumen.filas.forEach((f, idx) => {
    const inputMonto = document.getElementById("nuevoMonto_"+idx);
    if(!inputMonto) return;
    const monto = parseFloat(inputMonto.value)||0;
    const impuestoInput = document.getElementById("nuevoImpuesto_"+idx);
    const impuesto = impuestoInput && impuestoInput.value ? parseFloat(impuestoInput.value) : Math.round(monto*0.12*100)/100;
    f.valores[anio] = monto;
    f.total = (f.total||0) + monto;
    f.impuestoRenta = (f.impuestoRenta||0) + impuesto;
    f.dividendoPagar = (f.dividendoPagar||0) + (monto - impuesto);
  });
  if(!datosDividendosCache.resumenDividendos.anios.includes(anio)){
    datosDividendosCache.resumenDividendos.anios.push(anio);
    datosDividendosCache.resumenDividendos.anios.sort((a,b)=>a-b);
  }
  datosResumen.suman[anio] = datosResumen.filas.reduce((s,f)=>s+(f.valores[anio]||0),0);
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Año ${anio} agregado manualmente a ${datosDividendosCache.porEmpresa[empresaDividendoSeleccionada]?.nombreHoja||empresaDividendoSeleccionada}`);
  pintarDetalleEmpresaDividendo();
}

async function ejecutarRecomendacionDividendos(){
  const anio = document.getElementById("recAnio").value.trim();
  const utilidad = parseFloat(document.getElementById("recUtilidad").value)||0;
  const antesJulio = document.getElementById("recAntesJulio").value;
  const instrucciones = document.getElementById("recInstrucciones").value.trim();
  if(!utilidad){ alert("Ingresa el monto a distribuir."); return; }
  if(!empresaDistribActualSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaDistribActualSeleccionada];
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaDistribActualSeleccionada]?.nombreHoja || empresaDistribActualSeleccionada;
  const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
  const totalCapitalEmpresa = (datosCapital?.suman[ultimoAnioCapital])||1;
  const accionistas = (datosCapital?.filas||[]).map(f => {
    const capitalActual = f.valores[ultimoAnioCapital]||0;
    const porcentaje = totalCapitalEmpresa ? (capitalActual/totalCapitalEmpresa*100) : 0;
    return `${f.accionista}: ${porcentaje.toFixed(2)}% de participación`;
  }).join("\n");
  const contenido = `Empresa: ${nombreEmpresa}\nAño de distribución: ${anio}\nUtilidad total de la empresa a distribuir entre todos los accionistas: USD $${utilidad.toFixed(2)}\n¿Se distribuye antes del 31 de julio de ese año?: ${antesJulio}\nAccionista(s) y participación (según capital al año ${ultimoAnioCapital}):\n${accionistas}`;
  const estadoEl = document.getElementById("estadoRecomendacionDiv");
  document.getElementById("resultadoRecomendacionDiv").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA("recomendar_distribucion_dividendos", contenido, instrucciones);
    estadoEl.textContent = "Recomendación generada.";
    document.getElementById("resultadoRecomendacionDiv").innerHTML = renderRecomendacionDividendos(resultado);
    await registrarCambio("Dividendos", "generar_ia", `Recomendación de distribución generada para ${nombreEmpresa} (${anio})`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar la recomendación: " + e.message);
  }
}

// Muestra el saldo de crédito tributario del pago a cuenta, por año y
// acumulado — incluye TODOS los pagos a cuenta registrados (tanto los
// manuales del Art. 39.2.1 como los auto-generados desde anticipos, ya
// que estos últimos también quedan acreditados como pago a cuenta real una
// vez efectuados). El monto usado por fila es el monto real (según la forma
// de pago registrada, si ya existe una).
function pintarSaldoCreditoTributario(){
  const cont = document.getElementById("saldoCreditoTributario");
  if(!cont) return;
  const clave = empresaDistribActualSeleccionada;
  const pagos = (datosDividendosCache.pagosACuenta||{})[clave] || [];
  if(!pagos.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin pagos a cuenta registrados todavía.</p>`; return; }
  const hoyAnio = new Date().getFullYear();
  let totalDisponible = 0;
  const filas = pagos.slice().sort((a,b)=>a.anio-b.anio).map(p => {
    const anioLimite = p.anio + 2;
    const vencido = hoyAnio > anioLimite;
    const porVencer = !vencido && (anioLimite - hoyAnio) <= 1;
    const montoBase = montoEfectivoPagoACuenta(p);
    const compensado = p.montoCompensado||0;
    const saldo = Math.max(0, montoBase - compensado);
    if(!vencido) totalDisponible += saldo;
    return { anio:p.anio, monto:montoBase, compensado, saldo, anioLimite, vencido, porVencer, esAuto:!!p.autoDesdeAnticipos };
  });
  cont.innerHTML = `<table style="font-size:12px;"><thead><tr><th>Origen</th><th>Año del pago</th><th>Monto pagado</th><th>Compensado</th><th>Saldo disponible</th><th>Vence en</th><th>Estado</th></tr></thead><tbody>

    </tr>`).join("")}
    <tr style="font-weight:bold;background:var(--panel2);border-top:2px solid var(--accent);">
      <td colspan="4">SALDO DE CRÉDITO TRIBUTARIO DISPONIBLE (acumulado, no vencido)</td>

      <td colspan="2"></td>
    </tr>
  </tbody></table>`;
}

// Monto REAL de un pago a cuenta: si ya se registró una forma de pago
// (banco o cuentas por pagar), ese es el valor confiable — puede diferir del
// campo "Monto" original (por ejemplo, si la retención vinculada se pagó
// mediante cuentas por pagar por el valor neto a los accionistas). Si no
// hay forma de pago registrada todavía, se usa el "Monto" tal cual.
function montoEfectivoPagoACuenta(p){
  if(p.metodoPago==="banco"){
    return (p.pagosBanco||[]).reduce((s,x)=>s+(x.monto||0),0);
  }
  if(p.metodoPago==="cuentasPorPagar"){
    return p.cuentasPorPagarAcumulado||0;
  }
  return p.monto||0;
}

function badgeFormaPagoACuenta(p){
  if(p.metodoPago==="banco"){
    const totalBanco = (p.pagosBanco||[]).reduce((s,x)=>s+(x.monto||0),0);
    return `<span class="pill ${Math.abs(totalBanco-p.monto)<0.5?'ok':'warn'}">Banco: $${totalBanco.toFixed(2)}</span>`;
  }
  if(p.metodoPago==="cuentasPorPagar"){
    return `<span class="pill warn">Cuentas x pagar: $${(p.cuentasPorPagarAcumulado||0).toFixed(2)}</span>`;
  }
  return `<span class="pill muted">Sin registrar</span>`;
}

// Para filas automáticas (por año, desde Anticipos+Retenciones): muestra el
// resumen de la forma de pago ya registrada en las retenciones de ese año,
// en vez de pedirla de nuevo aquí — se gestiona en la retención misma
// (Escenarios → 💳 Pago), para no duplicar el dato en dos lugares.
function badgeFormaPagoResumenRetenciones(p){
  const r = p.formaPagoRetencionesResumen || { banco:0, cuentasPorPagar:0 };
  if(!r.banco && !r.cuentasPorPagar) return `<span class="pill muted">Sin registrar (ver retención)</span>`;
  const partes = [];
  if(r.banco) partes.push(`Banco: $${r.banco.toFixed(2)}`);
  if(r.cuentasPorPagar) partes.push(`Cuentas x pagar: $${r.cuentasPorPagar.toFixed(2)}`);
  return `<span class="pill ok">${partes.join(' + ')}</span>`;
}

// Muestra (y permite documentar) el excedente de retenciones que superó el

      <div class="grid3">

      </div>
    </div>`;
}

async function actualizarExcesoPagoACuenta(campo, valor){
  const clave = empresaDistribActualSeleccionada;

            <td><button class="btn small danger" onclick="eliminarPagoBancoACuenta(${idx},${i})">Quitar</button></td>

      ${p.metodoPago==="cuentasPorPagar" ? `
        <p class="helpNote" style="margin-top:6px;">El monto se va acumulando cada vez que agregas una cuenta por pagar nueva (útil si el pago se hace en varias partes con el tiempo, o hay varias cuentas por pagar pendientes).</p>

async function actualizarMetodoPagoACuenta(idx, metodo){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  p.metodoPago = metodo || null;
  if(metodo==="banco" && !p.pagosBanco) p.pagosBanco = [];
  await guardarDatosDividendos(datosDividendosCache);
  pintarListaPagosACuenta();
  const filaEl = document.getElementById("filaFormaPagoACuenta_"+idx);
  if(filaEl) filaEl.classList.remove("hidden");
  pintarFormaPagoACuentaDetalle(idx);
}

async function agregarPagoBancoACuenta(idx){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  if(!p.pagosBanco) p.pagosBanco = [];
  p.pagosBanco.push({ tipo:"transferencia", monto:0, referencia:"", fecha:"" });
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function actualizarPagoBancoACuenta(idx, i, campo, valor){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p || !p.pagosBanco[i]) return;
  p.pagosBanco[i][campo] = campo==="monto" ? (parseFloat(valor)||0) : valor;
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function eliminarPagoBancoACuenta(idx, i){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  p.pagosBanco.splice(i,1);
  await guardarDatosDividendos(datosDividendosCache);
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function agregarCuentaPorPagarACuenta(idx){
  const clave = empresaDistribActualSeleccionada;
  const p = (datosDividendosCache.pagosACuenta[clave]||[])[idx];
  if(!p) return;
  const input = document.getElementById("montoNuevaCuentaPorPagarPAC_"+idx);
  const monto = parseFloat(input.value)||0;
  if(!monto){ alert("Ingresa un monto mayor a cero."); return; }
  p.cuentasPorPagarAcumulado = (p.cuentasPorPagarAcumulado||0) + monto;
  await guardarDatosDividendos(datosDividendosCache);
  input.value = "";
  pintarFormaPagoACuentaDetalle(idx);
  pintarListaPagosACuenta();
}

async function agregarPagoACuenta(){
  const clave = empresaDistribActualSeleccionada;
  const anio = parseInt(document.getElementById("pacAnio").value, 10);
  const monto = parseFloat(document.getElementById("pacMonto").value)||0;
  const observacion = document.getElementById("pacObs").value.trim();
  if(!anio || !monto){ alert("Ingresa el año y el monto del pago."); return; }
  if(!datosDividendosCache.pagosACuenta) datosDividendosCache.pagosACuenta = {};
  if(!datosDividendosCache.pagosACuenta[clave]) datosDividendosCache.pagosACuenta[clave] = [];
  datosDividendosCache.pagosACuenta[clave].push({ anio, monto, observacion, metodoPago:null, pagosBanco:[], cuentasPorPagarAcumulado:0, montoCompensado:0 });
  await guardarDatosDividendos(datosDividendosCache);
  await registrarCambio("Dividendos", "editar", `Pago a cuenta registrado: ${datosDividendosCache.porEmpresa[clave]?.nombreHoja||''} año ${anio}, $${monto.toFixed(2)}`);
  document.getElementById("pacAnio").value=""; document.getElementById("pacMonto").value=""; document.getElementById("pacObs").value="";
  pintarListaPagosACuenta();
}

/* --- Anticipos de dividendos pagados, desglosados por año. Se llenan solos
   desde las retenciones guardadas (agrupadas por año) y también admiten
   entradas manuales, para anticipos que no pasaron por la Calculadora de
   retención. Sirve de contexto para Escenarios y para llevar control
   histórico de lo ya pagado, empezando desde el primer año que corresponda. --- */
function pintarListaAnticiposDividendos(){
  const cont = document.getElementById("listaAnticiposDividendos");
  if(!cont) return;
  const clave = empresaEscenarioSeleccionada;
  const lista = ((datosDividendosCache.anticiposDividendos||{})[clave]||[]).slice().sort((a,b)=>a.anio-b.anio);
  if(!lista.length){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin anticipos registrados.</p>`; return; }
  const total = lista.reduce((s,a)=>s+(a.monto||0),0);
  cont.innerHTML = `<table style="font-size:12px;"><thead><tr><th>Año</th><th>Monto</th><th>Observación</th><th></th></tr></thead><tbody>
    ${lista.map((a,idx) => `<tr>
        <td>${a.anio}</td>
        <td><input type="number" style="width:100px;" value="${a.monto}" onchange="editarAnticipoDividendo(${idx},'monto',this.value)"></td>
        <td><input type="text" style="width:160px;" value="${escapeHtml(a.observacion||'')}" onchange="editarAnticipoDividendo(${idx},'observacion',this.value)"></td>

      </tr>`).join("")}

}

async function agregarAnticipoDividendoManual(){
  const clave = empresaEscenarioSeleccionada;

async function eliminarAnticipoDividendo(idx){

  const lista = (datosDividendosCache.anticiposDividendos||{})[clave] || [];

let seleccionAccionistasCalc = {}; // { [empresaClave]: [{nombre, incluido, corresponde, valorPagar, anticipoValor}] }
let modalidadRepartoCalc = "actuales"; // 'actuales' | 'historicos'
let anioRepartoCalc = null;

function calcularCorrespondePorAccionista(modalidad, anio){
  const clave = empresaEscenarioSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumenDiv = datosDividendosCache.resumenDividendos.empresas[clave];
  const aniosCapital = datosDividendosCache.resumenCapital.anios;
  const ultimoAnioCapital = aniosCapital[aniosCapital.length-1];

  if(modalidad==="historicos"){
    // Cada accionista recibe lo que históricamente le correspondió ESE año específico
    return (datosResumenDiv?.filas||[]).map(f => ({
      nombre: f.accionista,
      porcentaje: null,
      corresponde: f.valores[anio] || 0
    }));
  }
  // modalidad "actuales": los accionistas actuales (capital > 0 en el último año) son
  // dueños de TODA la utilidad acumulada histórica, repartida según su % de participación hoy.
  const totalCapitalActual = datosCapital?.suman[ultimoAnioCapital] || 1;
  const utilidadAcumuladaTotal = datosDividendosCache.resumenDividendos.anios.reduce((s,a)=> s+(datosResumenDiv?.suman[a]||0), 0);
  return (datosCapital?.filas||[])
    .filter(f => (f.valores[ultimoAnioCapital]||0) > 0)
    .map(f => {
      const porcentaje = totalCapitalActual ? ((f.valores[ultimoAnioCapital]||0)/totalCapitalActual*100) : 0;
      return { nombre: f.accionista, porcentaje, corresponde: utilidadAcumuladaTotal*(porcentaje/100) };
    });
}

let tipoBeneficiarioCalc = "residente";

function calcularRetencionAccionista(a, anio){
  const franja = franjaExentaDelAnio(anio);
  const tarifa = TARIFAS_RETENCION_DIVIDENDOS[tipoBeneficiarioCalc].tarifa;
  const franjaUsadaAnticipo = Math.min(franja, a.anticipoValor||0);
  const franjaRestante = Math.max(0, franja - franjaUsadaAnticipo);
  const baseImponible = Math.max(0, (a.valorPagar||0) - franjaRestante);
  const retencion = baseImponible * tarifa;
  const neto = (a.valorPagar||0) - retencion;
  return { franja, franjaRestante, baseImponible, retencion, neto, tarifa };
}

  estadoEl.innerHTML = `<span class="spinner"></span> Calculando con IA...`;
  try{

    window._ultimoInformeRetencionAccionistas = { resultado, periodo, nombreEmpresa, fechaRetencion };

    const idxExistente = datosDividendosCache.retenciones[clave].findIndex(r=>r.id===registro.id);

// Reconstruye por completo la parte automática de "Pago a cuenta" a partir
// de: (1) los Anticipos de dividendos por año (Escenarios) — una fila por
// cada año que tenga anticipos, con "Monto" = total de anticipos de ese año;
// y (2) el total de TODAS las retenciones formales realizadas juntas (sin
// importar en qué año se hicieron) — ese total compensa ÚNICAMENTE el año
// MÁS BAJO con anticipo registrado, hasta el monto de ese año. Los demás
// años NO reciben nada del pool (quedan con Compensado $0, sin tocar). Si el
// total retenido supera el monto del año más bajo, esa diferencia NO se
// traslada a ningún otro año — ya se retuvo/pagó, así que se debe pagar
// aparte: se documenta en un recuadro separado (monto a pagar, si fue en
// cheque o transferencia, y observaciones para el N° de formulario). Las
// filas manuales (Art. 39.2.1) nunca se tocan. Se puede llamar siempre
// (idempotente) — recalcula todo desde cero cada vez.
function resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave){
  if(!datosDividendosCache.pagosACuenta) datosDividendosCache.pagosACuenta = {};
  if(!datosDividendosCache.pagosACuenta[clave]) datosDividendosCache.pagosACuenta[clave] = [];
  const listaActual = datosDividendosCache.pagosACuenta[clave];
  const anticipos = (datosDividendosCache.anticiposDividendos||{})[clave] || [];
  const aniosConAnticipo = [...new Set(anticipos.map(a=>a.anio))].sort((a,b)=>a-b);
  const retenciones = (datosDividendosCache.retenciones||{})[clave] || [];

  const filasManuales = listaActual.filter(p => !p.autoDesdeAnticipos);
  const autoPorAnioViejo = {};
  listaActual.filter(p => p.autoDesdeAnticipos).forEach(p => { autoPorAnioViejo[p.anio] = p; });

  const totalRetenciones = retenciones.reduce((s,r)=>s+(r.totalRetencion||0), 0);
  const anioMasBajo = aniosConAnticipo[0]; // undefined si no hay ningún anticipo

  const nuevasFilasAuto = aniosConAnticipo.map(anio => {
    const montoAnio = calcularAnticiposDelAnio(clave, anio);
    // Solo el año más bajo recibe compensación del total retenido; los demás
    // años quedan siempre en $0 (no se les traslada nada).
    const compensarAqui = (anio===anioMasBajo) ? Math.min(totalRetenciones, montoAnio) : 0;
    const previa = autoPorAnioViejo[anio] || {};
    // Resumen (de solo lectura) de la forma de pago ya registrada en las
    // retenciones de ese año — la forma de pago se gestiona en la retención
    // misma (Escenarios), no aquí, para no duplicar el dato.
    const retencionesDelAnio = retenciones.filter(r=>r.anio===anio);
    const totalBancoRet = retencionesDelAnio.reduce((s,r)=>s+((r.pagosBanco||[]).reduce((s2,x)=>s2+(x.monto||0),0)),0);
    const totalCxPRet = retencionesDelAnio.reduce((s,r)=>s+(r.cuentasPorPagarAcumulado||0),0);
    return {
      anio, monto: montoAnio, montoCompensado: compensarAqui,
      observacion: anio===anioMasBajo
        ? `Anticipos de dividendos del año ${anio} (año más bajo) — compensado con el total de retenciones formales ya realizadas — generado automáticamente`
        : `Anticipos de dividendos del año ${anio} — no recibe compensación (el total retenido se aplica solo al año más bajo) — generado automáticamente`,
      metodoPago: previa.metodoPago || null,
      pagosBanco: previa.pagosBanco || [],
      cuentasPorPagarAcumulado: previa.cuentasPorPagarAcumulado || 0,
      formaPagoRetencionesResumen: { banco: totalBancoRet, cuentasPorPagar: totalCxPRet },
      autoDesdeAnticipos: true,
    };
  });

  datosDividendosCache.pagosACuenta[clave] = [...filasManuales, ...nuevasFilasAuto];

  // Si el total retenido supera el monto del año más bajo, esa diferencia ya
  // se retuvo/pagó y NO se traslada a ningún otro año — se documenta aparte
  // como "diferencia a pagar".
  const montoAnioMasBajo = anioMasBajo!==undefined ? calcularAnticiposDelAnio(clave, anioMasBajo) : 0;
  const diferenciaAPagar = Math.max(0, totalRetenciones - montoAnioMasBajo);

  if(!datosDividendosCache.excesoPagoACuenta) datosDividendosCache.excesoPagoACuenta = {};
  const excesoPrevio = datosDividendosCache.excesoPagoACuenta[clave] || {};
  datosDividendosCache.excesoPagoACuenta[clave] = {
    monto: diferenciaAPagar,
    comoSePago: excesoPrevio.comoSePago || "",
    observacion: excesoPrevio.observacion || "",
  };
}

// Una retención ya calculada/formal NO es un "anticipo" — es la retención en
// sí. Esta función quita cualquier fila que se haya creado por error en
// "Anticipos de dividendos" vinculada a una retención (de una versión
// anterior de la app que sí las creaba), para que esa tabla quede solo con
// anticipos reales (manuales).
function limpiarAnticiposDeRetenciones(clave){
  const lista = (datosDividendosCache.anticiposDividendos||{})[clave];
  if(!lista || !lista.length) return false;
  const antes = lista.length;
  datosDividendosCache.anticiposDividendos[clave] = lista.filter(a=>!a.retencionId);
  return datosDividendosCache.anticiposDividendos[clave].length !== antes;
}

// Repara/actualiza la parte automática de "Pago a cuenta" — se ejecuta cada
// vez que se abre Escenarios o Distribución Actual: limpia cualquier
// "anticipo" que se haya generado por error desde una retención (versiones
// anteriores), y reconstruye las filas automáticas de Pago a Cuenta por año
// con el reparto FIFO de retenciones. Es idempotente, así que es seguro
// llamarla siempre.
function resincronizarRetencionesGuardadas(clave){
  const huboLimpieza = limpiarAnticiposDeRetenciones(clave);
  resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave);
  guardarDatosDividendos(datosDividendosCache);
}

// Carga los datos de una retención guardada de vuelta en el formulario para
// poder corregirla — al volver a presionar "Calcular", se ACTUALIZA el mismo
// registro (no se crea uno nuevo), y la "Utilidad Repartida" del Comparativo
// SRI se recalcula sola con el nuevo total.
function editarRetencionRealizada(id){
  const clave = empresaEscenarioSeleccionada;
  const r = (datosDividendosCache.retenciones[clave]||[]).find(x=>x.id===id);
  if(!r) return;
  retencionEnEdicionId = id;
  anioRepartoCalc = r.anio;
  modalidadRepartoCalc = r.modalidad;
  tipoBeneficiarioCalc = r.tipoBeneficiario;
  document.getElementById("calcPeriodo").value = r.periodo;
  document.getElementById("calcFechaRetencion").value = r.fechaRetencion || "";
  pintarListaAccionistasCalc();
  // Aplica los valores guardados (incluido/valorPagar/anticipo) sobre la lista recién generada
  const lista = seleccionAccionistasCalc[clave] || [];
  r.accionistas.forEach(ra => {
    const fila = lista.find(l=>l.nombre===ra.nombre);
    if(fila){ fila.incluido = true; fila.valorPagar = ra.valorPagar; fila.anticipoValor = ra.anticipoValor||0; }
  });
  pintarListaAccionistasCalc();
  document.getElementById("avisoEdicionRetencion").innerHTML = `<p class="helpNote" style="background:rgba(232,179,57,.15);padding:8px 10px;border-radius:6px;">✏️ Editando la retención de <b>${escapeHtml(r.periodo)}</b> (año ${r.anio}) — al presionar "Calcular retención y generar informes" se actualiza este mismo registro. <button class="btn small" onclick="cancelarEdicionRetencion()">Cancelar edición</button></p>`;
  document.getElementById("calcPeriodo").scrollIntoView({behavior:"smooth", block:"center"});
}

function cancelarEdicionRetencion(){
  retencionEnEdicionId = null;
  document.getElementById("avisoEdicionRetencion").innerHTML = "";
}

async function eliminarRetencionRealizada(id){
  if(!confirm("¿Eliminar esta retención guardada? Esto también quita su monto de la columna \"Utilidad Repartida\" del Comparativo SRI para ese año, y recalcula lo \"Compensado\" en Pago a Cuenta con las retenciones que queden.")) return;
  const clave = empresaEscenarioSeleccionada;
  datosDividendosCache.retenciones[clave] = (datosDividendosCache.retenciones[clave]||[]).filter(r=>r.id!==id);
  resincronizarPagoACuentaDesdeAnticiposYRetenciones(clave);
  await guardarDatosDividendos(datosDividendosCache);
  if(retencionEnEdicionId===id) cancelarEdicionRetencion();
  pintarListaRetencionesRealizadas();
  pintarListaAnticiposDividendos();
}

async function ejecutarGenerarEscenarios(){
  const anio = document.getElementById("escAnio").value.trim();
  const utilidad = parseFloat(document.getElementById("escUtilidad").value)||0;
  const pagoACuenta = parseFloat(document.getElementById("escPagoACuenta").value)||0;
  const anticipos = calcularAnticiposDelAnio(empresaEscenarioSeleccionada, parseInt(anio,10));
  const retencionesRealizadas = parseFloat(document.getElementById("escRetencionesRealizadas").value)||0;
  const instrucciones = document.getElementById("escInstrucciones").value.trim();
  if(!utilidad){ alert("Ingresa la utilidad acumulada no distribuida."); return; }
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaEscenarioSeleccionada]?.nombreHoja || empresaEscenarioSeleccionada;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[empresaEscenarioSeleccionada];
  const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
  const totalCapital = datosCapital?.suman[ultimoAnioCapital] || 1;
  const accionistas = (datosCapital?.filas||[]).map(f => {
    const porcentaje = totalCapital ? ((f.valores[ultimoAnioCapital]||0)/totalCapital*100) : 0;
    return `${f.accionista}: ${porcentaje.toFixed(2)}%`;
  }).join("\n");
  const pagos = (datosDividendosCache.pagosACuenta||{})[empresaEscenarioSeleccionada] || [];
  const pagosTexto = pagos.length ? pagos.map(p=>`Pago a cuenta año ${p.anio}: $${Number(p.monto).toFixed(2)}, plazo de compensación hasta el cierre del ejercicio ${p.anio+2}`).join("\n") : "Sin pagos a cuenta registrados";
  const pagoACuentaEstimadoTabla = calcularPagoACuentaTarifaUnica(utilidad);

  const contenido = `Empresa: ${nombreEmpresa}\nAño de análisis: ${anio}\nUtilidad acumulada no distribuida: USD $${utilidad.toFixed(2)}\nPago(s) a cuenta ya realizado (monto total relevante para esta decisión): USD $${pagoACuenta.toFixed(2)}\nDetalle de pagos a cuenta:\n${pagosTexto}\nAnticipos de dividendos ya pagados este año: USD $${anticipos.toFixed(2)}\nRetenciones ya realizadas por distribución de dividendos, disponibles para compensar el pago a cuenta (dentro de los 2 ejercicios fiscales posteriores al pago, 3 años en total contando el del pago): USD $${retencionesRealizadas.toFixed(2)}\nPago a cuenta ESTIMADO si no se distribuye antes del 31 de julio (ya calculado con la tabla de TARIFA ÚNICA del Art. 39.2.1 LRTI — 0% a 2.5% según el saldo total, aplicada sobre el 100% del monto, NO es la tabla progresiva de personas naturales — usa este valor tal cual, no lo recalcules): USD $${pagoACuentaEstimadoTabla.toFixed(2)}\nAccionistas y % de participación (según capital al año ${ultimoAnioCapital}):\n${accionistas}`;

  const estadoEl = document.getElementById("estadoEscenarios");
  document.getElementById("resultadoEscenarios").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Generando escenarios con IA...`;
  try{
    const resultado = await llamarIA("generar_escenarios_dividendos", contenido, instrucciones);
    estadoEl.textContent = "Escenarios generados.";
    document.getElementById("resultadoEscenarios").innerHTML = renderEscenariosDividendos(resultado);
    await registrarCambio("Dividendos", "generar_ia", `Escenarios de distribución generados para ${nombreEmpresa} (${anio})`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar los escenarios: " + e.message);
  }
}

let empresaDistribActualSeleccionada = null;

function pintarDistribucionActual(){
  const cont = document.getElementById("dividendosContenido");
  if(!datosDividendosCache){ cont.innerHTML = `<div class="card emptyState">Primero importa el archivo en la pestaña "Importar".</div>`; return; }

      <div class="field"><label>Empresa</label>
        <select id="selEmpresaDistribActual" onchange="cambiarEmpresaDistribActual(this.value)">
          <option value="">-- selecciona una empresa --</option>
          ${empresas.map(k=>`<option value="${k}" ${empresaDistribActualSeleccionada===k?'selected':''}>${escapeHtml(datosDividendosCache.porEmpresa[k].nombreHoja)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div id="distribActualContenido"></div>
  `;
  if(empresaDistribActualSeleccionada) pintarDetalleDistribActual();

  pintarDetalleDistribActual();

function recalcularPorcentajesIncluidosArr(accionistas){
  const incluidos = accionistas.filter(a=>a.incluido);
  const sumaBase = incluidos.reduce((s,a)=>s+(a.porcentajeBase||0),0) || 1;
  incluidos.forEach(a => { a.porcentaje = (a.porcentajeBase/sumaBase)*100; });
  accionistas.filter(a=>!a.incluido).forEach(a => { a.porcentaje = 0; });
}

function obtenerOInicializarDistribActual(clave){
  if(!datosDividendosCache.distribucionActual) datosDividendosCache.distribucionActual = {};
  if(!datosDividendosCache.distribucionActual[clave]){
    const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
    const datosResumenDiv = datosDividendosCache.resumenDividendos.empresas[clave];
    const ultimoAnioCapital = Math.max(...datosDividendosCache.resumenCapital.anios);
    const totalCapital = datosCapital?.suman[ultimoAnioCapital] || 1;
    const utilidadAcumulada = datosDividendosCache.resumenDividendos.anios.reduce((s,a)=> s+(datosResumenDiv?.suman[a]||0), 0);

    // Checklist de posibles accionistas: unión de nombres vistos en capital y en dividendos
    const nombresUnion = Array.from(new Set([
      ...(datosCapital?.filas||[]).map(f=>f.accionista),
      ...(datosResumenDiv?.filas||[]).map(f=>f.accionista)
    ]));

    const accionistas = nombresUnion.map(nombre => {
      const filaCapital = (datosCapital?.filas||[]).find(f=>f.accionista===nombre);
      const capitalActual = filaCapital ? (filaCapital.valores[ultimoAnioCapital]||0) : 0;
      const porcentajeBase = totalCapital ? (capitalActual/totalCapital*100) : 0;
      return {
        nombre,
        incluido: capitalActual > 0, // sugerencia inicial: accionista actual = tiene capital > 0 en el último año
        porcentajeBase,
        porcentaje: porcentajeBase,
        tuvoAnticipo: false, anticipoMonto: 0, anticipoImpuesto: 0,
        montoDispuestoPagar: 0,
        retencionCalculada: null, saldoPendiente: null, recomendacion: ""
      };
    });
    recalcularPorcentajesIncluidosArr(accionistas);

    datosDividendosCache.distribucionActual[clave] = {
      utilidadTotal: utilidadAcumulada,
      accionistas,
      planAnios: [],
      ultimoResultadoIA: null
    };
  }
  return datosDividendosCache.distribucionActual[clave];
}

// Trae la "Utilidad Acumulada" ya calculada en el Comparativo SRI/Súper
// Cías/Contable para ESTA MISMA empresa, hasta el año elegido, y la usa como
// base de "Utilidad acumulada total a repartir" — reutiliza exactamente la
// misma lógica de cálculo que la pestaña Comparativo (calcularFilasComparativo),
// así que el número siempre coincide con lo que se ve ahí.
function traerUtilidadAcumuladaDeComparativo(clave){
  const anioSel = parseInt(document.getElementById("anioTraerAcumuladoComparativo").value, 10);
  const filas = calcularFilasComparativo(clave);
  const fila = filas.find(f => f.anio === anioSel);
  const valor = fila ? (fila.acumuladoMostrado||0) : 0;
  const datos = obtenerOInicializarDistribActual(clave);
  datos.utilidadTotal = valor;
  pintarDetalleDistribActual();
  setSafeText("estadoTraerAcumulado", `Se trajo $${valor.toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2})} del año ${anioSel} (Comparativo SRI...). Presiona "💾 Guardar" para conservarlo.`);
}

function actualizarAccionistaDistrib(idx, campo, valor){
  const datos = datosDividendosCache.distribucionActual[empresaDistribActualSeleccionada];
  datos.accionistas[idx][campo] = valor;
  pintarTablaAccionistasDistrib();
}

function pintarTablaAniosDistrib(){
  const cont = document.getElementById("tablaAniosDistrib");
  const datos = datosDividendosCache.distribucionActual[empresaDistribActualSeleccionada];
  if(!datos.planAnios.length){ cont.innerHTML = `<p style="color:var(--muted);">Aún no hay años agregados al plan.</p>`; return; }
  // Acumulado calculado localmente (por si se agregaron/editaron años manualmente después de un plan de IA)
  let acumulado = 0;
  const aniosOrdenados = [...datos.planAnios].sort((a,b)=>a.anio-b.anio);
  const acumuladoPorAnio = {};
  aniosOrdenados.forEach(p => { acumulado += (p.monto||0); acumuladoPorAnio[p.anio] = acumulado; });

  cont.innerHTML = `<table style="font-size:12px;"><thead><tr>
      <th>Año</th><th>Monto ese año</th><th>Acumulado</th><th>¿Se retuvo impuesto?</th><th>Retención (IA)</th><th>Recomendación</th><th></th>
    </tr></thead><tbody>
    ${datos.planAnios.map((p,idx) => `<tr>
      <td><input type="number" style="width:80px;" value="${p.anio}" onchange="actualizarAnioPlanDistrib(${idx},'anio',parseInt(this.value,10)||0)"></td>
      <td><input type="number" style="width:100px;" value="${p.monto}" onchange="actualizarAnioPlanDistrib(${idx},'monto',parseFloat(this.value)||0)"></td>
      <td>$${(acumuladoPorAnio[p.anio]||0).toFixed(2)}</td>
      <td><input type="checkbox" ${p.seRetuvo?'checked':''} onchange="actualizarAnioPlanDistrib(${idx},'seRetuvo',this.checked)"></td>
      <td>${p.retencionCalculada!==null&&p.retencionCalculada!==undefined?escapeHtml(String(p.retencionCalculada)):'-'}</td>
      <td>${escapeHtml(p.recomendacion||'-')}</td>
      <td><button class="btn small danger" onclick="quitarAnioPlanDistrib(${idx})">Quitar</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}

async function ejecutarGenerarPlanMultianual(){
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaDistribActualSeleccionada]?.nombreHoja || empresaDistribActualSeleccionada;
  const datos = datosDividendosCache.distribucionActual[empresaDistribActualSeleccionada];
  const incluidos = datos.accionistas.filter(a=>a.incluido);
  if(!incluidos.length){ alert("Marca al menos un accionista como 'Actual' en el checklist antes de generar el plan."); return; }
  const textoAccionistas = incluidos.map(a => `- ${a.nombre}: ${a.porcentaje.toFixed(2)}% de participación`).join("\n");
  const pagos = (datosDividendosCache.pagosACuenta||{})[empresaDistribActualSeleccionada] || [];
  const hoyAnio = new Date().getFullYear();
  const pagosVigentes = pagos.filter(p => hoyAnio <= (p.anio+2));
  const pagosTexto = pagosVigentes.length ? pagosVigentes.map(p=>`Pago a cuenta año ${p.anio}: $${montoEfectivoPagoACuenta(p).toFixed(2)}, plazo de compensación hasta el cierre del ejercicio ${p.anio+2}`).join("\n") : "Sin pagos a cuenta vigentes";

  const contenido = `Empresa: ${nombreEmpresa}\nUtilidad acumulada total a distribuir: USD $${datos.utilidadTotal.toFixed(2)}\nAño de inicio del plan: ${hoyAnio}\nAccionistas actuales y % de participación:\n${textoAccionistas}\nPagos a cuenta vigentes:\n${pagosTexto}`;

  const estadoEl = document.getElementById("estadoPlanMultianual");
  document.getElementById("resultadoPlanMultianual").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Generando plan con IA...`;
  try{
    const resultado = await llamarIA("generar_plan_multianual_dividendos", contenido, "");
    // Reemplaza el plan de años con la recomendación de la IA
    datos.planAnios = (resultado.plan_anios||[]).map(p => ({
      anio: parseInt(p.anio,10) || hoyAnio,
      monto: parseFloat(String(p.monto_ese_anio||"").replace(/[^0-9.-]/g,"")) || 0,
      seRetuvo: false,
      retencionCalculada: p.retencion_estimada || null,
      recomendacion: p.recomendacion || "",
      montoAcumuladoIA: p.monto_acumulado || null
    }));
    await guardarDatosDividendos(datosDividendosCache);
    await registrarCambio("Dividendos", "generar_ia", `Plan multi-año generado con IA para ${nombreEmpresa}`);
    estadoEl.textContent = "Plan generado.";
    document.getElementById("resultadoPlanMultianual").innerHTML = renderPlanMultianual(resultado);
    pintarTablaAniosDistrib();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar el plan: " + e.message);
  }
}

function renderPlanMultianual(r){
  if(!r) return "";
  return `<div class="aiBox">
    <h4>Resumen del plan</h4><p>${escapeHtml(r.resumen||'')}</p>
    ${r.plan_anios?.length?`<table><thead><tr><th>Año</th><th>Monto ese año</th><th>Acumulado</th><th>Retención estimada</th><th>Recomendación</th></tr></thead><tbody>
      ${r.plan_anios.map(p=>`<tr><td>${escapeHtml(p.anio||'')}</td><td>${escapeHtml(p.monto_ese_anio||'')}</td><td>${escapeHtml(p.monto_acumulado||'')}</td><td>${escapeHtml(p.retencion_estimada||'')}</td><td>${escapeHtml(p.recomendacion||'')}</td></tr>`).join("")}
    </tbody></table>`:''}
    ${r.recomendacion_general?`<h4>Recomendación general</h4><p>${escapeHtml(r.recomendacion_general)}</p>`:''}
  </div>`;
}

async function ejecutarCalculoDistribActual(){
  const nombreEmpresa = datosDividendosCache.porEmpresa[empresaDistribActualSeleccionada]?.nombreHoja || empresaDistribActualSeleccionada;
  const datos = datosDividendosCache.distribucionActual[empresaDistribActualSeleccionada];
  const accionistasIncluidos = datos.accionistas.filter(a=>a.incluido);
  if(!accionistasIncluidos.length){ alert("Marca al menos un accionista como 'Actual' en el checklist antes de calcular."); return; }
  const textoAccionistas = accionistasIncluidos.map(a => {
    const corresponde = datos.utilidadTotal*(a.porcentaje/100);
    return `- ${a.nombre}: ${a.porcentaje.toFixed(2)}% de participación, le corresponde $${corresponde.toFixed(2)} del total acumulado. ${a.tuvoAnticipo ? `Ya recibió un anticipo de $${a.anticipoMonto.toFixed(2)}, con $${a.anticipoImpuesto.toFixed(2)} de impuesto ya retenido en ese anticipo.` : "No ha recibido anticipos."} La empresa está dispuesta a pagarle ahora: $${a.montoDispuestoPagar.toFixed(2)}.`;
  }).join("\n");
  let acumuladoPlan = 0;
  const aniosOrdenados = [...datos.planAnios].sort((a,b)=>a.anio-b.anio);
  const textoAnios = aniosOrdenados.length
    ? aniosOrdenados.map(p => {
        acumuladoPlan += (p.monto||0);

    : "No se ha definido un plan de años específico.";
  const contenido = `Empresa: ${nombreEmpresa}\nUtilidad acumulada total a repartir entre los accionistas actuales marcados en el checklist: USD $${datos.utilidadTotal.toFixed(2)}\n\nAccionistas actuales (checklist):\n${textoAccionistas}\n\nPlan de distribución por año (calcula la retención de cada año considerando tanto el monto individual de ese año como el acumulado del plan hasta ese punto):\n${textoAnios}`;

  const estadoEl = document.getElementById("estadoDistribActual");

  estadoEl.innerHTML = `<span class="spinner"></span> Calculando con IA...`;
  try{

    (resultado.tabla_accionistas||[]).forEach(r => {

        acc.retencionCalculada = r.retencion_calculada_sobre_este_pago;

    (resultado.tabla_anios||[]).forEach(r => {

        p.retencionCalculada = r.retencion_calculada;
        p.recomendacion = r.recomendacion;
      }
    });
    datos.ultimoResultadoIA = resultado;
    datos.ultimoUtilidadTotalUsada = datos.utilidadTotal;
    await guardarDatosDividendos(datosDividendosCache);
    await registrarCambio("Dividendos", "generar_ia", `Cálculo de distribución a accionistas actuales generado: ${nombreEmpresa}`);
    estadoEl.textContent = "Cálculo completo.";

}

function clasificarSociosEmpresa(clave){
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const anios = datosDividendosCache.resumenCapital.anios;
  if(!datosCapital || !anios.length) return [];
  const ultimoAnio = anios[anios.length-1];
  const totalCapitalActual = datosCapital.suman[ultimoAnio] || 0;
  return datosCapital.filas.map(f => {
    const capitalActual = f.valores[ultimoAnio] || 0;
    const esActual = capitalActual > 0;
    // Si ya no tiene saldo actual, buscar el último año en que sí tuvo capital
    let ultimoAnioConSaldo = null, ultimoCapitalConSaldo = 0;
    if(!esActual){
      for(let i=anios.length-1; i>=0; i--){
        const v = f.valores[anios[i]]||0;
        if(v>0){ ultimoAnioConSaldo = anios[i]; ultimoCapitalConSaldo = v; break; }
      }
    }
    return {
      nombre: f.accionista,
      clasificacion: esActual ? "Actual" : (ultimoAnioConSaldo ? "Anterior" : "Sin capital registrado"),
      capital: esActual ? capitalActual : ultimoCapitalConSaldo,
      acciones: esActual ? capitalActual : ultimoCapitalConSaldo, // 1 acción = USD $1
      porcentaje: esActual ? (totalCapitalActual ? (capitalActual/totalCapitalActual*100) : 0) : null,
      anioReferencia: esActual ? ultimoAnio : ultimoAnioConSaldo
    };
  });
}

      <table><thead><tr><th>Socio</th><th>Clasificación</th><th>Capital (USD)</th><th>Acciones equivalentes</th><th>% participación</th><th>Año de referencia</th></tr></thead><tbody>

          <td>${escapeHtml(s.nombre)}</td>

const ANIO_INICIO_COMPARATIVO = 1992;

      <div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="archivoImportarComparativo" accept=".xlsx,.xls"></div>
      <button class="btn primary" onclick="ejecutarImportarComparativoExcel()">Importar a ${escapeHtml(datosDividendosCache.porEmpresa[empresaComparativoSeleccionada]?.nombreHoja||'')}</button>
      <span id="estadoImportarComparativo" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>

async function ejecutarImportarComparativoExcel(){
  const input = document.getElementById("archivoImportarComparativo");
  const file = input.files[0];
  if(!file){ alert("Selecciona el archivo Excel primero."); return; }
  if(!empresaComparativoSeleccionada){ alert("Selecciona primero la empresa."); return; }
  const estadoEl = document.getElementById("estadoImportarComparativo");
  estadoEl.innerHTML = `<span class="spinner"></span> Leyendo archivo...`;
  try{
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});

    const normaliza = s => (s||"").toString().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
    let filaEncabezado = -1, colImpuesto=-1, colParticipacion=-1, colReserva=-1;
    for(let i=0;i<filas.length;i++){
      const fila = filas[i]||[];
      for(let j=0;j<fila.length;j++){
        const val = normaliza(fila[j]);
        if(!val) continue;
        if(val.includes("IMPUESTO CAUSADO")) colImpuesto=j;
        else if(val.includes("PARTICIPACION")) colParticipacion=j;
        else if(val.includes("RESERVA LEGAL")) colReserva=j;
      }
      if(colImpuesto>=0 || colParticipacion>=0 || colReserva>=0){ filaEncabezado=i; break; }
    }
    if(filaEncabezado===-1){
      throw new Error(`No se encontraron columnas con encabezado "Impuesto Causado", "Participación Trabajadores" o "Reserva Legal" en el archivo.`);
    }

    // Detecta la columna del año: la que, en las filas debajo del encabezado,
    // tenga sobre todo números enteros entre 1900 y 2100.
    let colAnio = -1;
    for(let j=0; j<12; j++){
      let aciertos=0, total=0;
      for(let i=filaEncabezado+1; i<filas.length; i++){
        const v = (filas[i]||[])[j];
        if(v===null||v===undefined||v==="") continue;
        total++;
        if(typeof v==="number" && Number.isInteger(v) && v>=1900 && v<=2100) aciertos++;
      }
      if(total>0 && aciertos/total>0.7){ colAnio=j; break; }
    }
    if(colAnio===-1){
      throw new Error("No se pudo identificar automáticamente la columna del año en el archivo.");
    }

    const clave = empresaComparativoSeleccionada;
    let aniosImportados = 0;
    for(let i=filaEncabezado+1; i<filas.length; i++){
      const fila = filas[i]||[];
      const anio = fila[colAnio];
      if(typeof anio!=="number" || !Number.isInteger(anio) || anio<1900 || anio>2100) continue;
      let huboDato = false;
      const f = obtenerFilaComparativo(clave, anio);
      const v = (col) => { const x = fila[col]; return (x===null||x===undefined||x==="") ? null : Number(x); };
      if(colImpuesto>=0 && v(colImpuesto)!==null){ f.impuestoCausado = v(colImpuesto); huboDato = true; }
      if(colParticipacion>=0 && v(colParticipacion)!==null){ f.participacionTrabajadoresRepartida = v(colParticipacion); huboDato = true; }
      if(colReserva>=0 && v(colReserva)!==null){ f.reservaLegal = v(colReserva); huboDato = true; }
      if(huboDato) aniosImportados++;
    }
    if(!aniosImportados){ throw new Error("No se encontró ningún año con datos válidos para importar."); }

    await guardarDatosDividendos(datosDividendosCache);
    estadoEl.textContent = `Se importaron datos de ${aniosImportados} año(s).`;
    input.value = "";
    pintarTablaComparativoSri();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo importar el archivo: " + (e.message||String(e)));
  }
}


function cambiarEmpresaComparativo(clave){
  empresaComparativoSeleccionada = clave || null;
  pintarComparativoSri();
}

function obtenerFilaComparativo(clave, anio){
  if(!datosDividendosCache.comparativoSri) datosDividendosCache.comparativoSri = {};
  if(!datosDividendosCache.comparativoSri[clave]) datosDividendosCache.comparativoSri[clave] = {};
  if(!datosDividendosCache.comparativoSri[clave][anio]){
    datosDividendosCache.comparativoSri[clave][anio] = {
      sri:null, superCias:null, contable:null, valorRealFuente:"sri",
      participacionTrabajadores:null, participacionTrabajadoresRepartida:null, impuestoCausado:null,
      reservaLegal:null, otrasReservas:null, utilidadADistribuir:null, utilidadAcumuladaManual:null
    };
  }
  return datosDividendosCache.comparativoSri[clave][anio];
}

async function actualizarCeldaComparativo(clave, anio, campo, valor){
  const fila = obtenerFilaComparativo(clave, anio);
  fila[campo] = (campo==="valorRealFuente") ? valor : (valor===""? null : parseFloat(valor));
  await guardarDatosDividendos(datosDividendosCache);
  pintarTablaComparativoSri();
}

// Calcula, para una empresa, todas las filas del comparativo (1992-año actual)
// con sus valores derivados (Valor Real, Participación 15%, Utilidad a
// Distribuir, Utilidad Acumulada encadenada) ya resueltos. Se usa tanto para
// pintar la tabla editable en pantalla como para el informe impreso/PDF y la
// exportación a Excel, para que los tres siempre muestren los mismos números.
// Detecta si hay una diferencia relevante (>1 centavo) entre "Participación
// Trabajadores" (calculada o manual) y "Participación Trabajadores
// Repartida" (lo que realmente se repartió) — usado para resaltar en rojo.
function hayDiferenciaParticipacion(fila){
  const a = fila.participacionMostrada;
  const b = fila.raw.participacionTrabajadoresRepartida;
  if(a===null||a===undefined||b===null||b===undefined) return false;
  return Math.abs(Number(a)-Number(b)) > 0.01;
}

// Suma el total efectivamente pagado (valor a repartir) de todas las
// "retenciones realizadas" guardadas para esa empresa en ese año — esto es
// lo que alimenta la columna "Utilidad Repartida" del Comparativo SRI.
function calcularUtilidadRepartidaAnio(clave, anio){
  const lista = (datosDividendosCache.retenciones||{})[clave] || [];
  return lista.filter(r=>r.anio===anio).reduce((s,r)=>s+(r.totalValorPagar||0), 0);
}

function calcularFilasComparativo(clave){
  const anioActual = new Date().getFullYear();
  const datosPorAnio = (datosDividendosCache.comparativoSri||{})[clave] || {};
  let acumuladoAnterior = 0; // 1991 por defecto
  const filas = [];
  for(let anio=ANIO_INICIO_COMPARATIVO; anio<=anioActual; anio++){
    const f = datosPorAnio[anio] || { sri:null, superCias:null, contable:null, valorRealFuente:"sri", participacionTrabajadores:null, participacionTrabajadoresRepartida:null, impuestoCausado:null, reservaLegal:null, otrasReservas:null, utilidadADistribuir:null, utilidadAcumuladaManual:null };
    const valorReal = f[f.valorRealFuente==="superCias"?"superCias":(f.valorRealFuente==="contable"?"contable":"sri")];

    const participacionEsAuto = f.participacionTrabajadores===null || f.participacionTrabajadores===undefined;
    const participacionCalculada = (valorReal!==null && valorReal!==undefined) ? Number(valorReal)*0.15 : null;
    const participacionMostrada = participacionEsAuto ? participacionCalculada : f.participacionTrabajadores;

    const utilidadEsAuto = f.utilidadADistribuir===null || f.utilidadADistribuir===undefined;
    const utilidadCalculada = (valorReal!==null && valorReal!==undefined)
      ? Number(valorReal) - (f.participacionTrabajadoresRepartida||0) - (f.impuestoCausado||0) - (f.reservaLegal||0) - (f.otrasReservas||0)
      : null;
    const utilidadMostrada = utilidadEsAuto ? utilidadCalculada : f.utilidadADistribuir;

    // Utilidad Repartida: suma de "retenciones realizadas" (dividendos ya
    // efectivamente pagados/procesados) guardadas para este año. Se resta del
    // acumulado, porque una vez pagada, esa utilidad deja de estar "retenida/
    // acumulada" en la empresa.
    const utilidadRepartidaAnio = calcularUtilidadRepartidaAnio(clave, anio);

    const acumuladoCalculado = acumuladoAnterior + (utilidadMostrada||0) - utilidadRepartidaAnio;
    const acumuladoEsAuto = f.utilidadAcumuladaManual===null || f.utilidadAcumuladaManual===undefined;
    const acumuladoMostrado = acumuladoEsAuto ? acumuladoCalculado : f.utilidadAcumuladaManual;
    acumuladoAnterior = acumuladoMostrado;

    filas.push({
      anio, raw:f, valorReal,
      participacionMostrada, participacionEsAuto,
      utilidadMostrada, utilidadEsAuto,
      utilidadRepartidaAnio,
      acumuladoMostrado, acumuladoEsAuto
    });
  }
  return filas;
}

  const win = window.open("", "_blank");
  win.document.write(construirHtmlInformeComparativo());
  win.document.close();
  win.focus();
  win.print();
}

function descargarPDFComparativoSri(){
  if(!empresaComparativoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const win = window.open("", "_blank");

    "</body></html>",
    `<script>window.onload = () => setTimeout(() => window.print(), 250);<\/script></body></html>`
