async function agregarPuntoManual(equipoId){
  const input = document.getElementById("nuevoPuntoManual");
  const desc = input.value.trim();
  if(!desc){ alert("Escribe la descripción del punto."); return; }
  const eq = equiposCache.find(x=>x.id===equipoId);
  const nuevoPunto = { id:"p_"+Date.now()+"_"+Math.floor(Math.random()*10000), descripcion:desc, soportes:[], observacion:"", cumplido:false, analisisIA:null };
  const nuevosPuntos = [...(eq.puntos||[]), nuevoPunto];
  await guardarEquipo({ puntos: nuevosPuntos }, equipoId);
  equiposCache = await cargarEquipos();
  input.value = "";
  pintarListaPuntosProyecto(equipoId, nuevosPuntos);
}

async function ejecutarGenerarPuntos(equipoId){
  const texto = document.getElementById("eqTextoRespaldo").value.trim();
  if(!texto){ alert("Sube un archivo o pega el texto del documento de respaldo."); return; }
  const estadoEl = document.getElementById("eqEstadoPuntos");
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA("generar_puntos_proyecto", texto, "");
    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntosExistentes = eq.puntos||[];
    const nuevosPuntos = [
      ...puntosExistentes,
      ...(resultado.puntos||[]).map(desc => ({
        id: "p_"+Date.now()+"_"+Math.floor(Math.random()*10000),
        descripcion: desc, soportes: [], observacion: "", cumplido: false, analisisIA: null
      }))
    ];
    await guardarEquipo({ textoRespaldo: texto, puntos: nuevosPuntos }, equipoId);
    equiposCache = await cargarEquipos();
    estadoEl.textContent = `Se generaron ${resultado.puntos?.length||0} puntos.`;
    pintarListaPuntosProyecto(equipoId, nuevosPuntos);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar los puntos: " + e.message);
  }
}

async function guardarLinkGeneral(equipoId, url){
  await guardarEquipo({ linkRespaldoGeneral: url.trim() }, equipoId);
  equiposCache = await cargarEquipos();
}

async function ejecutarAnalizarLinkGeneral(equipoId, checkboxEl){
  if(!checkboxEl.checked) return; // solo dispara al marcar, no al desmarcar
  const eq = equiposCache.find(x=>x.id===equipoId);
  const url = document.getElementById("eqLinkGeneral").value.trim();
  const puntos = eq.puntos||[];
  if(!url){ alert("Pega el enlace primero."); checkboxEl.checked = false; return; }
  if(!puntos.length){ alert("Este proyecto todavía no tiene puntos requeridos generados."); checkboxEl.checked = false; return; }
  await guardarLinkGeneral(equipoId, url);
  setSafeHTML("eqEstadoLinkGeneral", `<span class="spinner"></span> Leyendo enlace...`);
  setSafeHTML("resultadoLinkGeneral", "");
  try{
    const leido = await leerEnlace(url);
    setSafeText("eqEstadoLinkGeneral", "Enlace leído. Analizando con IA...");
    const listaPuntos = puntos.map((p,i) => `${i+1}. ${p.descripcion}`).join("\n");
    const resultado = leido.tipo==="pdf"
      ? await llamarIAConPdfs("analizar_respaldo_general_proyecto", null, listaPuntos, [{ data: leido.pdfBase64, nombre: url }])
      : await llamarIA("analizar_respaldo_general_proyecto", leido.texto, listaPuntos);
    await guardarEquipo({ analisisRespaldoGeneral: resultado }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeText("eqEstadoLinkGeneral", "Análisis completo.");
    setSafeHTML("resultadoLinkGeneral", renderAnalisisRespaldoGeneral(resultado));
  }catch(e){
    setSafeText("eqEstadoLinkGeneral", "");
    alert("No se pudo leer/analizar el enlace: " + e.message);
    checkboxEl.checked = false;
  }
}

// Analiza un .zip como respaldo de todos los puntos del proyecto. El ZIP se
// procesa por completo en el navegador y NUNCA se guarda (ni el zip ni los
// archivos que trae adentro) — solo se guarda el resultado del análisis de
// la IA, igual que con el link general.
async function ejecutarAnalizarZipGeneral(equipoId){
  const input = document.getElementById("eqZipGeneral");
  const file = input.files[0];
  if(!file){ alert("Selecciona un archivo .zip primero."); return; }
  const eq = equiposCache.find(x=>x.id===equipoId);
  const puntos = eq.puntos||[];
  if(!puntos.length){ alert("Este proyecto todavía no tiene puntos requeridos generados."); return; }
  setSafeHTML("eqEstadoLinkGeneral", `<span class="spinner"></span> Leyendo ZIP (puede tardar si trae muchos archivos)...`);
  setSafeHTML("resultadoLinkGeneral", "");
  try{
    const leido = await leerZip(file);
    if(!leido.textos.length && !leido.pdfsNativos.length){
      throw new Error(`No se pudo leer ningún archivo dentro del ZIP (${leido.totalArchivos} archivo(s) revisados). Formatos soportados: PDF, Excel, Word, TXT.`);
    }
    setSafeText("eqEstadoLinkGeneral", `Se leyeron ${leido.textos.length + leido.pdfsNativos.length} de ${leido.totalArchivos} archivo(s). Analizando con IA...`);
    const listaPuntos = puntos.map((p,i) => `${i+1}. ${p.descripcion}`).join("\n");
    const contenidoCombinado = leido.textos.map(t => `--- Archivo: ${t.nombre} ---\n${t.contenido}`).join("\n\n") || null;
    const resultado = leido.pdfsNativos.length
      ? await llamarIAConPdfs("analizar_respaldo_general_proyecto", contenidoCombinado, listaPuntos, leido.pdfsNativos)
      : await llamarIA("analizar_respaldo_general_proyecto", contenidoCombinado, listaPuntos);
    await guardarEquipo({ analisisRespaldoGeneral: resultado }, equipoId);
    equiposCache = await cargarEquipos();
    const notaNoLegibles = leido.noLegibles.length ? ` (no se pudieron leer: ${leido.noLegibles.join(", ")})` : "";
    setSafeText("eqEstadoLinkGeneral", "Análisis completo." + notaNoLegibles);
    setSafeHTML("resultadoLinkGeneral", renderAnalisisRespaldoGeneral(resultado));
    input.value = "";
  }catch(e){
    setSafeText("eqEstadoLinkGeneral", "");
    alert("No se pudo leer/analizar el ZIP: " + e.message);
  }
}

function renderAnalisisRespaldoGeneral(r){
  if(!r) return "";
  const iconoJustifica = {si:"✅ Sí justifica", no:"🔴 No justifica", parcial:"🟡 Justifica parcialmente"};
  return `<div class="aiBox" style="margin-top:10px;">

    ${r.puntos?.length?`<table><thead><tr><th>Punto</th><th>¿Lo respalda?</th><th>Comentario</th></tr></thead><tbody>
      ${r.puntos.map(p=>`<tr><td>${escapeHtml(p.descripcion||'')}</td><td>${iconoJustifica[p.justifica]||escapeHtml(p.justifica||'')}</td><td>${escapeHtml(p.comentario||'')}</td></tr>`).join("")}

function renderSoportesPunto(equipoId, puntoId, soportes){

    return `<span class="pill muted" style="margin:2px;display:inline-flex;align-items:center;gap:6px;">${etiqueta}
      <button class="btn small danger" style="padding:1px 6px;font-size:11px;" onclick="eliminarSoportePunto('${equipoId}','${puntoId}',${idx})" title="Eliminar este adjunto">×</button>

// El modal de detalle del equipo puede cerrarse mientras una operación async
// (guardar, subir, analizar) sigue en curso. Estos helpers evitan que la app
// truene con "Cannot set properties of null" si el elemento ya no está en el
// DOM para cuando la operación termina — el dato ya se guardó correctamente
// en Firebase de todas formas, solo se omite la actualización visual.
function setSafeHTML(id, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = html;
}
function setSafeText(id, texto){
  const el = document.getElementById(id);
  if(el) el.textContent = texto;
}

async function eliminarSoportePunto(equipoId, puntoId, idxSoporte){
  if(!confirm("¿Eliminar este adjunto/soporte?")) return;
  try{
    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    const soporteAEliminar = (puntos[idx].soportes||[])[idxSoporte];
    const nuevosSoportes = (puntos[idx].soportes||[]).filter((_,i)=>i!==idxSoporte);
    puntos[idx] = {...puntos[idx], soportes: nuevosSoportes};
    await guardarEquipo({ puntos }, equipoId);
    // Si el soporte tenía un PDF pesado guardado aparte, lo borramos también.
    if(soporteAEliminar && soporteAEliminar.pdfRef){
      eliminarPdfSoporte(soporteAEliminar.pdfRef).catch(e=>console.warn("No se pudo borrar el PDF pesado asociado", e));
    }
    equiposCache = await cargarEquipos();
    setSafeHTML("soportes_"+puntoId, renderSoportesPunto(equipoId, puntoId, nuevosSoportes));
  }catch(e){
    alert("No se pudo eliminar el adjunto: " + (e.message||e));
  }
}

// Evita que la extracción de texto se quede colgada indefinidamente con
// archivos problemáticos: si no termina en el plazo dado, sigue adelante
// como si no se hubiera podido extraer texto (en vez de trabar la interfaz).
function conTimeout(promesa, ms){
  return Promise.race([
    promesa,
    new Promise(resolve => setTimeout(()=>resolve(""), ms))
  ]);
}

const TAMANIO_MAXIMO_PDF_NATIVO = 4*1024*1024; // 4 MB: deja margen bajo el límite de tamaño de solicitud de Netlify
const TAMANIO_MAXIMO_LECTURA_LOCAL = 15*1024*1024; // 15 MB: por encima de esto no intentamos ni renderizar el PDF con pdf.js (para no trabar el navegador)

async function agregarSoporteArchivo(equipoId, puntoId){
  const input = document.getElementById("archivo_"+puntoId);
  const file = input.files[0];
  if(!file){ alert("Selecciona un archivo primero."); return; }
  const esPdf = /\.pdf$/i.test(file.name) || file.type==="application/pdf";
  try{
    let textoUtil = "";
    if(file.size > TAMANIO_MAXIMO_LECTURA_LOCAL){
      // Archivo muy pesado: no intentamos renderizar cada página con pdf.js
      // (eso es lo que trababa el navegador); vamos directo a adjuntarlo para
      // que la IA lo lea, si es PDF y cabe dentro del límite de envío.
      setSafeText("estadoPunto_"+puntoId, "Archivo pesado: se omite la lectura local de texto...");
    } else {
      setSafeText("estadoPunto_"+puntoId, "Leyendo archivo (puede tardar unos segundos si es grande)...");
      const textoBruto = await conTimeout(extraerTextoDeArchivo(file), 20000);
      // Umbral: un PDF escaneado puede devolver un puñado de caracteres "basura"
      // (metadatos, números de página sueltos, una capa de OCR parcial) que no
      // alcanza para que la IA analice el contenido real. Si hay menos de 40
      // caracteres útiles, lo tratamos igual que "sin texto".
      textoUtil = (textoBruto||"").trim().length >= 40 ? textoBruto.trim() : "";
    }

    const eq = equiposCache.find(x=>x.id===equipoId);
    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    const nuevoSoporte = { tipo:"archivo", nombre:file.name, contenidoTexto: textoUtil };
    let mensajeEstado;

    if(esPdf && !textoUtil){
      if(file.size > TAMANIO_MAXIMO_PDF_NATIVO){
        mensajeEstado = `Archivo adjuntado, pero pesa ${(file.size/1024/1024).toFixed(1)} MB y no tiene texto extraíble — supera el límite de ${(TAMANIO_MAXIMO_PDF_NATIVO/1024/1024)} MB para que la IA lo lea directamente. Comprímelo, divídelo en partes más pequeñas, o pega el texto manualmente.`;
      } else {
        setSafeText("estadoPunto_"+puntoId, "Convirtiendo PDF para envío a la IA...");
        const soporteId = "sp_"+Date.now()+"_"+Math.floor(Math.random()*100000);
        const base64 = await archivoABase64(file);
        await guardarPdfSoporte(soporteId, base64);
        nuevoSoporte.pdfRef = soporteId;
        mensajeEstado = "Archivo adjuntado. No tiene texto extraíble útil (parece un escaneo/imagen) — la IA leerá el PDF directamente al analizar este punto.";
      }
    } else {
      mensajeEstado = textoUtil ? "Archivo adjuntado y leído." : "Archivo adjuntado (no se pudo extraer texto automáticamente; formato no compatible con lectura automática).";
    }

    puntos[idx] = {...puntos[idx], soportes:[...(puntos[idx].soportes||[]), nuevoSoporte]};
    await guardarEquipo({ puntos }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeHTML("soportes_"+puntoId, renderSoportesPunto(equipoId, puntoId, puntos[idx].soportes));
    setSafeText("estadoPunto_"+puntoId, mensajeEstado);
    input.value = "";
  }catch(e){
    setSafeText("estadoPunto_"+puntoId, "");
    alert("No se pudo adjuntar el archivo: " + (e.message||e));
  }
}

async function ejecutarAnalizarPunto(equipoId, puntoId){
  const eq = equiposCache.find(x=>x.id===equipoId);
  const punto = (eq.puntos||[]).find(x=>x.id===puntoId);
  const soportes = punto.soportes||[];
  const soportesArchivoConTexto = soportes.filter(s => s.tipo==="archivo" && s.contenidoTexto);
  const soportesLink = soportes.filter(s => s.tipo==="link");
  // Soportes que son PDF sin texto extraíble (escaneos/imágenes): su PDF se guardó
  // aparte (pdfRef) y se carga bajo demanda justo antes de llamar a la IA.
  const soportesPdfNativos = soportes.filter(s => s.tipo==="archivo" && !s.contenidoTexto && s.pdfRef);
  if(!soportesArchivoConTexto.length && !soportesPdfNativos.length && !soportesLink.length){ alert("Adjunta al menos un soporte (archivo o link) antes de analizar."); return; }
  setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Analizando con IA...`);
  try{
    const partesTexto = soportesArchivoConTexto.map(s => `Archivo "${s.nombre}": ${s.contenidoTexto}`);
    const pdfs = [];

    // Intenta leer cada enlace (OneDrive/Drive) para que la IA analice su
    // contenido real, en vez de solo saber que existe el enlace.
    if(soportesLink.length){
      setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Leyendo enlace(s)...`);
      for(const s of soportesLink){
        try{
          const leido = await leerEnlace(s.url);
          if(leido.tipo==="pdf") pdfs.push({ data: leido.pdfBase64, nombre: s.nombre||s.url });
          else partesTexto.push(`Enlace "${s.nombre||s.url}" (${s.url}):\n${leido.texto}`);
        }catch(err){
          partesTexto.push(`Enlace "${s.nombre||s.url}" (${s.url}): no se pudo leer automáticamente (${err.message}). Trátalo solo como referencia, sin su contenido.`);
        }
      }
    }

    // PDF ya adjuntados como archivo sin texto extraíble (escaneos/imágenes)
    if(soportesPdfNativos.length){
      setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Cargando PDF adjunto(s)...`);
      for(const s of soportesPdfNativos){
        const base64 = await cargarPdfSoporte(s.pdfRef);
        if(base64) pdfs.push({ data: base64, nombre: s.nombre });
      }
    }

    const contenidoTexto = partesTexto.join("\n\n").trim() || null;
    if(!contenidoTexto && !pdfs.length){ throw new Error("No se pudo leer contenido de ningún soporte. Vuelve a subir el archivo o revisa que el enlace sea público."); }

    setSafeHTML("estadoPunto_"+puntoId, `<span class="spinner"></span> Analizando con IA...`);
    const resultado = pdfs.length
      ? await llamarIAConPdfs("analizar_punto_proyecto", contenidoTexto, punto.descripcion, pdfs)
      : await llamarIA("analizar_punto_proyecto", contenidoTexto, punto.descripcion);

    const puntos = [...(eq.puntos||[])];
    const idx = puntos.findIndex(x=>x.id===puntoId);
    puntos[idx] = {...puntos[idx], analisisIA: resultado};
    await guardarEquipo({ puntos }, equipoId);
    equiposCache = await cargarEquipos();
    setSafeText("estadoPunto_"+puntoId, "Análisis completo.");
    if(document.getElementById("listaPuntosProyecto")) pintarListaPuntosProyecto(equipoId, puntos);
  }catch(e){
    setSafeText("estadoPunto_"+puntoId, "");
    alert("No se pudo analizar: " + e.message);
  }
}

let colaboradoresCache = [];

function diasHastaProximoCumpleanos(fechaNacTimestamp){
  const nac = new Date(fechaNacTimestamp);
  const hoy = new Date();
  const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  let proximo = new Date(hoy.getFullYear(), nac.getMonth(), nac.getDate());
  if(proximo < hoySinHora) proximo = new Date(hoy.getFullYear()+1, nac.getMonth(), nac.getDate());
  return Math.round((proximo - hoySinHora)/86400000);
}
function edadQueCumple(fechaNacTimestamp){
  const nac = new Date(fechaNacTimestamp);
  const dias = diasHastaProximoCumpleanos(fechaNacTimestamp);
  const fechaCumple = new Date(Date.now()+dias*86400000);
  return fechaCumple.getFullYear() - nac.getFullYear();
}

// Llama a la función serverless con el token de sesión del admin actual, para
// que el servidor pueda verificar que quien pide la acción es realmente admin.
async function llamarGestionUsuarios(payload){
  const idToken = await currentUser.getIdToken();
  const resp = await fetch(CREAR_USUARIO_ENDPOINT, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ idToken, ...payload })
  });
  const textoCrudo = await resp.text();
  let data;
  try{ data = JSON.parse(textoCrudo); }
  catch(e){ throw new Error(`La función respondió algo inesperado (HTTP ${resp.status}): ${textoCrudo.slice(0,200)}`); }
  if(!resp.ok || data.error){ throw new Error(data.error || `Error al gestionar usuarios (HTTP ${resp.status}).`); }
  return data;
}

async function guardarPermisosUsuario(uid){
  const areas = {};
  const subareas = {};
  Object.keys(AREAS_APP).filter(a=>a!=="usuarios").forEach(area => {
    const sel = document.getElementById(`permArea_${uid}_${area}`);
    if(sel) areas[area] = sel.value;
    const cfg = AREAS_APP[area];
    if(cfg.subareas){
      subareas[area] = {};
      Object.keys(cfg.subareas).forEach(sub => {
        const selSub = document.getElementById(`permSub_${uid}_${area}_${sub}`);
        if(selSub && selSub.value) subareas[area][sub] = selSub.value;
      });
    }
  });
  const estadoEl = document.getElementById("estadoPermisos_"+uid);
  estadoEl.textContent = "Guardando...";
  try{
    await llamarGestionUsuarios({ accion:"actualizarPermisos", uid, areas, subareas });
    estadoEl.textContent = "Guardado ✓";
    const u = usuariosAdminCache.find(x=>x.uid===uid);
    if(u){ u.areas = areas; u.subareas = subareas; }
    registrarCambio("Administración de Usuarios", "permisos", `Permisos por área actualizados para ${u?.email||uid}`);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo guardar: " + e.message);
  }
}

// --- Sorteos de responsables de festejos, grabados por mes (YYYY-MM) para
// que el resultado quede fijo y no cambie cada vez que se recarga la
// página; "Volver a sortear" reemplaza el registro del mes actual. ---
function mesKeyActual(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function etiquetaMesKey(mesKey){
  const [anio, mes] = mesKey.split("-");
  return `${NOMBRES_MESES[parseInt(mes,10)-1]} ${anio}`;
}
async function cargarSorteosFestejos(){
  const snap = await db.ref(`sorteos_festejos/${DATOS_UID}`).once("value");
  return snap.val() || {};
}
async function guardarSorteoFestejo(mesKey, datos){
  await db.ref(`sorteos_festejos/${DATOS_UID}/${mesKey}`).set(datos);
  const nombres = (datos.elegidos||[]).map(c=>c.nombre).join(", ");
  registrarCambio("Cumpleaños", "sorteo", `${etiquetaMesKey(mesKey)}: ${nombres}`);
}

  const cont = document.getElementById("resultadoSorteoFestejo");

  if(guardado){

  const cont = document.getElementById("historialSorteosFestejo");

  const meses = Object.keys(sorteosFestejosCache).filter(k=>k!==mesKeyActual()).sort().reverse();
  if(!meses.length){ cont.innerHTML = ""; return; }
  cont.innerHTML = `
    <details>
      <summary style="cursor:pointer;font-size:13px;color:var(--muted);">📜 Historial de sorteos anteriores (${meses.length})</summary>
      <table style="font-size:12.5px;margin-top:8px;"><thead><tr><th>Mes</th><th>Responsables</th></tr></thead><tbody>
        ${meses.map(mk => `<tr>

async function toggleParticipaFestejo(id, checked){
  const c = colaboradoresCache.find(x=>x.id===id);
  if(!c) return;
  c.participaFestejo = checked;
  await guardarColaborador({ participaFestejo: checked }, id);
}

async function sortearResponsablesFestejo(){
  const proximosIds = idsProximosCumpleanos();
  const elegibles = colaboradoresCache.filter(c => c.participaFestejo!==false && !proximosIds.includes(c.id));
  const cont = document.getElementById("resultadoSorteoFestejo");
  if(elegibles.length < 2){
    cont.innerHTML = `<p style="color:var(--danger);">No hay suficientes colaboradores elegibles para sortear — se necesitan al menos 2 que tengan el check de "Participa" marcado y que no cumplan años en los próximos 30 días.</p>`;
    return;
  }
  // Baraja (Fisher-Yates) y toma los 2 primeros — sorteo justo, sin sesgo.
  const barajados = [...elegibles];
  for(let i=barajados.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [barajados[i], barajados[j]] = [barajados[j], barajados[i]];
  }
  const elegidos = barajados.slice(0,2).map(c=>({id:c.id, nombre:c.nombre, cargo:c.cargo||""}));
  const mesKey = mesKeyActual();
  cont.innerHTML = `<span class="spinner"></span> Guardando sorteo...`;
  try{
    await guardarSorteoFestejo(mesKey, { elegidos, fecha: Date.now() });
    sorteosFestejosCache[mesKey] = { elegidos, fecha: Date.now() };
    pintarResultadoSorteoMesActual();
  }catch(e){
    cont.innerHTML = `<p style="color:var(--danger);">No se pudo guardar el sorteo: ${escapeHtml(e.message||String(e))}</p>`;
  }
}

   MÓDULO: CONTROL DE ACTIVOS FIJOS
   ========================================================================= */
let activosFijosCache = [];
let empresaActivosSeleccionada = null;

function calcularDepreciacionActivo(activo){
  const costo = Number(activo.costoCompra||0);
  const residual = Number(activo.valorResidual||0);
  const vidaUtil = Number(activo.vidaUtilAnios||0);
  if(vidaUtil<=0 || !activo.fechaCompra) return {depreciacionAnual:0, depreciacionAcumulada:0, valorLibros:costo, vidaUtilCumplida:false, aniosTranscurridos:0};
  const aniosTranscurridos = (Date.now()-new Date(activo.fechaCompra).getTime())/(365.25*86400000);
  const depreciacionAnual = (costo-residual)/vidaUtil;
  const depreciacionAcumulada = Math.min(depreciacionAnual*Math.max(aniosTranscurridos,0), costo-residual);
  const valorLibros = Math.max(costo - depreciacionAcumulada, residual);
  return { depreciacionAnual, depreciacionAcumulada, valorLibros, vidaUtilCumplida: aniosTranscurridos>=vidaUtil, aniosTranscurridos };
}

// Deprecia cada mejora por separado (línea aparte), usando la misma vida
// útil del activo principal contada desde la fecha de CADA mejora (criterio
// común: una mejora se deprecia en lo que resta de vida útil del bien).
function calcularDepreciacionMejora(mejora, activo){
  const costo = Number(mejora.costo||0);
  const vidaUtil = Number(activo.vidaUtilAnios||0);
  if(vidaUtil<=0 || !mejora.fecha) return { depreciacionAcumulada:0, valorLibros:costo };
  const aniosTranscurridos = (Date.now()-new Date(mejora.fecha).getTime())/(365.25*86400000);
  const depreciacionAnual = costo/vidaUtil;
  const depreciacionAcumulada = Math.min(depreciacionAnual*Math.max(aniosTranscurridos,0), costo);
  const valorLibros = Math.max(costo - depreciacionAcumulada, 0);
  return { depreciacionAcumulada, valorLibros };
}

// Arma el desglose completo del "valor en libros" de un activo: el bien base
// más una línea por cada mejora, y el total combinado — esto es lo que se
// muestra en el detalle del activo y lo que alimenta el total de la tabla
// principal.
function calcularValorLibrosConMejoras(activo){
  const base = calcularDepreciacionActivo(activo);
  const mejorasDetalle = (activo.mejoras||[]).map(m => {
    const dep = calcularDepreciacionMejora(m, activo);
    return { ...m, ...dep };
  });
  const totalMejoras = mejorasDetalle.reduce((s,m)=>s+m.valorLibros, 0);
  return { base, mejorasDetalle, totalMejoras, total: base.valorLibros + totalMejoras };
}

async function agregarMejoraActivo(activoId){
  const fecha = document.getElementById("mejFecha").value;
  const descripcion = document.getElementById("mejDescripcion").value.trim();
  const costo = parseFloat(document.getElementById("mejCosto").value)||0;
  if(!fecha || !descripcion){ alert("Completa fecha y descripción de la mejora."); return; }
  const a = activosFijosCache.find(x=>x.id===activoId);
  const nuevasMejoras = [...(a.mejoras||[]), { fecha: new Date(fecha+"T00:00:00").getTime(), descripcion, costo }];
  await guardarActivoFijo({ mejoras: nuevasMejoras }, activoId);
  activosFijosCache = await cargarActivosFijos(empresaActivosSeleccionada);
  const aActualizado = activosFijosCache.find(x=>x.id===activoId);
  pintarListaMejoras(aActualizado);
  pintarValorLibrosDesglose(aActualizado);
  document.getElementById("mejFecha").value=""; document.getElementById("mejDescripcion").value=""; document.getElementById("mejCosto").value="";
}

async function eliminarMejoraActivo(activoId, idx){
  if(!confirm("¿Eliminar esta mejora?")) return;
  const a = activosFijosCache.find(x=>x.id===activoId);
  const nuevasMejoras = (a.mejoras||[]).filter((_,i)=>i!==idx);
  await guardarActivoFijo({ mejoras: nuevasMejoras }, activoId);
  activosFijosCache = await cargarActivosFijos(empresaActivosSeleccionada);
  const aActualizado = activosFijosCache.find(x=>x.id===activoId);
  pintarListaMejoras(aActualizado);
  pintarValorLibrosDesglose(aActualizado);
}

async function pintarListaBancos(){
  const cont = document.getElementById("vistaBancariaInterna");
  try{
    bancosCache = await cargarBancos(empresaBancariaSeleccionada);
  }catch(e){
    cont.innerHTML = `<div class="card emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "bancos_empresa" a las reglas de Realtime Database.</span></div>`;
    return;
  }
  const hoy = new Date();
  const alertas = [];
  bancosCache.forEach(b => (b.lineasCredito||[]).forEach(l => {
    if(l.vencimiento){
      const dias = diasEntre(hoy, new Date(l.vencimiento));
      if(dias<=30) alertas.push({banco:b.nombreBanco, monto:l.monto, vencimiento:l.vencimiento, dias});
    }
  }));
  cont.innerHTML = `
    <div class="card"><button class="btn primary" onclick="abrirFormularioBanco()">+ Nuevo banco</button></div>
    ${alertas.length ? `<div class="card" style="border-color:var(--warn);">
      <h3 style="margin-top:0;color:var(--warn);">⚠️ Líneas de crédito por vencer (30 días)</h3>
      ${alertas.map(a=>`<p>${escapeHtml(a.banco)} — $${Number(a.monto||0).toFixed(2)} — vence ${fmtFecha(a.vencimiento)} ${a.dias<0?'<span class="pill danger">Vencida</span>':'<span class="pill warn">Próxima</span>'}</p>`).join("")}

async function agregarLineaCredito(bancoId){
  const monto = parseFloat(document.getElementById("lcMonto").value)||0;
  const vencimiento = document.getElementById("lcVencimiento").value;
  const tasaInteres = parseFloat(document.getElementById("lcTasa").value)||0;
  if(!monto || !vencimiento){ alert("Completa monto y vencimiento."); return; }
  const b = bancosCache.find(x=>x.id===bancoId);
  const nuevasLineas = [...(b.lineasCredito||[]), { monto, vencimiento: new Date(vencimiento+"T00:00:00").getTime(), tasaInteres }];
  await guardarBanco({ lineasCredito: nuevasLineas }, bancoId);
  bancosCache = await cargarBancos(empresaBancariaSeleccionada);
  pintarListaLineasCredito(nuevasLineas);
  document.getElementById("lcMonto").value=""; document.getElementById("lcVencimiento").value=""; document.getElementById("lcTasa").value="";
}

async function agregarHipoteca(bancoId){

  await guardarBanco({ hipotecas: nuevasHipotecas }, bancoId);
  bancosCache = await cargarBancos(empresaBancariaSeleccionada);
  pintarListaHipotecas(nuevasHipotecas);
  document.getElementById("hipMonto").value=""; document.getElementById("hipPlazo").value=""; document.getElementById("hipGarantia").value="";
}

async function pintarFlujoCaja(){

  cont.innerHTML = `
    <div class="card">

      <div class="grid2">

    </div>
    <div class="card" id="tablaFlujoCaja"></div>
  `;
  if(datos.ingresoBase) pintarTablaFlujoCaja(datos);

function pintarTablaFlujoCaja(datos){
  const cont = document.getElementById("tablaFlujoCaja");
  const cr = Number(datos.porcentajeCrecimiento||0)/100;
  const anioActual = new Date().getFullYear();
  const filas = [0,1,2].map(offset => {
    const factor = Math.pow(1+cr, offset);
    const ingreso = Number(datos.ingresoBase||0)*factor;
    const gasto = Number(datos.gastoBase||0)*factor;
    return { anio: anioActual+offset, ingreso, gasto, neto: ingreso-gasto };
  });
  cont.innerHTML = `
    <table><thead><tr><th>Año</th><th>Ingreso proyectado</th><th>Gasto proyectado</th><th>Flujo neto</th></tr></thead><tbody>
      ${filas.map(f=>`<tr><td>${f.anio}</td><td>$${f.ingreso.toFixed(2)}</td><td>$${f.gasto.toFixed(2)}</td><td>$${f.neto.toFixed(2)}</td></tr>`).join("")}
    </tbody></table>
    <button class="btn small" style="margin-top:10px;" onclick="imprimirFlujoCaja()">🖨️ Imprimir para el banco</button>
  `;
}

async function calcularYGuardarFlujoCaja(){

    <tbody>${filas.map(f=>`<tr><td>${f.anio}</td><td>$${f.ingreso.toFixed(2)}</td><td>$${f.gasto.toFixed(2)}</td><td>$${f.neto.toFixed(2)}</td></tr>`).join("")}</tbody>

    vacacionesCache = await cargarVacaciones();
  }catch(e){
    document.getElementById("tablaVacaciones").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "vacaciones" a las reglas de Realtime Database.</span></div>`;
    document.getElementById("alertasVacaciones").innerHTML = "";
    return;
  }
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

// Compatibilidad: registros creados antes de este cambio guardaron el dato
// bajo "responsableVehiculo"; los nuevos usan "responsablePuesto".
function responsablePuestoDe(v){
  return v.responsablePuesto || v.responsableVehiculo || "";
}

function pintarAlertasVacaciones(){
  const cont = document.getElementById("alertasVacaciones");
  const hoy = new Date();
  const actuales = vacacionesCache.filter(v => v.fechaSalida<=hoy.getTime() && v.fechaRegreso>=hoy.getTime());
  const proximas = vacacionesCache.filter(v => {
    const dias = diasEntre(hoy, new Date(v.fechaSalida));
    return dias>0 && dias<=7;
  });
  cont.innerHTML = `<h3 style="margin-top:0;">🏖️ Estado actual</h3>
    ${actuales.length ? actuales.map(v=>`<p>🟢 <b>${escapeHtml(v.colaborador)}</b> está de vacaciones ahora (regresa ${fmtFecha(v.fechaRegreso)}) ${responsablePuestoDe(v)?`— puesto a cargo de <b>${escapeHtml(responsablePuestoDe(v))}</b>`:''}</p>`).join("") : ''}
    ${proximas.length ? proximas.map(v=>`<p>🟡 <b>${escapeHtml(v.colaborador)}</b> sale en ${diasEntre(hoy,new Date(v.fechaSalida))} día(s) (${fmtFecha(v.fechaSalida)})</p>`).join("") : ''}
    ${!actuales.length && !proximas.length ? `<p style="color:var(--muted);">Nadie está de vacaciones ni sale en los próximos 7 días.</p>` : ''}`;
}

function pintarTablaVacaciones(){
  const cont = document.getElementById("tablaVacaciones");
  if(!vacacionesCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay vacaciones planificadas.</div>`; return; }
  const hoy = Date.now();
  cont.innerHTML = `<table><thead><tr><th>Colaborador</th><th>Salida</th><th>Regreso</th><th>Responsable del puesto</th><th>Estado</th><th></th></tr></thead><tbody>
    ${vacacionesCache.map(v => {
      let estado = "Programada";
      if(v.fechaSalida<=hoy && v.fechaRegreso>=hoy) estado = "En curso";
      else if(v.fechaRegreso<hoy) estado = "Finalizada";
      const pillClass = estado==="En curso" ? "ok" : (estado==="Finalizada" ? "muted" : "warn");
      return `<tr>
        <td><b>${escapeHtml(v.colaborador)}</b></td>
        <td>${fmtFecha(v.fechaSalida)}</td>
        <td>${fmtFecha(v.fechaRegreso)}</td>
        <td>${escapeHtml(responsablePuestoDe(v)||'-')}</td>
        <td><span class="pill ${pillClass}">${estado}</span></td>
        <td>
          <button class="btn small" onclick="abrirFormularioVacacion('${v.id}')">Editar</button>
          <button class="btn small danger" onclick="confirmarEliminarVacacion('${v.id}')">Eliminar</button>
        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

async function confirmarEliminarVacacion(id){
  if(!confirm("¿Eliminar este registro de vacaciones?")) return;
  await eliminarVacacion(id);
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

function abrirFormularioVacacion(id){
  const v = id ? vacacionesCache.find(x=>x.id===id) : null;
  const host = document.getElementById("modalVacacionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox">
        <button class="closeX" onclick="document.getElementById('modalVacacionHost').innerHTML=''">×</button>
        <h3>${v?"Editar":"Nueva"} vacación</h3>
        <div class="field"><label>Colaborador</label><input id="vacColaborador" value="${v?escapeHtml(v.colaborador||''):''}"></div>
        <div class="grid2">
          <div class="field"><label>Fecha de salida</label><input type="date" id="vacSalida" value="${v?.fechaSalida?new Date(v.fechaSalida).toISOString().slice(0,10):''}"></div>
          <div class="field"><label>Fecha de regreso</label><input type="date" id="vacRegreso" value="${v?.fechaRegreso?new Date(v.fechaRegreso).toISOString().slice(0,10):''}"></div>
        </div>
        <div class="field"><label>Responsable del puesto mientras está fuera</label><input id="vacResponsablePuesto" value="${v?escapeHtml(responsablePuestoDe(v)):''}"></div>
        <div class="field"><label>Observaciones</label><textarea id="vacObservaciones" rows="2">${v?escapeHtml(v.observaciones||''):''}</textarea></div>
        <button class="btn primary" style="width:100%;margin-top:8px;" onclick="guardarVacacionForm('${v?v.id:''}')">Guardar</button>
      </div>
    </div>`;
}

async function guardarVacacionForm(id){
  const val = elId => document.getElementById(elId).value;
  if(!val("vacColaborador").trim()){ alert("Ingresa el nombre del colaborador."); return; }
  if(!val("vacSalida") || !val("vacRegreso")){ alert("Ingresa fecha de salida y regreso."); return; }
  const datos = {
    colaborador: val("vacColaborador").trim(),
    fechaSalida: new Date(val("vacSalida")+"T00:00:00").getTime(),
    fechaRegreso: new Date(val("vacRegreso")+"T00:00:00").getTime(),
    responsablePuesto: val("vacResponsablePuesto").trim(),
    observaciones: val("vacObservaciones").trim(),
  };
  await guardarVacacion(datos, id||null);
  document.getElementById("modalVacacionHost").innerHTML = "";
  vacacionesCache = await cargarVacaciones();
  pintarAlertasVacaciones();
  pintarTablaVacaciones();
}

async function agregarEnlaceActaAnterior(){
  const empresaId = empresaSocietariaSeleccionada[moduloSocietarioActual];

async function guardarContenidoSocietarioManual(id){

  societariosCache = await cfg.cargar(empresaId);

async function ejecutarGenerarSocietario(id){
  const cfg = SOCIETARIOS_CONFIG[moduloSocietarioActual];
  const solicitud = document.getElementById("socSolicitud").value.trim();
  if(!solicitud){ alert("Describe lo que necesitas."); return; }
  const estadoEl = document.getElementById("socEstadoGenerar");
  estadoEl.innerHTML = `<span class="spinner"></span> Generando...`;
  try{
    const resultado = await llamarIA(cfg.modoGenerar, solicitud, "");
    const docActual = societariosCache.find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = docActual?.contenido ? [...historialPrevio, {fecha:Date.now(), contenido:docActual.contenido, origen:"Generación anterior"}] : historialPrevio;
    await cfg.guardar({ solicitud, contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    await registrarCambio(cfg.titulo, "generar_ia", `Borrador generado con IA (id ${id})`);
    const empresaId = empresaSocietariaSeleccionada[moduloSocietarioActual];
    societariosCache = await cfg.cargar(empresaId);
    estadoEl.textContent = "Borrador generado.";
    abrirDetalleSocietario(id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar: " + e.message);
  }
}

async function ejecutarRevisarSocietario(id){
  const cfg = SOCIETARIOS_CONFIG[moduloSocietarioActual];
  const contenidoActual = document.getElementById("socContenido").value.trim();
  const instrucciones = document.getElementById("socInstrucciones").value.trim();
  if(!contenidoActual){ alert("Genera primero un borrador."); return; }
  const estadoEl = document.getElementById("socEstadoRevisar");
  estadoEl.innerHTML = `<span class="spinner"></span> Revisando con IA...`;
  try{
    const resultado = await llamarIA(cfg.modoRevisar, contenidoActual, instrucciones);
    const docActual = societariosCache.find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = [...historialPrevio, {fecha:Date.now(), contenido:contenidoActual, origen:instrucciones||"Revisión general"}];
    await cfg.guardar({ contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    await registrarCambio(cfg.titulo, "revisar_ia", `Revisión con IA aplicada (id ${id})${instrucciones?': '+instrucciones:''}`);
    const empresaId = empresaSocietariaSeleccionada[moduloSocietarioActual];
    societariosCache = await cfg.cargar(empresaId);
    estadoEl.textContent = "Revisión aplicada.";
    abrirDetalleSocietario(id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo revisar: " + e.message);
  }
}

async function confirmarDocumentoSocietario(id){
  const cfg = SOCIETARIOS_CONFIG[moduloSocietarioActual];
  const docActual = societariosCache.find(x=>x.id===id);
  if(!docActual?.contenido?.trim()){ alert("Genera o escribe el contenido antes de confirmar."); return; }
  if(!confirm("Al confirmar se asigna un número interno definitivo y ya no se podrá editar este documento. ¿Continuar?")) return;
  const numero = await obtenerSiguienteNumeroDocumento(cfg.prefijoNumero);
  await cfg.guardar({ confirmado:true, numeroAsignado:numero, fechaConfirmado:Date.now() }, id);
  await registrarCambio(cfg.titulo, "confirmar", `Documento confirmado con número ${numero} (id ${id})`);
  const empresaId = empresaSocietariaSeleccionada[moduloSocietarioActual];
  societariosCache = await cfg.cargar(empresaId);
  abrirDetalleSocietario(id);
}

function toggleHistorialSocietario(){
  const wrap = document.getElementById("historialSocietarioWrap");

// Arma el texto compartible (mismo contenido para WhatsApp y correo)
// Fecha/hora de inicio y fin en formato compacto (YYYYMMDDTHHMMSS) que
// requieren tanto el enlace de Google Calendar como el archivo .ics. Si no
// hay hora definida, usa 09:00 como referencia; si no hay hora de fin, usa
// 1 hora de duración por defecto — son solo para armar el evento de
// calendario, no cambian lo que se guarda ni se muestra en la tabla.
function fechasCalendarioReunion(r){
  const horaInicio = r.horaInicio || "09:00";
  const inicio = new Date(`${r.fechaInicio}T${horaInicio}:00`);
  let fin;
  if(r.incluyeHoraFin && r.horaFin){
    fin = new Date(`${r.fechaInicio}T${r.horaFin}:00`);
    if(fin <= inicio) fin = new Date(inicio.getTime() + 60*60*1000);
  } else {
    fin = new Date(inicio.getTime() + 60*60*1000);
  }
  const fmt = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "T" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + "00";
  return { inicio: fmt(inicio), fin: fmt(fin) };
}

// Enlace que abre Google Calendar con el evento ya prellenado, listo para
// agregar con un clic — es la forma real de "enviar como evento" por
// WhatsApp, ya que su API de enlace directo solo admite texto (no permite
// adjuntar archivos de calendario).
function linkGoogleCalendarReunion(r){
  const { inicio, fin } = fechasCalendarioReunion(r);
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: r.nombre,
    dates: `${inicio}/${fin}`,
    details: r.descripcion || "",
    location: r.ubicacion || "",
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

// Devuelve la lista de nombres de participantes de una reunión/evento —
// combina los miembros elegidos de la lista de Miembros y los "otros"
// escritos a mano.
function nombresParticipantesReunion(r){
  const deMiembros = (r.participantesIds||[]).map(id => colaboradoresCache.find(c=>c.id===id)?.nombre).filter(Boolean);
  return [...deMiembros, ...(r.participantesOtros||[])];
}

function textoReunionEvento(r){
  const fechaEvento = new Date(r.fechaInicio+"T00:00:00");
  const horario = r.horaInicio ? `${r.horaInicio}${r.incluyeHoraFin && r.horaFin ? ' a '+r.horaFin : ''}` : 'Sin hora definida';
  const participantes = nombresParticipantesReunion(r);
  let txt = `📅 ${r.nombre}\n\n`;
  if(r.descripcion) txt += `${r.descripcion}\n\n`;
  txt += `🗓️ Fecha: ${fmtFecha(fechaEvento.getTime())}\n`;
  txt += `🕐 Hora: ${horario}\n`;
  if(r.ubicacion) txt += `📍 Ubicación: ${r.ubicacion}\n`;
  if(participantes.length) txt += `👥 Participantes: ${participantes.join(", ")}\n`;
  txt += `\n📆 Agregar a mi calendario: ${linkGoogleCalendarReunion(r)}\n`;
  return txt;
}

// Genera el archivo .ics del evento (estándar iCalendar) — funciona para
// importar/abrir directamente en Outlook, Apple Calendar, Google Calendar, y
// la mayoría de apps de calendario. No se puede adjuntar automáticamente a un
// chat de WhatsApp (su enlace directo no lo admite), pero sí se puede
// compartir manualmente como archivo desde donde se descargue.
function generarICSReunion(r){
  const { inicio, fin } = fechasCalendarioReunion(r);
  const escaparICS = s => (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const ahora = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Geafinanciero//Reuniones y Eventos//ES",
    "BEGIN:VEVENT",
    `UID:${r.id}@control-documental`,
    `DTSTAMP:${ahora}`,
    `DTSTART:${inicio}`,
    `DTEND:${fin}`,
    `SUMMARY:${escaparICS(r.nombre)}`,
    r.descripcion ? `DESCRIPTION:${escaparICS(r.descripcion)}` : "",
    r.ubicacion ? `LOCATION:${escaparICS(r.ubicacion)}` : "",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
}

function descargarICSReunion(id){
  const r = reunionesEventosCache.find(x=>x.id===id);
  if(!r) return;
  const blob = new Blob([generarICSReunion(r)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download: `${r.nombre.replace(/[^\w\-]+/g,"_")}.ics` });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function enviarReunionWhatsApp(id){
  const r = reunionesEventosCache.find(x=>x.id===id);

  const url = `https://wa.me/?text=${encodeURIComponent(textoReunionEvento(r))}`;
  window.open(url, "_blank");
}

function enviarReunionCorreo(id){

  const asunto = `Invitación: ${r.nombre}`;
  const url = `mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(textoReunionEvento(r))}`;
  window.open(url, "_blank");
}

/* --- Valida un valor según el tipo de campo IESS; devuelve null si está
   bien, o un texto corto de advertencia si no cumple el formato esperado.
   No bloquea la generación (el usuario puede corregir después en el .txt),
   solo alerta visualmente en la tabla. --- */
function validarCampoIess(valor, campo){
  const v = (valor||"").trim();
  if(!v) return campo.opcional ? null : "vacío";
  switch(campo.tipo){
    case "cedula": return /^\d{10}$/.test(v) ? null : "debe ser 10 dígitos";
    case "ruc13": return /^\d{13}$/.test(v) ? null : "debe ser 13 dígitos";
    case "fecha": return /^\d{8}$/.test(v) ? null : "formato AAAAMMDD (8 díg.)";
    case "fechaOCeros": return (/^\d{8}$/.test(v)) ? null : "formato AAAAMMDD (o 00000000)";
    case "fechaGuion": return /^\d{4}-\d{2}-\d{2}$/.test(v) ? null : "formato AAAA-MM-DD";
    case "periodo": return /^\d{4}-\d{2} A \d{4}-\d{2}$/.test(v) ? null : "formato AAAA-MM A AAAA-MM";
    case "monto": return /^\d+(\.\d{1,2})?$/.test(v) ? null : "monto con punto decimal (ej. 111.11)";
    case "digitos": return new RegExp(`^\\d{${campo.n}}$`).test(v) ? null : `debe ser ${campo.n} dígito(s)`;
    case "texto": return (campo.maxLen && v.length>campo.maxLen) ? `máx. ${campo.maxLen} caracteres` : null;
    default: return null;
  }
}

function pintarTablaCargaBancaria(){

  const filasHtml = filasCargaBancaria.map((f,idx) => {

      const advertencia = validarCampoIess(f[campo.clave], campo);

      return `<td>
        <input style="width:130px;${advertencia?'border-color:var(--danger);':''}" value="${escapeHtml(f[campo.clave]||'')}" onchange="editarFilaBancaria(${idx},'${campo.clave}',this.value)" title="${advertencia?escapeHtml(advertencia):''}">

      </td>`;
    }).join("");
    return `<tr>${celdas}<td><button class="btn small danger" onclick="quitarFilaBancaria(${idx})">✕</button></td></tr>`;
  }).join("");
  wrap.innerHTML = `

      <table><thead><tr>${tipo.campos.map(c=>`<th>${escapeHtml(c.label)}</th>`).join("")}<th></th></tr></thead><tbody>
        ${filasHtml}
      </tbody></table>

      <div class="field"><label>Nombre de esta carga</label><input type="text" id="thNombreCarga" value="${thTipoMovimientoActual} ${NOMBRES_MESES[new Date().getMonth()]} ${new Date().getFullYear()}"></div>
      <button class="btn primary" onclick="generarArchivoCargaBancaria()">⬇️ Generar y descargar archivo (.txt)</button>

async function generarArchivoCargaBancaria(){
  if(!filasCargaBancaria.length){ alert("No hay filas para generar."); return; }
  const tipo = IESS_TIPOS[thTipoMovimientoActual];
  const ruc = document.getElementById("thRucIess").value.trim();
  const sucursal = document.getElementById("thSucursalIess").value.trim();
  const anio = document.getElementById("thAnioIess").value.trim();
  const mes = document.getElementById("thMesIess").value.trim();
  if(!/^\d{13}$/.test(ruc)){ alert("El RUC debe tener 13 dígitos."); return; }
  if(!/^\d{4}$/.test(sucursal)){ alert("El código de sucursal debe tener 4 dígitos."); return; }
  if(!/^\d{4}$/.test(anio) || !/^\d{2}$/.test(mes)){ alert("Revisa el año (4 díg.) y el mes (2 díg.)."); return; }
  const nombre = document.getElementById("thNombreCarga").value.trim() || `${thTipoMovimientoActual} ${anio}-${mes}`;

  const lineas = filasCargaBancaria.map(f => {
    const valoresCampos = tipo.campos.map(c => f[c.clave]||"");
    return [ruc, sucursal, anio, mes, thTipoMovimientoActual, ...valoresCampos].join(";");
  });
  const contenido = lineas.join("\r\n");

  const estadoEl = document.getElementById("thEstadoCarga");
  estadoEl.textContent = "Guardando...";
  try{
    await guardarCargaBancariaRRHH({ nombre, tipoMovimiento: thTipoMovimientoActual, ruc, sucursal, anio, mes, filas: filasCargaBancaria, totalMonto: 0, contenido });
    cargasBancariasRRHHCache = await cargarCargasBancariasRRHH();
    descargarTextoComoArchivo(contenido, `${nombre.replace(/[^\w\-]+/g,"_")}.txt`);
    estadoEl.textContent = "Archivo generado y guardado en el historial. Verifica siempre el contenido antes de subirlo al portal del IESS.";
    pintarCargaBancariaTH();
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo guardar la carga: " + e.message);
  }
}

function descargarTextoComoArchivo(texto, nombreArchivo){
  const blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download: nombreArchivo });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function redescargarCargaBancaria(id){
  const c = cargasBancariasRRHHCache.find(x=>x.id===id);
  if(!c) return;
  descargarTextoComoArchivo(c.contenido||"", `${(c.nombre||'carga').replace(/[^\w\-]+/g,"_")}.txt`);
}

  await eliminarCargaBancariaRRHH(id);

  pintarCargaBancariaTH();
}

/* =========================================================================
   MÓDULO: ARQUEOS DE CAJA
   Arqueo de efectivo por denominaciones (USD), otros valores (cheques,
   vales), comparación contra el saldo según libros, y determinación de
   faltante/sobrante — con acta imprimible y espacio de firmas.
   ========================================================================= */
let arqueosCajaCache = [];
const DENOMINACIONES_BILLETES = [100, 50, 20, 10, 5, 1];
const DENOMINACIONES_MONEDAS = [1, 0.50, 0.25, 0.10, 0.05, 0.01];

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Arqueos de Caja</h2><p>Conteo de efectivo, comparación contra el saldo según libros y determinación de faltante/sobrante</p></div>
      <button class="btn primary" onclick="abrirFormularioArqueo()">+ Nuevo arqueo</button></div>
    <div class="card" id="listaArqueosCaja">Cargando...</div>
    <div id="modalArqueoHost"></div>
  `;
  try{
    if(!empresasCache.length){ await cargarEmpresas(); }
    arqueosCajaCache = await cargarArqueosCaja();
  }catch(e){
    document.getElementById("listaArqueosCaja").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "arqueos_caja" a las reglas de Realtime Database.</span></div>`;
    return;
  }

function pintarListaArqueos(){
  const cont = document.getElementById("listaArqueosCaja");
  if(!arqueosCajaCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay arqueos registrados.</div>`; return; }
  cont.innerHTML = `<table><thead><tr><th>Empresa</th><th>Fecha</th><th>Responsable</th><th>Total físico</th><th>Diferencia</th><th></th></tr></thead><tbody>
    ${arqueosCajaCache.map(a => {
      const t = calcularTotalesArqueo(a);
      const pillDif = Math.abs(t.diferencia)<0.01 ? `<span class="pill ok">Cuadra</span>` : (t.diferencia<0 ? `<span class="pill danger">Faltante $${Math.abs(t.diferencia).toFixed(2)}</span>` : `<span class="pill warn">Sobrante $${t.diferencia.toFixed(2)}</span>`);
      return `<tr>
        <td>${escapeHtml(a.empresaNombre||'-')}</td>
        <td>${fmtFecha(a.fecha)} ${escapeHtml(a.hora||'')}</td>
        <td>${escapeHtml(a.responsableCaja||'-')}</td>
        <td class="num">$${t.totalFisico.toFixed(2)}</td>
        <td>${pillDif}</td>
        <td>
          <button class="btn small" onclick="abrirFormularioArqueo('${a.id}')">Abrir</button>
          <button class="btn small" onclick="imprimirArqueoCaja('${a.id}')">🖨️ Imprimir</button>
          <button class="btn small danger" onclick="confirmarEliminarArqueo('${a.id}')">Eliminar</button>
        </td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

function calcularTotalesArqueo(a){
  const billetes = a.billetes||{};
  const monedas = a.monedas||{};
  const totalBilletes = DENOMINACIONES_BILLETES.reduce((s,d)=>s+(Number(billetes[d])||0)*d,0);
  const totalMonedas = DENOMINACIONES_MONEDAS.reduce((s,d)=>s+(Number(monedas[d])||0)*d,0);
  const totalOtros = (a.otrosValores||[]).reduce((s,o)=>s+(Number(o.monto)||0),0);
  const totalFisico = totalBilletes + totalMonedas + totalOtros;
  const saldoLibros = Number(a.saldoSegunLibros)||0;
  const diferencia = totalFisico - saldoLibros;
  return { totalBilletes, totalMonedas, totalOtros, totalFisico, saldoLibros, diferencia };
}

function recalcularTotalesArqueoUI(){
  let totalBilletes = 0, totalMonedas = 0;
  DENOMINACIONES_BILLETES.forEach(d => {

  });
  DENOMINACIONES_MONEDAS.forEach(d => {
    const cant = parseInt(document.getElementById(`arqMoneda_${d}`)?.value)||0;
    const sub = cant*d;
    totalMonedas += sub;
    const el = document.getElementById(`arqMonedaSub_${d}`); if(el) el.textContent = `$${sub.toFixed(2)}`;
  });
  const totalOtros = (window._otrosValoresArqueoTemp||[]).reduce((s,o)=>s+(Number(o.monto)||0),0);
  const totalFisico = totalBilletes + totalMonedas + totalOtros;
  const saldoLibros = parseFloat(document.getElementById("arqSaldoLibros")?.value)||0;
  const diferencia = totalFisico - saldoLibros;
  const resumen = document.getElementById("arqTotalesResumen");
  if(resumen){
    const pillDif = Math.abs(diferencia)<0.01 ? `<span class="pill ok">Cuadra exacto</span>` : (diferencia<0 ? `<span class="pill danger">Faltante $${Math.abs(diferencia).toFixed(2)}</span>` : `<span class="pill warn">Sobrante $${diferencia.toFixed(2)}</span>`);
    resumen.innerHTML = `
      <p style="margin:4px 0;">Total efectivo (billetes + monedas): <b>$${(totalBilletes+totalMonedas).toFixed(2)}</b></p>
      <p style="margin:4px 0;">Total otros valores: <b>$${totalOtros.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Total físico contado: <b>$${totalFisico.toFixed(2)}</b></p>

      <p style="margin:4px 0;">Diferencia: ${pillDif}</p>
    `;
  }
}

function cambiarTipoTomaFisicaUI(){
  const tipo = document.getElementById("tfTipo").value;

function procesarPegadoTomaFisica(){
  const tipo = document.getElementById("tfTipo").value;
  const campos = TOMA_FISICA_CAMPOS[tipo];
  const texto = document.getElementById("tfPegado").value;
  const lineas = texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lineas.length){ alert("Pega primero los datos desde Excel."); return; }
  lineas.forEach(linea => {
    const cols = linea.split("\t");
    const fila = {};
    campos.forEach((campo, idx) => { fila[campo.clave] = (cols[idx]||"").trim(); });
    filasTomaFisicaTemp.push(fila);
  });
  document.getElementById("tfPegado").value = "";
  pintarTablaTomaFisica();
}

function pintarTablaTomaFisica(){
  const wrap = document.getElementById("tfTablaWrap");
  const tipo = document.getElementById("tfTipo").value;
  const campos = TOMA_FISICA_CAMPOS[tipo];
  if(!filasTomaFisicaTemp.length){ wrap.innerHTML = `<p style="color:var(--muted);">Sin filas aún.</p>`; return; }
  wrap.innerHTML = `<table style="font-size:12px;"><thead><tr>${campos.map(c=>`<th>${escapeHtml(c.label)}</th>`).join("")}<th>Diferencia</th><th></th></tr></thead><tbody>
    ${filasTomaFisicaTemp.map((f,idx) => {
      const diff = (parseFloat(f.cantidadFisica)||0) - (parseFloat(f.cantidadSistema)||0);
      const celdas = campos.map(c => `<td><input style="width:${c.clave==='descripcion'?160:c.clave==='observaciones'?140:90}px;" value="${escapeHtml(f[c.clave]||'')}" onchange="editarFilaTomaFisica(${idx},'${c.clave}',this.value)"></td>`).join("");
      return `<tr>${celdas}<td class="num" style="${diff!==0?'color:var(--danger);font-weight:700;':''}">${diff===0?'✓':(diff>0?'+':'')+diff}</td><td><button class="btn small danger" onclick="quitarFilaTomaFisica(${idx})">✕</button></td></tr>`;
    }).join("")}
  </tbody></table>`;
}

function editarFilaTomaFisica(idx, campo, valor){ filasTomaFisicaTemp[idx][campo] = valor; pintarTablaTomaFisica(); }

const TIPOS_FONDO_CAJA_CHICA = { caja_chica: "Caja Chica", fondo_rotativo: "Fondo Rotativo" };

function calcularTotalesCajaChica(l){
  const gastosComprobante = l.filasGastos||[];
  const miscelaneos = l.filasMiscelaneos||[];
  const totalGastosComprobante = gastosComprobante.reduce((s,f)=>s+(parseFloat(f.total)||0),0);
  const totalMiscelaneos = miscelaneos.reduce((s,f)=>s+(parseFloat(f.valor)||0),0);
  const totalGastos = totalGastosComprobante + totalMiscelaneos;
  const totalIngresos = (l.filasIngresos||[]).reduce((s,f)=>s+(parseFloat(f.valor)||0),0);
  const montoFondoFijo = Number(l.montoFondoFijo)||0;
  const efectivoContado = Number(l.efectivoContado)||0;
  const saldoTeorico = montoFondoFijo - totalGastos + totalIngresos;
  const diferencia = efectivoContado - saldoTeorico;
  const montoAReponer = totalGastos;
  const montoFilaCajaChica = f => parseFloat(f.total!==undefined ? f.total : f.valor) || 0;
  const todasLasFilas = [...gastosComprobante, ...miscelaneos];
  const totalDeducible = todasLasFilas.filter(f=>f.deducible).reduce((s,f)=>s+montoFilaCajaChica(f),0);
  const totalNoDeducible = todasLasFilas.filter(f=>!f.deducible).reduce((s,f)=>s+montoFilaCajaChica(f),0);
  return { totalGastosComprobante, totalMiscelaneos, totalGastos, totalIngresos, montoFondoFijo, efectivoContado, saldoTeorico, diferencia, montoAReponer, totalDeducible, totalNoDeducible };
}

function procesarPegadoGastosCajaChica(){
  const texto = document.getElementById("ccPegadoGastos").value;
  const lineas = texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lineas.length){ alert("Pega primero los datos desde Excel, o usa \"+ Agregar fila de gasto manualmente\" si no tienes el Excel."); return; }
  lineas.forEach(linea => {
    const cols = linea.split("\t");
    const fila = { deducible: true };
    CAMPOS_GASTO_CAJA_CHICA.forEach((campo, idx) => { fila[campo.clave] = (cols[idx]||"").trim(); });
    filasGastosCajaChicaTemp.push(fila);
  });
  document.getElementById("ccPegadoGastos").value = "";
  pintarTablaGastosCajaChica();
  recalcularTotalesCajaChicaUI();
}

function pintarTablaGastosCajaChica(){

  if(!filasGastosCajaChicaTemp.length){ wrap.innerHTML = `<p style="color:var(--muted);">Sin gastos aún.</p>`; return; }
  wrap.innerHTML = `<table style="font-size:11.5px;"><thead><tr>${CAMPOS_GASTO_CAJA_CHICA.map(c=>`<th>${escapeHtml(c.label)}</th>`).join("")}<th>Deducible</th><th></th></tr></thead><tbody>
    ${filasGastosCajaChicaTemp.map((f,idx) => {
      const celdas = CAMPOS_GASTO_CAJA_CHICA.map(c => {
        const anchoChico = ["autorizacionSri","establecimiento","puntoEmision","numeroDocumento","rucProveedor","subtotalConIva","subtotalSinIva","iva","total"].includes(c.clave) ? 85 : (c.clave==='proveedor'||c.clave==='detalle'||c.clave==='observaciones'?130:c.clave==='codigoContable'?85:100);
        const esMontoRelacionado = ["subtotalConIva","subtotalSinIva","iva"].includes(c.clave);
        return `<td><input style="width:${anchoChico}px;" value="${escapeHtml(f[c.clave]||'')}" onchange="editarFilaGastoCajaChica(${idx},'${c.clave}',this.value)${esMontoRelacionado?`; recalcularTotalFilaGasto(${idx})`:''}"></td>`;
      }).join("");
      return `<tr>${celdas}<td style="text-align:center;"><input type="checkbox" ${f.deducible?'checked':''} onchange="editarFilaGastoCajaChica(${idx},'deducible',this.checked)"></td><td><button class="btn small danger" onclick="quitarFilaGastoCajaChica(${idx})">✕</button></td></tr>`;
    }).join("")}
    <tr class="totalRow" style="font-weight:700;"><td colspan="11" style="text-align:right;">Total gastos con comprobante</td><td>$${filasGastosCajaChicaTemp.reduce((s,f)=>s+(parseFloat(f.total)||0),0).toFixed(2)}</td><td colspan="3"></td></tr>
  </tbody></table>
  <p class="helpNote">El campo "Total" se sugiere automáticamente como Subtotal con IVA + Subtotal sin IVA + IVA al editar esos tres, pero puedes corregirlo a mano si no coincide.</p>`;
}

// Sugiere el Total de una fila de gasto sumando subtotales + IVA — el
// usuario puede sobrescribirlo a mano después si no calza exacto.
function recalcularTotalFilaGasto(idx){
  const f = filasGastosCajaChicaTemp[idx];
  const sugerido = (parseFloat(f.subtotalConIva)||0) + (parseFloat(f.subtotalSinIva)||0) + (parseFloat(f.iva)||0);
  f.total = sugerido ? sugerido.toFixed(2) : f.total;
  pintarTablaGastosCajaChica();
  recalcularTotalesCajaChicaUI();
}

function recalcularTotalesCajaChicaUI(){
  const totalGastosComprobante = filasGastosCajaChicaTemp.reduce((s,f)=>s+(parseFloat(f.total)||0),0);
  const totalMiscelaneos = filasMiscelaneosCajaChicaTemp.reduce((s,f)=>s+(parseFloat(f.valor)||0),0);
  const totalGastos = totalGastosComprobante + totalMiscelaneos;
  const totalIngresos = filasIngresosCajaChicaTemp.reduce((s,f)=>s+(parseFloat(f.valor)||0),0);
  const montoFondoFijo = parseFloat(document.getElementById("ccMontoFondo")?.value)||0;
  const efectivoContado = parseFloat(document.getElementById("ccEfectivoContado")?.value)||0;
  const saldoTeorico = montoFondoFijo - totalGastos + totalIngresos;
  const diferencia = efectivoContado - saldoTeorico;
  const montoFilaCajaChica = f => parseFloat(f.total!==undefined ? f.total : f.valor) || 0;
  const todasLasFilas = [...filasGastosCajaChicaTemp, ...filasMiscelaneosCajaChicaTemp];
  const totalDeducible = todasLasFilas.filter(f=>f.deducible).reduce((s,f)=>s+montoFilaCajaChica(f),0);
  const totalNoDeducible = todasLasFilas.filter(f=>!f.deducible).reduce((s,f)=>s+montoFilaCajaChica(f),0);
  const resumen = document.getElementById("ccTotalesResumen");
  if(resumen){
    const pillDif = Math.abs(diferencia)<0.01 ? `<span class="pill ok">Cuadra exacto</span>` : (diferencia<0 ? `<span class="pill danger">Faltante $${Math.abs(diferencia).toFixed(2)}</span>` : `<span class="pill warn">Sobrante $${diferencia.toFixed(2)}</span>`);
    resumen.innerHTML = `
      <p style="margin:4px 0;">Monto del fondo fijo: <b>$${montoFondoFijo.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Gastos con comprobante: <b>$${totalGastosComprobante.toFixed(2)}</b> &nbsp;+&nbsp; Misceláneos: <b>$${totalMiscelaneos.toFixed(2)}</b> &nbsp;=&nbsp; Total gastos: <b>$${totalGastos.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Total ingresos/reposiciones: <b>$${totalIngresos.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Saldo teórico en caja: <b>$${saldoTeorico.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Efectivo físico contado: <b>$${efectivoContado.toFixed(2)}</b></p>
      <p style="margin:4px 0;">Diferencia: ${pillDif}</p>
      <p style="margin:4px 0;">Monto a reponer para restituir el fondo: <b>$${totalGastos.toFixed(2)}</b></p>
      <hr style="margin:8px 0;border-color:var(--border);">
      <p style="margin:4px 0;">✅ Total gasto deducible: <b>$${totalDeducible.toFixed(2)}</b></p>
      <p style="margin:4px 0;">🚫 Total gasto NO deducible: <b>$${totalNoDeducible.toFixed(2)}</b></p>
    `;
  }
}

async function guardarCajaChicaForm(id){
  const empresaId = document.getElementById("ccEmpresa").value;
  const emp = empresasCache.find(e=>e.id===empresaId);
  if(!emp){ alert("Elige la empresa."); return; }
  const nombreFondo = document.getElementById("ccNombreFondo").value.trim();
  if(!nombreFondo){ alert("Ponle un nombre al fondo."); return; }
  const existente = id ? liquidacionesCajaChicaCache.find(x=>x.id===id) : null;
  const tipoFondo = existente ? existente.tipoFondo : document.getElementById("ccTipoFondo").value;
  const numeroFondo = existente ? existente.numeroFondo : await obtenerSiguienteNumeroDocumento(tipoFondo);
  const datos = {
    empresaId, empresaNombre: emp.nombre,
    tipoFondo, numeroFondo,
    nombreFondo,
    custodioResponsable: document.getElementById("ccCustodio").value.trim(),
    revisadoPor: document.getElementById("ccRevisadoPor").value.trim(),
    aprobadoPor: document.getElementById("ccAprobadoPor").value.trim(),
    montoFondoFijo: parseFloat(document.getElementById("ccMontoFondo").value)||0,
    periodoDesde: document.getElementById("ccPeriodoDesde").value ? new Date(document.getElementById("ccPeriodoDesde").value+"T00:00:00").getTime() : null,
    periodoHasta: document.getElementById("ccPeriodoHasta").value ? new Date(document.getElementById("ccPeriodoHasta").value+"T00:00:00").getTime() : null,
    filasGastos: filasGastosCajaChicaTemp,
    filasMiscelaneos: filasMiscelaneosCajaChicaTemp,
    filasIngresos: filasIngresosCajaChicaTemp,
    efectivoContado: parseFloat(document.getElementById("ccEfectivoContado").value)||0,
    cierre: {
      numeroComprobante: document.getElementById("ccCierreNumero").value.trim(),
      fecha: document.getElementById("ccCierreFecha").value ? new Date(document.getElementById("ccCierreFecha").value+"T00:00:00").getTime() : null,
      valor: parseFloat(document.getElementById("ccCierreValor").value)||0,
    },
    devolucionSobrante: {
      aplica: document.getElementById("ccDevolucionAplica").checked,
      numeroIngreso: document.getElementById("ccDevolucionNumero").value.trim(),
      fecha: document.getElementById("ccDevolucionFecha").value ? new Date(document.getElementById("ccDevolucionFecha").value+"T00:00:00").getTime() : null,
      valor: parseFloat(document.getElementById("ccDevolucionValor").value)||0,
    },
    reembolsoEmpleado: {
      aplica: document.getElementById("ccReembolsoAplica").checked,
      metodoPago: document.getElementById("ccReembolsoMetodo").value.trim(),
      referencia: document.getElementById("ccReembolsoReferencia").value.trim(),
      fecha: document.getElementById("ccReembolsoFecha").value ? new Date(document.getElementById("ccReembolsoFecha").value+"T00:00:00").getTime() : null,
      valor: parseFloat(document.getElementById("ccReembolsoValor").value)||0,
    },
    observacionesGenerales: document.getElementById("ccObservacionesGenerales").value.trim(),
  };
  await guardarLiquidacionCajaChica(datos, id||null);
  document.getElementById("modalCajaChicaHost").innerHTML = "";
  liquidacionesCajaChicaCache = await cargarLiquidacionesCajaChica();
  pintarListaCajaChica();
}

  const l = liquidacionesCajaChicaCache.find(x=>x.id===id);
  const emp = empresasCache.find(e=>e.id===l.empresaId) || {nombre:l.empresaNombre};
  const t = calcularTotalesCajaChica(l);
  const meta = `
    <div><b>N° / Tipo:</b> ${escapeHtml(l.numeroFondo||'-')} — ${TIPOS_FONDO_CAJA_CHICA[l.tipoFondo]||'-'}</div>

    <div><b>Periodo:</b> ${fmtFecha(l.periodoDesde)} → ${fmtFecha(l.periodoHasta)}</div>
    <div><b>Monto del fondo fijo:</b> $${t.montoFondoFijo.toFixed(2)}</div>
  `;
  const filasGastosHtml = (l.filasGastos||[]).map(f=>`<tr>
    <td>${escapeHtml(f.fecha||'')}</td><td>${escapeHtml(f.autorizacionSri||'')}</td>

    <td>${escapeHtml(f.proveedor||'')}</td><td>${escapeHtml(f.rucProveedor||'')}</td><td>${escapeHtml(f.detalle||'')}</td>

let logCambiosCache = [];

async function renderLogCambios(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Historial de Cambios</h2><p>Registro de quién realizó cada cambio y cuándo, en todos los módulos de la app</p></div></div>
    <div class="card" id="filtrosLogCambios" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;"></div>
    <div class="card" id="tablaLogCambios">Cargando...</div>
  `;
  try{
    logCambiosCache = await cargarLogCambios();
  }catch(e){
    document.getElementById("tablaLogCambios").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "log_cambios" a las reglas de Realtime Database.</span></div>`;

  }
  pintarFiltrosLogCambios();

}

function pintarFiltrosLogCambios(){
  const cont = document.getElementById("filtrosLogCambios");
  const usuarios = [...new Set(logCambiosCache.map(l=>l.usuario).filter(Boolean))].sort();
  const modulos = [...new Set(logCambiosCache.map(l=>l.modulo).filter(Boolean))].sort();
  cont.innerHTML = `
    <div class="field" style="margin:0;min-width:200px;"><label>Usuario</label>
      <select id="filtroLogUsuario" onchange="pintarTablaLogCambios()">
        <option value="">Todos</option>
        ${usuarios.map(u=>`<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join("")}
      </select>
    </div>
    <div class="field" style="margin:0;min-width:200px;"><label>Módulo</label>
      <select id="filtroLogModulo" onchange="pintarTablaLogCambios()">
        <option value="">Todos</option>
        ${modulos.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}
      </select>
    </div>
  `;
}

function pintarTablaLogCambios(){
  const cont = document.getElementById("tablaLogCambios");
  if(!logCambiosCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay cambios registrados.</div>`; return; }
  const filtroUsuario = document.getElementById("filtroLogUsuario")?.value || "";
  const filtroModulo = document.getElementById("filtroLogModulo")?.value || "";
  const filas = logCambiosCache.filter(l =>
    (!filtroUsuario || l.usuario===filtroUsuario) && (!filtroModulo || l.modulo===filtroModulo)
  );
  if(!filas.length){ cont.innerHTML = `<div class="emptyState">Ningún cambio coincide con el filtro.</div>`; return; }
  cont.innerHTML = `<table><thead><tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
    ${filas.map(l => `<tr>

      <td>${escapeHtml(l.accion||'-')}</td>
      <td>${escapeHtml(l.detalle||'-')}</td>
