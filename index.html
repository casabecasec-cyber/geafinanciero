async function renderRevisionDocumentos(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Revisión de Documentos</h2><p>Sube órdenes de compra, roles de pago o avalúos y la IA revisa inconsistencias</p></div></div>
    <div class="tabs" id="revisionTabs"></div>
    <div id="revisionContenido"></div>
  `;
  pintarTabsRevision();
  await pintarListaRevision();
}

function pintarTabsRevision(){
  const cont = document.getElementById("revisionTabs");
  cont.innerHTML = Object.keys(REVISION_CONFIG).map(cat =>
    `<button class="tabBtn ${revisionCategoriaActual===cat?'active':''}" onclick="cambiarCategoriaRevision('${cat}')">${REVISION_CONFIG[cat].titulo}</button>`
  ).join("");
}

async function cambiarCategoriaRevision(categoria){
  revisionCategoriaActual = categoria;
  pintarTabsRevision();
  await pintarListaRevision();
}

async function pintarListaRevision(){
  const categoria = revisionCategoriaActual;
  const cfg = REVISION_CONFIG[categoria];
  const cont = document.getElementById("revisionContenido");

  // Primero pintamos el formulario y un estado de "cargando", SIEMPRE,
  // para que el botón de agregar documento nunca dependa de que la carga
  // de la lista haya funcionado.
  cont.innerHTML = `
    <div class="card">
      <p class="helpNote">${cfg.descripcion}</p>
      <div class="field"><label>Nombre / referencia del documento</label><input id="revNombre" placeholder="Ej. Orden de compra #045 - Proveedor XYZ"></div>
      <button class="btn primary" onclick="crearDocumentoRevision('${categoria}')">+ Agregar documento</button>
    </div>
    <div class="card" id="tablaRevision"><div class="emptyState">Cargando...</div></div>
    <div id="modalRevisionHost"></div>
  `;

  const tablaCont = document.getElementById("tablaRevision");
  try{
    revisionDocsCache[categoria] = await cargarDocumentosRevision(categoria);
  }catch(e){
    tablaCont.innerHTML = `<div class="emptyState" style="color:var(--danger);">
      No se pudo cargar la lista de documentos.<br>
      <span style="font-size:12px;">Error: ${escapeHtml(e.message||String(e))}</span><br>
      <span style="font-size:12px;">Si el error menciona "permission_denied", revisa que las reglas de Realtime Database incluyan la ruta "documentos_revision" (ver README-DEPLOY.md).</span>
    </div>`;
    return;
  }
  const lista = revisionDocsCache[categoria];

  tablaCont.innerHTML = !lista.length ? `<div class="emptyState">Aún no hay documentos en esta categoría.</div>` : `
      <table><thead><tr><th>Nombre</th><th>Fecha</th><th>Estado análisis</th><th></th></tr></thead><tbody>
        ${lista.map(d => `<tr>
          <td><b>${escapeHtml(d.nombre||'-')}</b></td>
          <td>${fmtFecha(d.creado)}</td>
          <td>${d.analisisIA ? `<span class="pill ok">Analizado</span>` : `<span class="pill muted">Sin analizar</span>`}</td>
          <td>
            <button class="btn small" onclick="abrirDetalleRevision('${categoria}','${d.id}')">Abrir</button>
            <button class="btn small danger" onclick="confirmarEliminarRevision('${categoria}','${d.id}')">Eliminar</button>
          </td>
        </tr>`).join("")}
      </tbody></table>`;
}

async function crearDocumentoRevision(categoria){
  const nombre = document.getElementById("revNombre").value.trim();
  if(!nombre){ alert("Ponle un nombre o referencia al documento."); return; }
  try{
    const id = await guardarDocumentoRevision({categoria, nombre}, null);
    await pintarListaRevision();
    abrirDetalleRevision(categoria, id);
  }catch(e){
    alert("No se pudo guardar el documento: " + (e.message||String(e)) + "\n\nSi el error menciona 'permission_denied', revisa las reglas de Realtime Database (ver README-DEPLOY.md).");
  }
}

async function confirmarEliminarRevision(categoria, id){
  if(!confirm("¿Eliminar este documento?")) return;
  await eliminarDocumentoRevision(id);
  await pintarListaRevision();
}

async function abrirDetalleRevision(categoria, id){
  revisionDocsCache[categoria] = await cargarDocumentosRevision(categoria);
  const d = revisionDocsCache[categoria].find(x=>x.id===id);
  const cfg = REVISION_CONFIG[categoria];
  const historial = d.historialAnalisis || [];
  const host = document.getElementById("modalRevisionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:720px;">
        <button class="closeX" onclick="document.getElementById('modalRevisionHost').innerHTML=''; pintarListaRevision();">×</button>
        <h3>${escapeHtml(d.nombre)}</h3>
        <p style="color:var(--muted);margin-top:-8px;">${cfg.titulo}</p>
        <div class="field"><label>Archivo (PDF o TXT) — se lee localmente en tu navegador; no se guarda copia en la nube</label>
          <input type="file" id="revArchivo" accept=".pdf,.txt,.xlsx,.xls,.docx">
        </div>
        <div class="field"><label>Texto del documento (pégalo si el archivo no se pudo leer automáticamente)</label>
          <textarea id="revTexto" rows="8">${escapeHtml(d.textoDocumento||"")}</textarea>
        </div>
        <button class="btn primary" onclick="ejecutarRevisionDocumento('${categoria}','${id}')">Analizar con IA</button>
        <span id="revEstado" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>
        <div id="resultadoRevision">${d.analisisIA ? renderResultadoRevisionDocumento(d.analisisIA, d.nombre) : ''}</div>
        ${d.analisisIA && cfg.modoCorreccion ? `
          <div style="margin-top:14px;">
            <button class="btn small" onclick="ejecutarGenerarCorregido('${categoria}','${id}')">📄 Generar documento corregido</button>
            <span id="corregidoEstado" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>
          </div>
          <div id="resultadoCorregido">${d.documentoCorregido ? renderDocumentoCorregido(d.documentoCorregido, d.nombre) : ''}</div>
        ` : ''}
        ${historial.length ? `
          <div style="margin-top:18px;">
            <button class="btn small" onclick="toggleHistorialRevision()">🕑 Ver historial de análisis anteriores (${historial.length})</button>
            <div id="historialRevisionWrap" class="hidden" style="margin-top:10px;"></div>
          </div>` : ''}
      </div>
    </div>`;
  document.getElementById("revArchivo").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById("revEstado").innerHTML = `<span class="spinner"></span> Leyendo archivo...`;
    const texto = await extraerTextoDeArchivo(file);
    document.getElementById("revTexto").value = texto || "(No se pudo extraer texto automáticamente; pega el contenido manualmente)";
    document.getElementById("revEstado").textContent = texto ? "Texto extraído del archivo." : "No se pudo leer automáticamente; pega el texto manualmente.";
  });

  window._historialRevisionActual = historial;
  window._historialRevisionInfo = {categoria, id};
}

function toggleHistorialRevision(){
  const wrap = document.getElementById("historialRevisionWrap");
  const visible = !wrap.classList.contains("hidden");
  if(visible){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const historial = window._historialRevisionActual || [];
  wrap.innerHTML = historial.slice().reverse().map((h,idxRev) => {
    const idxReal = historial.length - 1 - idxRev;
    return `<div class="card" style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:12px;color:var(--muted);">${fmtFecha(h.fecha)}</b>
        <button class="btn small danger" onclick="eliminarHistorialRevision(${idxReal})">Eliminar</button>
      </div>
      ${renderResultadoRevisionDocumento(h.analisis, (revisionDocsCache[window._historialRevisionInfo.categoria].find(x=>x.id===window._historialRevisionInfo.id)||{}).nombre)}
    </div>`;
  }).join("");
}

async function eliminarHistorialRevision(idx){
  if(!confirm("¿Eliminar este análisis del historial?")) return;
  const {categoria, id} = window._historialRevisionInfo;
  const d = revisionDocsCache[categoria].find(x=>x.id===id);
  const nuevoHistorial = (d.historialAnalisis||[]).filter((_,i)=>i!==idx);
  await guardarDocumentoRevision({historialAnalisis: nuevoHistorial}, id);
  await abrirDetalleRevision(categoria, id);
}

async function ejecutarRevisionDocumento(categoria, id){
  const texto = document.getElementById("revTexto").value.trim();
  if(!texto){ alert("Ingresa o pega el texto del documento."); return; }
  const cfg = REVISION_CONFIG[categoria];
  const estadoEl = document.getElementById("revEstado");
  document.getElementById("resultadoRevision").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Analizando con IA...`;
  try{
    const resultado = await llamarIA(cfg.modoIA, texto, cfg.titulo);
    const docActual = revisionDocsCache[categoria].find(x=>x.id===id);
    const historialPrevio = docActual?.historialAnalisis || [];
    const nuevoHistorial = docActual?.analisisIA
      ? [...historialPrevio, { fecha: Date.now(), analisis: docActual.analisisIA }]
      : historialPrevio;
    // Al generar un nuevo análisis, se limpia la corrección anterior (ya no
    // corresponde necesariamente al texto nuevo analizado).
    await guardarDocumentoRevision({ textoDocumento: texto, analisisIA: resultado, historialAnalisis: nuevoHistorial, documentoCorregido: null }, id);
    revisionDocsCache[categoria] = await cargarDocumentosRevision(categoria);
    estadoEl.textContent = "Análisis completo.";
    // Volvemos a abrir el detalle para que aparezca el botón de "Generar documento corregido"
    abrirDetalleRevision(categoria, id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo completar el análisis: " + e.message);
  }
}

async function ejecutarGenerarCorregido(categoria, id){
  const cfg = REVISION_CONFIG[categoria];
  const docActual = revisionDocsCache[categoria].find(x=>x.id===id);
  if(!docActual?.textoDocumento){ alert("Primero ejecuta el análisis con IA."); return; }
  const estadoEl = document.getElementById("corregidoEstado");
  document.getElementById("resultadoCorregido").innerHTML = "";
  estadoEl.innerHTML = `<span class="spinner"></span> Generando documento corregido...`;
  try{
    const contexto = docActual.analisisIA?.resumen || cfg.titulo;
    const resultado = await llamarIA(cfg.modoCorreccion, docActual.textoDocumento, contexto);
    await guardarDocumentoRevision({ documentoCorregido: resultado }, id);
    revisionDocsCache[categoria] = await cargarDocumentosRevision(categoria);
    estadoEl.textContent = "Documento corregido generado.";
    document.getElementById("resultadoCorregido").innerHTML = renderDocumentoCorregido(resultado, docActual.nombre);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar el documento corregido: " + e.message);
  }
}

/* --- Registro y utilidades genéricas de exportación (Word/PDF/Excel) --- */
let _registroResultadosRevision = {};
function registrarResultadoRevision(r, nombreDoc){
  const clave = "r_" + Date.now() + "_" + Math.floor(Math.random()*10000);
  _registroResultadosRevision[clave] = {r, nombreDoc: nombreDoc||"documento"};
  return clave;
}

let _registroBorradores = {};
function registrarBorrador(texto){
  const clave = "b_" + Date.now() + "_" + Math.floor(Math.random()*10000);
  _registroBorradores[clave] = texto;
  return clave;
}
function descargarWordBorrador(clave){
  const texto = _registroBorradores[clave];
  if(!texto) return;
  const html = texto.split("\n").map(l=>`<p>${escapeHtml(l)}</p>`).join("");
  descargarWord("borrador_oficio", html);
}
function descargarPDFBorrador(clave){
  const texto = _registroBorradores[clave];
  if(!texto) return;
  descargarPDF("Borrador de oficio", `<pre>${escapeHtml(texto)}</pre>`);
}

function descargarWord(nombreArchivo, contenidoHtml){
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Documento</title></head><body>${contenidoHtml}</body></html>`;
  const blob = new Blob(["\ufeff", html], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = (nombreArchivo||"documento").replace(/\s+/g,"_") + ".doc"; a.click();
  URL.revokeObjectURL(url);
}

function descargarPDF(titulo, contenidoHtml){
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${escapeHtml(titulo)}</title><style>
    body{font-family:Arial,sans-serif;padding:24px;color:#111;}
    h1{font-size:18px;} h2{font-size:14px;margin-top:18px;}
    table{width:100%;border-collapse:collapse;margin-top:8px;}
    th,td{border:1px solid #ccc;padding:6px;font-size:12px;text-align:left;}
    pre{white-space:pre-wrap;font-family:inherit;font-size:13px;}
  </style></head><body>${contenidoHtml}</body></html>`);
  win.document.close();
  win.focus();
  win.print();
}

function descargarExcelDesdeFilas(nombreArchivo, filas, columnas){
  const datos = [columnas.map(c=>c.label), ...filas.map(f=>columnas.map(c=>f[c.key]||""))];
  const hoja = XLSX.utils.aoa_to_sheet(datos);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Datos");
  XLSX.writeFile(libro, (nombreArchivo||"documento").replace(/\s+/g,"_") + ".xlsx");
}

function construirHtmlRevisionParaExportar(r, nombreDoc){
  const veredictoTexto = {correcto:"Documento correcto", incorrecto:"Documento incorrecto", con_observaciones:"Con observaciones"}[r.veredicto] || "";
  return `
    <h1>${escapeHtml(nombreDoc)}</h1>
    ${veredictoTexto?`<p><b>Veredicto:</b> ${escapeHtml(veredictoTexto)}</p>`:''}
    <p><b>Resumen:</b> ${escapeHtml(r.resumen||'')}</p>
    ${r.explicacion?`<p><b>Explicación:</b> ${escapeHtml(r.explicacion)}</p>`:''}
    ${r.tabla_corregida?.length?`<h2>Documento corregido (comparación)</h2><table><thead><tr><th>Concepto</th><th>Valor original</th><th>Valor corregido</th><th>Observación</th></tr></thead><tbody>
      ${r.tabla_corregida.map(f=>`<tr><td>${escapeHtml(f.concepto||'')}</td><td>${escapeHtml(f.valor_original||'')}</td><td>${escapeHtml(f.valor_corregido||'')}</td><td>${escapeHtml(f.observacion||'')}</td></tr>`).join('')}
    </tbody></table>`:''}
    ${r.texto_corregido?`<h2>Documento corregido (texto completo)</h2><pre>${escapeHtml(r.texto_corregido)}</pre>`:''}
    ${r.recomendaciones?.length?`<h2>Recomendaciones</h2><ul>${r.recomendaciones.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}
  `;
}

function descargarWordRevision(clave){
  const entrada = _registroResultadosRevision[clave];
  if(!entrada) return;
  descargarWord(entrada.nombreDoc, construirHtmlRevisionParaExportar(entrada.r, entrada.nombreDoc));
}
function descargarPDFRevision(clave){
  const entrada = _registroResultadosRevision[clave];
  if(!entrada) return;
  descargarPDF(entrada.nombreDoc, construirHtmlRevisionParaExportar(entrada.r, entrada.nombreDoc));
}
function descargarExcelRevision(clave){
  const entrada = _registroResultadosRevision[clave];
  if(!entrada || !entrada.r.tabla_corregida?.length) return;
  descargarExcelDesdeFilas(entrada.nombreDoc, entrada.r.tabla_corregida, [
    {key:"concepto", label:"Concepto"},
    {key:"valor_original", label:"Valor original"},
    {key:"valor_corregido", label:"Valor corregido"},
    {key:"observacion", label:"Observación"}
  ]);
}

function renderResultadoRevisionDocumento(r, nombreDoc){
  if(!r) return "";
  const iconoTipo = {correcto:"✅", inconsistencia:"🔴", advertencia:"🟡"};
  const veredictoColor = {correcto:"ok", incorrecto:"danger", con_observaciones:"warn"}[r.veredicto] || "muted";
  const veredictoTexto = {correcto:"Documento correcto", incorrecto:"Documento incorrecto", con_observaciones:"Con observaciones"}[r.veredicto] || "";
  return `<div class="aiBox">
    ${r.veredicto?`<p><span class="pill ${veredictoColor}">${veredictoTexto}</span></p>`:''}
    <h4>Resumen</h4><p>${escapeHtml(r.resumen||'')}</p>
    ${r.explicacion?`<h4>Explicación</h4><p>${escapeHtml(r.explicacion)}</p>`:''}
    ${r.hallazgos?.length?`<h4>Cuadro de comprobación</h4>${r.hallazgos.map(h=>`<p>${iconoTipo[h.tipo]||'•'} <b>${escapeHtml(h.item||'')}</b> — ${escapeHtml(h.detalle||'')}</p>`).join("")}`:''}
    ${r.tabla_puntos?.length?`<h4>Puntos principales</h4><table><thead><tr><th>Concepto</th><th>Valor</th><th>Observación</th></tr></thead><tbody>
      ${r.tabla_puntos.map(p=>`<tr><td>${escapeHtml(p.concepto||'')}</td><td>${escapeHtml(p.valor||'')}</td><td>${escapeHtml(p.observacion||'')}</td></tr>`).join("")}
    </tbody></table>`:''}
    ${r.recomendaciones?.length?`<h4>Recomendaciones</h4><ul>${r.recomendaciones.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>`:''}
  </div>`;
}

function renderDocumentoCorregido(r, nombreDoc){
  if(!r || !(r.texto_corregido || r.tabla_corregida?.length)) return "";
  const clave = registrarResultadoRevision(r, nombreDoc||"documento");
  return `<div class="aiBox">
    <h4>📄 Documento corregido</h4>
    ${r.tabla_corregida?.length?`<table><thead><tr><th>Concepto</th><th>Original</th><th>Corregido</th><th>Observación</th></tr></thead><tbody>
      ${r.tabla_corregida.map(f=>`<tr><td>${escapeHtml(f.concepto||'')}</td><td>${escapeHtml(f.valor_original||'')}</td><td>${escapeHtml(f.valor_corregido||'')}</td><td>${escapeHtml(f.observacion||'')}</td></tr>`).join("")}
    </tbody></table>`:''}
    ${r.texto_corregido?`<pre>${escapeHtml(r.texto_corregido)}</pre>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <button class="btn small" onclick="descargarWordRevision('${clave}')">⬇️ Descargar Word</button>
      <button class="btn small" onclick="descargarPDFRevision('${clave}')">⬇️ Descargar PDF</button>
      ${r.tabla_corregida?.length?`<button class="btn small" onclick="descargarExcelRevision('${clave}')">⬇️ Descargar Excel</button>`:''}
    </div>
  </div>`;
}

/* =========================================================================
   MÓDULO: ELABORACIÓN DE MEMOS Y OFICIOS
   ========================================================================= */
async function renderElaboracion(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Elaboración de Memos y Oficios</h2><p>La IA redacta el borrador; tú lo editas y le pides revisiones las veces que necesites</p></div></div>
    <div class="tabs" id="elaboracionTabs"></div>
    <div id="elaboracionContenido"></div>
  `;
  pintarTabsElaboracion();
  await pintarListaElaboracion();
}

function pintarTabsElaboracion(){
  const cont = document.getElementById("elaboracionTabs");
  cont.innerHTML = Object.keys(ELABORACION_CONFIG).map(cat =>
    `<button class="tabBtn ${elaboracionCategoriaActual===cat?'active':''}" onclick="cambiarCategoriaElaboracion('${cat}')">${ELABORACION_CONFIG[cat].titulo}</button>`
  ).join("");
}

async function cambiarCategoriaElaboracion(categoria){
  elaboracionCategoriaActual = categoria;
  pintarTabsElaboracion();
  await pintarListaElaboracion();
}

function badgeEstadoElaboracion(d){
  if(d.confirmado) return `<span class="pill ok">${escapeHtml(d.numeroAsignado||'Definitivo')}</span>`;
  if(d.numeroAsignado) return `<span class="pill warn">${escapeHtml(d.numeroAsignado)} (borrador)</span>`;
  return `<span class="pill muted">Borrador</span>`;
}

async function pintarListaElaboracion(){
  const categoria = elaboracionCategoriaActual;
  const cfg = ELABORACION_CONFIG[categoria];
  const cont = document.getElementById("elaboracionContenido");

  cont.innerHTML = `
    <div class="card">
      <p class="helpNote">${cfg.descripcion}</p>
      <button class="btn primary" onclick="crearDocumentoElaborado('${categoria}')">+ Nuevo ${categoria==='memo'?'memo':'oficio'}</button>
    </div>
    <div class="card" id="tablaElaboracion"><div class="emptyState">Cargando...</div></div>
    <div id="modalElaboracionHost"></div>
  `;

  const tablaCont = document.getElementById("tablaElaboracion");
  try{
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  }catch(e){
    tablaCont.innerHTML = `<div class="emptyState" style="color:var(--danger);">
      No se pudo cargar la lista. Error: ${escapeHtml(e.message||String(e))}<br>
      <span style="font-size:12px;">Si el error menciona "permission_denied", agrega la ruta "documentos_elaborados" y "contadores_documentos" a las reglas de Realtime Database.</span>
    </div>`;
    return;
  }
  const lista = elaboracionDocsCache[categoria];

  tablaCont.innerHTML = !lista.length ? `<div class="emptyState">Aún no hay ${categoria==='memo'?'memos':'oficios'} creados.</div>` : `
    <table><thead><tr><th>N° / Estado</th><th>Solicitud</th><th>Fecha</th><th></th></tr></thead><tbody>
      ${lista.map(d => `<tr>
        <td>${badgeEstadoElaboracion(d)}</td>
        <td>${escapeHtml((d.solicitud||'').slice(0,60))}${(d.solicitud||'').length>60?'…':''}</td>
        <td>${fmtFecha(d.creado)}</td>
        <td>
          <button class="btn small" onclick="abrirDetalleElaboracion('${categoria}','${d.id}')">Abrir</button>
          <button class="btn small danger" onclick="confirmarEliminarElaboracion('${categoria}','${d.id}')">Eliminar</button>
        </td>
      </tr>`).join("")}
    </tbody></table>`;
}

async function crearDocumentoElaborado(categoria){
  try{
    const numero = await obtenerSiguienteNumeroDocumento(categoria);
    const id = await guardarDocumentoElaborado({tipo:categoria, solicitud:"", contenido:"", confirmado:false, numeroAsignado:numero, historialVersiones:[]}, null);
    await pintarListaElaboracion();
    abrirDetalleElaboracion(categoria, id);
  }catch(e){
    alert("No se pudo crear el documento: " + (e.message||String(e)));
  }
}

// Navega de vuelta desde un memo/oficio vinculado hasta el trámite de origen.
function abrirTramiteDesdeElaboracion(tipo, id){
  document.getElementById("modalElaboracionHost").innerHTML = "";
  const view = tipo==="publico" ? "publicos" : "privados";
  currentView = view;
  document.querySelectorAll(".navBtn").forEach(b => b.classList.toggle("active", b.dataset.view===view));
  renderTramites(tipo).then(() => abrirDetalleTramite(tipo, id));
}

async function confirmarEliminarElaboracion(categoria, id){
  if(!confirm("¿Eliminar este documento?")) return;
  await eliminarDocumentoElaborado(id);
  await pintarListaElaboracion();
}

async function abrirDetalleElaboracion(categoria, id){
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  let d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  // Auto-corrección: documentos marcados como definitivos ANTES de que el
  // número se empezara a asignar automáticamente pudieron quedar sin número,
  // y como el botón "Marcar como definitivo" ya no aparece una vez confirmado,
  // no había forma de dispararlo de nuevo. Se asigna aquí, en silencio, apenas
  // se detecta el caso, para que quede resuelto sin que el usuario tenga que hacer nada.
  if(d.confirmado && !d.numeroAsignado){
    const numero = await obtenerSiguienteNumeroDocumento(categoria);
    await guardarDocumentoElaborado({ numeroAsignado: numero }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  }
  // Auto-corrección: documentos generados antes de que le pidiéramos a la IA
  // que no incluya su propia línea de "MEMORANDO N°"/"OFICIO N°" (que queda en
  // blanco/subrayada) pueden traerla duplicada junto al encabezado con el
  // número real que ya agrega la app. Se limpia aquí, en silencio.
  const contenidoLimpio = quitarNumeroPlaceholderDelCuerpo(d.contenido);
  if(contenidoLimpio !== d.contenido){
    await guardarDocumentoElaborado({ contenido: contenidoLimpio }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  }
  const cfg = ELABORACION_CONFIG[categoria];
  const host = document.getElementById("modalElaboracionHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:720px;">
        <button class="closeX" onclick="document.getElementById('modalElaboracionHost').innerHTML=''; pintarListaElaboracion();">×</button>
        <h3>${cfg.titulo.slice(0,-1)} ${badgeEstadoElaboracion(d)}</h3>
        ${d.tramiteVinculado ? `<p class="helpNote">🔗 Vinculado al trámite ${d.tramiteVinculado.tipo==='publico'?'público':'privado'} de <b>${escapeHtml(d.tramiteVinculado.institucion||'')}</b>${d.tramiteVinculado.asunto?' — '+escapeHtml(d.tramiteVinculado.asunto):''}. <button class="btn small" onclick="abrirTramiteDesdeElaboracion('${d.tramiteVinculado.tipo}','${d.tramiteVinculado.id}')">Ver trámite</button></p>` : ''}
        <div class="field"><label>¿Qué ${categoria==='memo'?'memo':'oficio'} necesitas? (describe destinatario, asunto, puntos clave)</label>
          <textarea id="elabSolicitud" rows="3" ${d.confirmado?'disabled':''}>${escapeHtml(d.solicitud||"")}</textarea>
        </div>
        <button class="btn primary" onclick="ejecutarGenerarDocumento('${categoria}','${id}')" ${d.confirmado?'disabled':''}>✨ Generar con IA</button>
        <span id="elabEstadoGenerar" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>

        <div class="field" style="margin-top:16px;"><label>Contenido del ${categoria==='memo'?'memo':'oficio'} (editable — se guarda automáticamente al salir del cuadro)</label>
          <textarea id="elabContenido" rows="14" ${d.confirmado?'disabled':''} onblur="guardarContenidoManual('${categoria}','${id}', true)">${escapeHtml(d.contenido||"")}</textarea>
        </div>
        <button class="btn small" onclick="guardarContenidoManual('${categoria}','${id}')" ${d.confirmado?'disabled':''}>💾 Guardar cambios manuales</button>
        <span id="elabEstadoAutoguardado" style="margin-left:10px;color:var(--muted);font-size:12px;"></span>

        <div class="field" style="margin-top:16px;"><label>Instrucciones para que la IA revise/corrija (opcional)</label>
          <textarea id="elabInstrucciones" rows="2" placeholder="Ej. hazlo más formal, corrige la fecha, agrega un párrafo sobre..." ${d.confirmado?'disabled':''}></textarea>
        </div>
        <button class="btn" onclick="ejecutarRevisarDocumento('${categoria}','${id}')" ${d.confirmado?'disabled':''}>🔄 Revisar/Corregir con IA</button>
        <span id="elabEstadoRevisar" style="margin-left:10px;color:var(--muted);font-size:13px;"></span>

        <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;">
          ${!d.confirmado ? `<button class="btn green" onclick="confirmarDocumentoElaborado('${categoria}','${id}')">✅ Marcar como definitivo</button>` : ''}
          <button class="btn small" onclick="imprimirDocumentoElaborado('${categoria}','${id}')">🖨️ Imprimir</button>
          <button class="btn small" onclick="descargarPDFElaboracion('${categoria}','${id}')">⬇️ Descargar PDF</button>
          <button class="btn small" onclick="descargarWordElaboracion('${categoria}','${id}')">⬇️ Descargar Word</button>
        </div>
        ${(d.historialVersiones||[]).length ? `
          <div style="margin-top:16px;">
            <button class="btn small" onclick="toggleHistorialElaboracion()">🕑 Ver versiones anteriores (${d.historialVersiones.length})</button>
            <div id="historialElaboracionWrap" class="hidden" style="margin-top:10px;"></div>
          </div>` : ''}
      </div>
    </div>`;
  window._historialElaboracionActual = d.historialVersiones||[];
}

async function guardarContenidoManual(categoria, id, silencioso){
  const contenido = document.getElementById("elabContenido").value;
  const solicitud = document.getElementById("elabSolicitud").value;
  await guardarDocumentoElaborado({ contenido, solicitud }, id);
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  if(silencioso){
    setSafeText("elabEstadoAutoguardado", "Guardado automáticamente " + new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}));
  } else {
    const estadoEl = document.getElementById("elabEstadoRevisar");
    if(estadoEl) estadoEl.textContent = "Cambios guardados.";
  }
}

async function ejecutarGenerarDocumento(categoria, id){
  const solicitud = document.getElementById("elabSolicitud").value.trim();
  if(!solicitud){ alert("Describe qué necesitas que redacte la IA."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const estadoEl = document.getElementById("elabEstadoGenerar");
  estadoEl.innerHTML = `<span class="spinner"></span> Generando...`;
  try{
    const resultado = await llamarIA(cfg.modoGenerar, solicitud, "");
    const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = docActual?.contenido
      ? [...historialPrevio, { fecha: Date.now(), contenido: docActual.contenido, origen: "Generación anterior" }]
      : historialPrevio;
    await guardarDocumentoElaborado({ solicitud, contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    estadoEl.textContent = "Borrador generado.";
    abrirDetalleElaboracion(categoria, id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo generar el documento: " + e.message);
  }
}

async function ejecutarRevisarDocumento(categoria, id){
  const contenidoActual = document.getElementById("elabContenido").value.trim();
  const instrucciones = document.getElementById("elabInstrucciones").value.trim();
  if(!contenidoActual){ alert("Aún no hay contenido para revisar. Genera primero un borrador."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const estadoEl = document.getElementById("elabEstadoRevisar");
  estadoEl.innerHTML = `<span class="spinner"></span> Revisando con IA...`;
  try{
    const resultado = await llamarIA(cfg.modoRevisar, contenidoActual, instrucciones);
    const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
    const historialPrevio = docActual?.historialVersiones || [];
    const nuevoHistorial = [...historialPrevio, { fecha: Date.now(), contenido: contenidoActual, origen: instrucciones || "Revisión general" }];
    await guardarDocumentoElaborado({ contenido: resultado.texto, historialVersiones: nuevoHistorial }, id);
    elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
    estadoEl.textContent = "Revisión aplicada.";
    abrirDetalleElaboracion(categoria, id);
  }catch(e){
    estadoEl.textContent = "";
    alert("No se pudo revisar el documento: " + e.message);
  }
}

async function confirmarDocumentoElaborado(categoria, id){
  const docActual = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!docActual?.contenido?.trim()){ alert("Genera o escribe el contenido antes de marcarlo como definitivo."); return; }
  if(!confirm("Al marcarlo como definitivo ya no se podrá seguir editando este documento. ¿Continuar?")) return;
  const payload = { confirmado:true, fechaConfirmado:Date.now() };
  // Salvaguarda: documentos creados antes de que el número se asignara
  // automáticamente al crear (versión anterior de la app) todavía pueden no
  // tener número — se les asigna aquí para que nunca quede uno "definitivo" sin número.
  if(!docActual.numeroAsignado){
    payload.numeroAsignado = await obtenerSiguienteNumeroDocumento(categoria);
  }
  await guardarDocumentoElaborado(payload, id);
  elaboracionDocsCache[categoria] = await cargarDocumentosElaborados(categoria);
  abrirDetalleElaboracion(categoria, id);
}

function toggleHistorialElaboracion(){
  const wrap = document.getElementById("historialElaboracionWrap");
  const visible = !wrap.classList.contains("hidden");
  if(visible){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const historial = window._historialElaboracionActual || [];
  wrap.innerHTML = historial.slice().reverse().map(h => `
    <div class="card" style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;"><b style="font-size:12px;color:var(--muted);">${fmtFecha(h.fecha)}</b> <span class="pill muted">${escapeHtml(h.origen||'')}</span></div>
      <pre style="margin-top:6px;">${escapeHtml(h.contenido||'')}</pre>
    </div>`
  ).join("");
}

// Encabezado usado al imprimir/descargar un memo/oficio. Nunca dice "sin
// confirmar" si el documento SÍ está marcado como definitivo (aunque, por
// alguna razón, no tuviera número asignado) — evita el bug de mostrar
// "BORRADOR" en un documento que ya se confirmó.
function encabezadoDocumentoElaborado(d){
  if(d.numeroAsignado){
    return `<p><b>N° ${escapeHtml(d.numeroAsignado)}</b> · ${fmtFecha(d.fechaConfirmado||d.creado)}</p>`;
  }
  if(d.confirmado){
    return `<p><b>DOCUMENTO DEFINITIVO</b> · ${fmtFecha(d.fechaConfirmado||d.creado)}</p>`;
  }
  return `<p style="color:#b00;"><b>BORRADOR — sin confirmar</b> · ${fmtFecha(d.creado)}</p>`;
}

async function imprimirDocumentoElaborado(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para imprimir."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezado = encabezadoDocumentoElaborado(d);
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${cfg.titulo.slice(0,-1)} ${escapeHtml(d.numeroAsignado||'')}</title>

}

// Descarga el memo/oficio en PDF: abre el diálogo de impresión del navegador
// con "Guardar como PDF" ya disponible (mismo mecanismo usado en el resto de
// la app para "descargar PDF", ya que no se carga una librería de generación
// de PDF en el navegador). Queda como una acción aparte de "Imprimir" para
// que sea explícito que el resultado se puede guardar como archivo.
async function descargarPDFElaboracion(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para descargar."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezado = encabezadoDocumentoElaborado(d);
  const nombreArchivo = `${cfg.titulo.slice(0,-1)}_${d.numeroAsignado||'borrador'}`.replace(/\s+/g,"_");
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${escapeHtml(nombreArchivo)}</title>
    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111;} pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5;}</style>
    </head><body>${encabezado}<hr><pre>${escapeHtml(d.contenido)}</pre>
    <script>window.onload = () => setTimeout(() => window.print(), 200);<\/script>
    </body></html>`);
  win.document.close();
  win.focus();
}

async function descargarWordElaboracion(categoria, id){
  const d = elaboracionDocsCache[categoria].find(x=>x.id===id);
  if(!d?.contenido){ alert("Aún no hay contenido para descargar."); return; }
  const cfg = ELABORACION_CONFIG[categoria];
  const encabezadoHtml = encabezadoDocumentoElaborado(d);
  const cuerpoHtml = d.contenido.split("\n").map(l=>`<p>${escapeHtml(l)||'&nbsp;'}</p>`).join("");
  const nombreArchivo = `${cfg.titulo.slice(0,-1)}_${d.numeroAsignado||'borrador'}`;
  descargarWord(nombreArchivo, encabezadoHtml + cuerpoHtml);
}

function showDocTab(tab, btnEl){
  document.querySelectorAll("#legalesRoot .doc-tab").forEach(t => t.classList.remove("active"));

}

async function pintarListaDocLegalGuardados(tipo){
  const cont = document.getElementById("docHistLista");
  if(!cont) return;
  cont.innerHTML = `<div class="emptyState">Cargando...</div>`;
  try{
    documentosLegalesGuardados[tipo] = await cargarDocumentosLegales(tipo);
  }catch(e){
    cont.innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "documentos_legales" a las reglas de Realtime Database.</span></div>`;
    return;
  }
  const lista = documentosLegalesGuardados[tipo];
  cont.innerHTML = !lista.length ? `<div class="emptyState">Aún no hay ${DOC_LEGAL_TIPOS[tipo].replace(/^\S+\s/,'')} guardados.</div>` : `
    <table><thead><tr><th>Descripción</th><th>Fecha</th><th></th></tr></thead><tbody>
      ${lista.map(d => `<tr>
        <td>${escapeHtml(d.descripcion||'-')}</td>

function downloadFile(content, filename, mime="text/plain"){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download:filename });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// VALIDADOR DE CÉDULA / RUC ECUATORIANO (Algoritmo Módulo 10 / 11 — SRI)
// ════════════════════════════════════════════════════════════════
function validarCedulaEcuador(cedula) {
  if (!/^\d{10}$/.test(cedula)) return { valido:false, msg:'Debe tener 10 dígitos' };
  const provincia = parseInt(cedula.substring(0,2), 10);
  if (provincia < 1 || provincia > 24) return { valido:false, msg:'Código de provincia inválido' };
  const tercerDigito = parseInt(cedula[2], 10);
  if (tercerDigito > 6) return { valido:false, msg:'Tercer dígito inválido para cédula' };
  const coef = [2,1,2,1,2,1,2,1,2];
  let suma = 0;
  for (let i=0;i<9;i++) {
    let val = parseInt(cedula[i],10) * coef[i];
    if (val >= 10) val -= 9;
    suma += val;
  }
  const verificador = (10 - (suma % 10)) % 10;
  const digitoVerificador = parseInt(cedula[9], 10);
  return verificador === digitoVerificador
    ? { valido:true, msg:'Cédula válida' }
    : { valido:false, msg:'Dígito verificador incorrecto' };
}

function validarRucEcuador(ruc) {
  if (!/^\d{13}$/.test(ruc)) return { valido:false, msg:'El RUC debe tener 13 dígitos' };
  const tercerDigito = parseInt(ruc[2], 10);
  const base = ruc.substring(0,10);
  // Persona natural (tercer dígito 0-5)
  if (tercerDigito >= 0 && tercerDigito <= 5) {
    const cedValida = validarCedulaEcuador(base);
    if (!cedValida.valido) return { valido:false, msg:'RUC inválido (cédula base incorrecta)' };
    if (ruc.substring(10) !== '001') return { valido:false, msg:'El RUC debe terminar en 001 para persona natural' };
    return { valido:true, msg:'RUC de persona natural válido' };
  }
  // Sociedad pública (tercer dígito 6)
  if (tercerDigito === 6) {
    const coef = [3,2,7,6,5,4,3,2];
    let suma = 0;
    for (let i=0;i<8;i++) suma += parseInt(ruc[i],10) * coef[i];
    const mod = suma % 11;
    const verificador = mod === 0 ? 0 : 11 - mod;
    if (verificador !== parseInt(ruc[8],10)) return { valido:false, msg:'Dígito verificador incorrecto (entidad pública)' };
    return { valido:true, msg:'RUC de entidad pública válido' };
  }
  // Sociedad privada (tercer dígito 9)
  if (tercerDigito === 9) {
    const coef = [4,3,2,7,6,5,4,3,2];
    let suma = 0;
    for (let i=0;i<9;i++) suma += parseInt(ruc[i],10) * coef[i];
    const mod = suma % 11;
    const verificador = mod === 0 ? 0 : 11 - mod;
    if (verificador !== parseInt(ruc[9],10)) return { valido:false, msg:'Dígito verificador incorrecto (sociedad privada)' };
    return { valido:true, msg:'RUC de sociedad privada válido' };
  }
  return { valido:false, msg:'Tercer dígito de RUC no reconocido' };
}

// Valida automáticamente cédula (10 díg.) o RUC (13 díg.) según longitud
function validarIdentificacionEC(valor) {
  if (!valor) return { valido:null, msg:'' };
  const v = valor.replace(/\D/g,'');
  if (v.length === 10) return validarCedulaEcuador(v);
  if (v.length === 13) return validarRucEcuador(v);
  return { valido:false, msg:'Debe tener 10 (cédula) o 13 (RUC) dígitos' };
}

// Aplica validación visual en vivo a un <input>: bordea verde/rojo y muestra mensaje
function bindValidacionCI(inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  let msgEl = document.getElementById(inputId + '-msg');
  if (!msgEl) {
    msgEl = document.createElement('div');
    msgEl.id = inputId + '-msg';
    msgEl.style.cssText = 'font-size:.68rem;margin-top:3px;min-height:14px;';
    input.parentNode.appendChild(msgEl);
  }
  input.addEventListener('input', () => {
    const v = input.value.replace(/\D/g,'');
    input.value = v;
    if (v.length < 10) { msgEl.textContent=''; input.style.borderColor=''; return; }
    const r = validarIdentificacionEC(v);
    input.style.borderColor = r.valido ? 'var(--emerald)' : '#ef4444';
    msgEl.textContent = r.valido ? '✓ ' + r.msg : '✗ ' + r.msg;
    msgEl.style.color = r.valido ? 'var(--emerald)' : '#ef4444';
  });
}

function fmtDate(dateStr) {
  if (!dateStr) return '___';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es-EC', {day:'numeric', month:'long', year:'numeric'});
}

  // Validación de cédula/RUC del deudor y acreedor según legislación ecuatoriana
  if (ciDeudor) {

  }
  if (deudorConyugeFirma === 'si' && deudorConyugeCi) {

  document.getElementById('pagare-preview').innerHTML = `

      <div class="doc-title">PAGARÉ A LA ORDEN</div>
      <div class="doc-subtitle">Documento Título-Valor · Art. 486 y siguientes del Código de Comercio del Ecuador</div>

function generarLetra() {
  const ciudad = document.getElementById('let-ciudad').value;
  const fecha = document.getElementById('let-fecha').value;
  const monto = parseFloat(document.getElementById('let-monto').value);
  const vencimiento = document.getElementById('let-vencimiento').value;
  const librador = document.getElementById('let-librador').value;
  const ciLibrador = document.getElementById('let-ci-librador').value.replace(/\D/g,'');
  const librado = document.getElementById('let-librado').value;
  const ciLibrado = document.getElementById('let-ci-librado').value.replace(/\D/g,'');
  const libradoCivil = document.getElementById('let-librado-civil')?.value || 'soltero';
  const libradoConyugeFirma = document.getElementById('let-librado-conyuge-firma')?.value || 'no';
  const libradoConyuge = document.getElementById('let-librado-conyuge')?.value || '';
  const libradoConyugeCi = document.getElementById('let-librado-conyuge-ci')?.value.replace(/\D/g,'') || '';
  const beneficiario = document.getElementById('let-beneficiario').value;
  const ciBeneficiario = document.getElementById('let-ci-beneficiario')?.value.replace(/\D/g,'') || '';
  const domicilio = document.getElementById('let-domicilio').value;
  const sinProtesto = document.getElementById('let-sin-protesto')?.value || 'no';
  const mediacion = document.getElementById('let-mediacion')?.value || 'no';

  if (!librador || !librado || !beneficiario || !monto) { toast('Complete los campos obligatorios', 'error'); return; }

  // Validación de cédula/RUC conforme a la legislación ecuatoriana
  for (const [label, valor] of [['Librador', ciLibrador], ['Librado', ciLibrado], ['Beneficiario', ciBeneficiario]]) {
    if (valor) {
      const v = validarIdentificacionEC(valor);
      if (!v.valido) { toast(`Cédula/RUC del ${label} inválido: ` + v.msg, 'error'); return; }
    }
  }
  if (libradoConyugeFirma === 'si' && libradoConyugeCi) {
    const v = validarCedulaEcuador(libradoConyugeCi);
    if (!v.valido) { toast('Cédula del cónyuge inválida: ' + v.msg, 'error'); return; }
  }

  const letras = montoEnLetrasUSD(monto);
  const fI = fmtDate(fecha);
  const fV = fmtDate(vencimiento);

  const clausulaProtesto = sinProtesto === 'si'
    ? `<p>Las partes convienen expresamente la <strong>dispensa de protesto</strong> ("sin protesto / sin gastos"), conforme lo permite el Art. 460 del Código de Comercio, por lo que el tenedor conservará la acción cambiaria contra todos los obligados sin necesidad de levantar protesto notarial en caso de falta de pago.</p>`
    : `<p>En caso de falta de pago a su vencimiento, el tenedor deberá levantar el <strong>protesto</strong> correspondiente dentro de los dos (2) días hábiles siguientes, conforme a los Arts. 458 y 459 del Código de Comercio, a efectos de conservar la acción cambiaria contra el librador y los endosantes.</p>`;

  const clausulaMediacionLetra = mediacion === 'si'
    ? `<div style="margin-top:.75rem;padding:.5rem;font-size:.8rem;font-family:Georgia,serif">
        <strong>CLÁUSULA DE MEDIACIÓN:</strong> Las partes acuerdan someter cualquier controversia derivada de la presente letra de cambio a un proceso de mediación previo ante un Centro de Mediación calificado, conforme a la Ley de Arbitraje y Mediación del Ecuador, antes de iniciar la vía judicial.
      </div>`
    : '';

  // Cláusula de firma de cónyuge del librado (garantía conyugal), si aplica
  let conyugeTextLetra = '';
  let conyugeFirmaHTMLLetra = '';
  if ((libradoCivil === 'casado' || libradoCivil === 'union') && libradoConyugeFirma === 'si' && libradoConyuge) {
    conyugeTextLetra = `<p>Comparece además <strong>${libradoConyuge}</strong>${libradoConyugeCi ? ` (C.I.: <strong>${libradoConyugeCi}</strong>)` : ''}, en calidad de cónyuge del librado, quien presta su consentimiento expreso a la presente obligación conforme al Art. 180 y siguientes del Código Civil, garantizando solidariamente el cumplimiento de la misma respecto de los bienes de la sociedad conyugal.</p>`;
    conyugeFirmaHTMLLetra = `<div class="doc-firma">
        <br><br><br>
        <div class="doc-firma-line">${libradoConyuge}<br>C.I.: ${libradoConyugeCi || '___'}<br><em>Cónyuge del Librado</em></div>
      </div>`;
  }

  document.getElementById('letra-preview').innerHTML = `
    <div class="doc-header">
      <div class="doc-title">LETRA DE CAMBIO</div>
      <div class="doc-subtitle">Título Valor · Arts. 410 al 485 del Código de Comercio del Ecuador</div>
    </div>
    <div class="doc-monto-box">
      LUGAR DE EMISIÓN: ${ciudad} &nbsp;|&nbsp; FECHA DE EMISIÓN: ${fI} &nbsp;|&nbsp; VENCE: ${fV}
      <br>VALOR: USD $ ${monto.toLocaleString('es-EC', {minimumFractionDigits:2})}
    </div>
    <div class="doc-body">
      <p>Por esta ÚNICA letra de cambio, sírvase Ud. pagar incondicionalmente a la orden de <strong>${beneficiario}</strong>${ciBeneficiario ? ` (C.I./RUC: <strong>${ciBeneficiario}</strong>)` : ''}, en la fecha de vencimiento señalada, la cantidad de <strong>DÓLARES DE LOS ESTADOS UNIDOS DE NORTEAMÉRICA (USD) ${monto.toLocaleString('es-EC', {minimumFractionDigits:2})}</strong> (<em>${letras}</em>), valor recibido a su entera satisfacción, que cargará Ud. en cuenta sin aviso, según lo dispuesto en el Art. 410 y siguientes del Código de Comercio del Ecuador.</p>
      <br>
      <p><strong>LIBRADOR (Quien emite la orden de pago):</strong> ${librador}${ciLibrador ? ` · C.I./RUC: ${ciLibrador}` : ''}</p>
      <p><strong>LIBRADO (Quien debe pagar):</strong> ${librado}${ciLibrado ? ` · C.I./RUC: ${ciLibrado}` : ''}</p>
      <p><strong>Domicilio para el pago:</strong> ${domicilio || ciudad}</p>
      ${conyugeTextLetra}
      <br>
      <p>El LIBRADO, al estampar su firma de aceptación al pie de este documento, se constituye en obligado principal y directo al pago de la cantidad señalada, conforme al Art. 437 del Código de Comercio, comprometiéndose a satisfacer su importe en la fecha y lugar indicados, sin necesidad de requerimiento previo.</p>
      ${clausulaProtesto}
      <p>Para todos los efectos legales derivados de la presente letra de cambio, las partes se someten a los jueces competentes de la ciudad de <strong>${ciudad}</strong>, renunciando expresamente a fuero y domicilio, y reconociendo a su cargo los honorarios profesionales y costas judiciales que se llegaren a generar en caso de acción de cobro.</p>
    </div>
    <div class="doc-firma-row">
      <div class="doc-firma">
        <br><br><br>
        <div class="doc-firma-line">${librador}<br>C.I./RUC: ${ciLibrador || '___'}<br><em>Librador / Girador</em></div>
      </div>
      <div class="doc-firma">
        <br><br><br>
        <div class="doc-firma-line">${librado}<br>C.I./RUC: ${ciLibrado || '___'}<br><em>Acepto · Librado</em></div>
      </div>
      ${conyugeFirmaHTMLLetra}
    </div>
    ${(() => {
      const endosable = document.getElementById('let-endosable')?.value;
      if (endosable === 'si') {
        return `<div style="margin-top:1rem;padding:.6rem;border-top:1px solid #333;font-size:.78rem;font-family:Georgia,serif">
          <strong>CLÁUSULA DE ENDOSO:</strong> La presente letra de cambio es transferible mediante endoso conforme al Art. 446 del Código de Comercio. El endoso se efectuará al dorso del documento, indicando el nombre del endosatario, fecha y firma del endosante.
        </div>`;
      }
      return `<div style="margin-top:.75rem;padding:.5rem;font-size:.78rem;font-family:Georgia,serif;color:#666"><em>NO A LA ORDEN — Esta letra de cambio no es transferible por endoso, conforme lo permite el Art. 446 del Código de Comercio.</em></div>`;
    })()}
    ${clausulaMediacionLetra}
    <div class="doc-footer">
      Documento generado por FinanceOS Ecuador · ${new Date().toLocaleDateString('es-EC')} · Requiere firma original y legalización notarial para plena validez legal.
    </div>
  `;
  toast('Letra de cambio generada', 'success');
  guardarHistorialDocumento('letra', librador + ' → ' + librado, {
    ciudad, fecha, monto, vencimiento, librador, ciLibrador, librado, ciLibrado,
    beneficiario, ciBeneficiario, domicilio, sinProtesto, mediacion,
    libradoCivil, libradoConyugeFirma, libradoConyuge, libradoConyugeCi,
  });
}

function generarIngresoCaja() {
  const ciudad = document.getElementById('ic-ciudad').value;
  const fecha = document.getElementById('ic-fecha').value;
  const numero = document.getElementById('ic-numero').value.trim();
  const de = document.getElementById('ic-de').value.trim();
  const ciDe = document.getElementById('ic-ci-de').value.replace(/\D/g,'');
  const concepto = document.getElementById('ic-concepto').value.trim();
  const efectivo = parseFloat(document.getElementById('ic-efectivo').value) || 0;
  const cheque = parseFloat(document.getElementById('ic-cheque').value) || 0;
  const chequeNumero = document.getElementById('ic-cheque-numero').value.trim();
  const chequeBanco = document.getElementById('ic-cheque-banco').value.trim();
  const transferencia = parseFloat(document.getElementById('ic-transferencia').value) || 0;
  const transferenciaNumero = document.getElementById('ic-transferencia-numero').value.trim();
  const transferenciaBanco = document.getElementById('ic-transferencia-banco').value.trim();
  const receptor = document.getElementById('ic-receptor').value.trim();
  const receptorCargo = document.getElementById('ic-receptor-cargo').value.trim();
  const observaciones = document.getElementById('ic-observaciones').value.trim();

  if (!de || !concepto) { toast('Complete los campos obligatorios (Recibido de, Concepto)', 'error'); return; }
  const total = efectivo + cheque + transferencia;
  if (total <= 0) { toast('Ingresa al menos un monto en alguna forma de pago', 'error'); return; }
  if (cheque > 0 && !chequeNumero) { toast('Ingresa el N° de cheque', 'error'); return; }
  if (transferencia > 0 && !transferenciaNumero) { toast('Ingresa el N° de transferencia/referencia', 'error'); return; }
  if (ciDe) {
    const v = validarIdentificacionEC(ciDe);
    if (!v.valido) { toast('Cédula/RUC inválido: ' + v.msg, 'error'); return; }
  }

  const letras = montoEnLetrasUSD(total);
  const fI = fmtDate(fecha);

  const filasFormaPago = [];
  if (efectivo > 0) filasFormaPago.push(`<tr><td style="padding:4px;">Efectivo</td><td style="padding:4px;"></td><td class="num" style="text-align:right;padding:4px;">$${efectivo.toFixed(2)}</td></tr>`);
  if (cheque > 0) filasFormaPago.push(`<tr><td style="padding:4px;">Cheque</td><td style="padding:4px;">N° ${chequeNumero || '___'}${chequeBanco?' · '+chequeBanco:''}</td><td class="num" style="text-align:right;padding:4px;">$${cheque.toFixed(2)}</td></tr>`);
  if (transferencia > 0) filasFormaPago.push(`<tr><td style="padding:4px;">Transferencia</td><td style="padding:4px;">N° ${transferenciaNumero || '___'}${transferenciaBanco?' · '+transferenciaBanco:''}</td><td class="num" style="text-align:right;padding:4px;">$${transferencia.toFixed(2)}</td></tr>`);

  document.getElementById('ingresocaja-preview').innerHTML = `
    <div class="doc-header">
      <div class="doc-title">INGRESO DE CAJA</div>
      <div class="doc-subtitle">${numero ? 'Comprobante N° ' + numero + ' · ' : ''}${ciudad}, ${fI}</div>
    </div>
    <div class="doc-monto-box">VALOR TOTAL RECIBIDO: USD $ ${total.toLocaleString('es-EC', {minimumFractionDigits:2})}</div>
    <div class="doc-body">
      <p>RECIBIDO DE: <strong>${de}</strong>${ciDe ? ` · C.I./RUC: <strong>${ciDe}</strong>` : ''}</p>
      <p>LA CANTIDAD DE: <em>${letras}</em></p>
      <p>POR CONCEPTO DE: <strong>${concepto}</strong></p>
      <br>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem;">
        <thead><tr style="border-bottom:1px solid #333;"><th style="text-align:left;padding:4px;">Forma de pago</th><th style="text-align:left;padding:4px;">Referencia</th><th style="text-align:right;padding:4px;">Monto</th></tr></thead>
        <tbody>${filasFormaPago.join('')}</tbody>
        <tfoot><tr style="border-top:2px solid #333;font-weight:bold;"><td colspan="2" style="padding:4px;">TOTAL</td><td style="text-align:right;padding:4px;">$${total.toFixed(2)}</td></tr></tfoot>
      </table>
      ${observaciones ? `<br><p><strong>Observaciones:</strong> ${observaciones}</p>` : ''}
      <br>
      <p>Y para constancia de lo cual, se emite el presente comprobante en la ciudad de ${ciudad}, a ${fI}.</p>
    </div>
    <div class="doc-firma-row">
      <div class="doc-firma">
        <br><br><br>
        <div class="doc-firma-line">${receptor || '___'}${receptorCargo ? '<br>'+receptorCargo : ''}<br><em>Recibí conforme · Caja</em></div>
      </div>
      <div class="doc-firma">
        <br><br><br>
        <div class="doc-firma-line">${de}<br>C.I./RUC: ${ciDe || '___'}<br><em>Entregué conforme</em></div>
      </div>
    </div>
    <div class="doc-footer">
      Documento generado por Geafinanciero · ${new Date().toLocaleDateString('es-EC')} · Comprobante de control interno — consérvese como respaldo contable.
    </div>
  `;
  toast('Ingreso de caja generado', 'success');
  guardarHistorialDocumento('ingresocaja', de + ' - $' + total.toFixed(2), {
    ciudad, fecha, numero, de, ciDe, concepto,
    efectivo, cheque, chequeNumero, chequeBanco,
    transferencia, transferenciaNumero, transferenciaBanco,
    total, receptor, receptorCargo, observaciones,
  });
}

function imprimirDocumento(previewId) {
  const content = document.getElementById(previewId).innerHTML;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Documento</title><style>
    body{font-family:'Times New Roman',serif;padding:40px;color:#111;font-size:13px;line-height:1.7}
    .doc-title{font-size:20px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
    .doc-subtitle{text-align:center;color:#555;font-size:12px;margin-bottom:20px}
    .doc-monto-box{border:2px solid #333;padding:12px;text-align:center;font-size:14px;font-weight:700;margin:20px 0}
    .doc-body p{margin-bottom:10px;text-align:justify}
    .doc-firma-row{display:flex;justify-content:space-between;margin-top:60px}
    .doc-firma{text-align:center;width:45%}
    .doc-firma-line{border-top:1px solid #333;padding-top:6px;font-size:12px}
    .doc-footer{border-top:1px solid #ccc;padding-top:10px;font-size:10px;color:#777;margin-top:30px}
  </style></head><body>${content}</body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

function actualizarCamposTrabajo() {
  const tipo = document.getElementById('trab-tipo')?.value;
  const plazoBox = document.getElementById('trab-plazo-box');
  const pruebaBox = document.getElementById('trab-prueba-box');
  // El plazo solo aplica a modalidades con duración definida
  const requierePlazo = ['plazo_fijo','eventual','temporada','parcial'].includes(tipo);
  if (plazoBox) plazoBox.style.display = requierePlazo ? 'block' : 'none';
  // El período de prueba (Art. 15 CT) solo aplica a contratos indefinidos
  if (pruebaBox) pruebaBox.style.display = tipo === 'indefinido' ? 'block' : 'none';
}

function calcularBeneficios() {
  const sueldo = parseFloat(document.getElementById('trab-sueldo')?.value) || 0;
  const box = document.getElementById('trab-beneficios-box');
  if (!box || sueldo <= 0) return;
  const decTer = sueldo;
  const decCuar = 460; // SBU 2024
  const vacaciones = sueldo / 24;
  const fondosRes = sueldo * 0.0833;
  const iessEmpleado = sueldo * 0.0945;
  const iessEmpleador = sueldo * 0.1215;
  const totalAnual = (sueldo * 12) + decTer + decCuar + (vacaciones * 2) + (fondosRes * 12);
  box.innerHTML = `<strong style="color:var(--accent-gold)">💼 Costos laborales estimados:</strong><br>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.3rem .75rem;margin-top:.5rem;font-size:.82rem">
      <span>Décimo tercero:</span><span style="color:var(--accent-gold);font-family:var(--font-mono)">$${decTer.toFixed(2)}</span>
      <span>Décimo cuarto:</span><span style="color:var(--accent-gold);font-family:var(--font-mono)">$${decCuar.toFixed(2)}</span>
      <span>Vacaciones (15d):</span><span style="color:var(--accent-gold);font-family:var(--font-mono)">$${(vacaciones*15).toFixed(2)}</span>
      <span>Fondos de reserva/mes:</span><span style="color:var(--accent-gold);font-family:var(--font-mono)">$${fondosRes.toFixed(2)}</span>
      <span>IESS empleado (9.45%):</span><span style="color:#f59e0b;font-family:var(--font-mono)">$${iessEmpleado.toFixed(2)}</span>
      <span>IESS empleador (12.15%):</span><span style="color:#ef4444;font-family:var(--font-mono)">$${iessEmpleador.toFixed(2)}</span>
      <span style="font-weight:700;color:var(--text-primary)">Costo total anual empresa:</span>
      <span style="color:var(--accent-emerald);font-family:var(--font-mono);font-weight:700">$${totalAnual.toFixed(2)}</span>
    </div>`;
}

function generarContratoServicios() {
  const g = id => document.getElementById(id)?.value || '';
  const ciudad = g('srv-ciudad'), fecha = g('srv-fecha'), contratante = g('srv-contratante'),
        rucC = g('srv-ruc-contratante'), repLegal = g('srv-rep-legal'),
        prestador = g('srv-prestador'), ciP = g('srv-ci-prestador'),
        profesion = g('srv-profesion'), objeto = g('srv-objeto'),
        plazo = g('srv-plazo'), honorarios = parseFloat(g('srv-honorarios')) || 0,
        forma = g('srv-forma-pago'), lugar = g('srv-lugar'),
        conf = g('srv-confidencialidad'), mediacion = g('srv-mediacion'),
        totalContrato = honorarios * parseInt(plazo);
  const fechaFmt = fecha ? new Date(fecha+'T12:00').toLocaleDateString('es-EC',{day:'2-digit',month:'long',year:'numeric'}) : '___';
  const preview = document.getElementById('servicios-preview');
  if (!preview) return;
  preview.innerHTML = `
    <div style="font-family:Georgia,serif;color:#1a1a2e;line-height:1.7;font-size:.85rem">
      <div style="text-align:center;margin-bottom:1.5rem">
        <h2 style="font-size:1.1rem;text-transform:uppercase;letter-spacing:1px;margin:0">CONTRATO DE PRESTACIÓN DE SERVICIOS PROFESIONALES</h2>
        <p style="font-size:.8rem;color:#666;margin:.3rem 0">${ciudad}, ${fechaFmt}</p>
      </div>
      <p><strong>COMPARECIENTES:</strong> En la ciudad de ${ciudad||'___'}, a ${fechaFmt}, comparecen por una parte <strong>${contratante||'___'}</strong>, RUC/C.I. ${rucC||'___'}, representada por ${repLegal||'___'}, en calidad de CONTRATANTE; y por otra parte <strong>${prestador||'___'}</strong>, portador de la C.I./RUC ${ciP||'___'}, ${profesion||'profesional'}, en calidad de PRESTADOR DE SERVICIOS.</p>
      <p><strong>PRIMERA — OBJETO:</strong> El PRESTADOR se obliga a prestar los siguientes servicios profesionales a favor del CONTRATANTE: <em>${objeto||'(descripción del servicio)'}</em>. Los servicios se prestarán en: ${lugar||'las instalaciones acordadas'}.</p>
      <p><strong>SEGUNDA — PLAZO:</strong> El presente contrato tendrá una duración de <strong>${plazo} mes(es)</strong> contados a partir de la fecha de suscripción, pudiendo renovarse de mutuo acuerdo por escrito.</p>
      <p><strong>TERCERA — HONORARIOS:</strong> El CONTRATANTE pagará al PRESTADOR la suma de <strong>USD ${honorarios.toFixed(2)} (${honorarios.toFixed(2)} dólares)</strong> mensuales, mediante ${forma}. El valor total del contrato asciende a <strong>USD ${totalContrato.toFixed(2)}</strong>. El CONTRATANTE efectuará la retención en la fuente de Impuesto a la Renta conforme a la normativa del SRI vigente.</p>
      <p><strong>CUARTA — NATURALEZA:</strong> El presente contrato es de carácter civil/mercantil. No existe relación de dependencia laboral, por lo que el PRESTADOR no tendrá derecho a beneficios sociales propios del Código del Trabajo.</p>

// Guardado unificado en historial para cualquier documento generado (botón "Terminar y Guardar")
function terminarYGuardarDocumento(tipoDoc, etiqueta) {
  const previewMap = {
    pagare:'pagare-preview', letra:'letra-preview', recibo:'recibo-preview',
    ingresocaja:'ingresocaja-preview',
    servicios:'servicios-preview', alquiler:'alquiler-preview', trabajo:'trabajo-preview',
    mutuoempresas:'mutuoempresas-preview', mutuopersonas:'mutuopersonas-preview',
  };
  const previewId = previewMap[tipoDoc];
  const preview = previewId ? document.getElementById(previewId) : null;
  if (!preview || preview.querySelector('.doc-placeholder')) {
    toast('Genere la vista previa antes de guardar', 'warning');
    return;
  }
  // Recolectar todos los inputs visibles del formulario activo como datos
  const formActivo = document.querySelector(`#doc-${tipoDoc} .doc-form`);
  const datos = {};
  if (formActivo) {
    formActivo.querySelectorAll('input, select, textarea').forEach(inp => {
      if (inp.id) datos[inp.id] = inp.value;
    });
  }
  guardarHistorialDocumento(tipoDoc, etiqueta, datos);
  toast(`${etiqueta} guardado en historial ✓`, 'success');
}

let actasCache = [];

async function renderActas(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pageTitle"><div><h2>Actas de Reunión</h2><p>Registra fecha, asistentes, puntos tratados con seguimiento, y firmas</p></div>
      <button class="btn primary" onclick="abrirFormularioActa()">+ Nueva acta</button></div>
    <div class="card" id="tablaActas">Cargando...</div>
    <div id="modalActaHost"></div>
  `;
  try{
    actasCache = await cargarActas();
  }catch(e){
    document.getElementById("tablaActas").innerHTML = `<div class="emptyState" style="color:var(--danger);">No se pudo cargar. Error: ${escapeHtml(e.message||String(e))}<br><span style="font-size:12px;">Si dice "permission_denied", agrega la ruta "actas_reunion" a las reglas de Realtime Database.</span></div>`;
    return;
  }
  pintarTablaActas();
}

// Calcula el % de avance de una acta según el estado de sus puntos tratados:
// cerrado cuenta como 100%, en proceso como 50%, pendiente como 0%.
function calcularAvanceActa(puntos){
  if(!puntos || !puntos.length) return null;
  const PESO = { cerrado:100, en_proceso:50, pendiente:0 };
  const suma = puntos.reduce((s,p) => s + (PESO[p.estado] ?? 0), 0);
  return Math.round(suma / puntos.length);
}

function badgeAvanceActa(porcentaje){
  if(porcentaje===null) return `<span class="pill muted">Sin puntos</span>`;
  const color = porcentaje>=100 ? "ok" : (porcentaje>=40 ? "warn" : "danger");
  return `<span class="pill ${color}">${porcentaje}%</span>`;
}

function pintarAvanceActa(id){
  const cont = document.getElementById("avanceActaWrap");
  if(!cont) return;
  const a = actasCache.find(x=>x.id===id);
  const puntos = a.puntos||[];
  const porcentaje = calcularAvanceActa(puntos);
  if(porcentaje===null){ cont.innerHTML = `<p style="color:var(--muted);font-size:13px;">Sin puntos tratados aún — el % de avance aparecerá cuando agregues alguno.</p>`; return; }
  const cerrados = puntos.filter(p=>p.estado==="cerrado").length;
  const enProceso = puntos.filter(p=>p.estado==="en_proceso").length;
  const pendientes = puntos.filter(p=>p.estado==="pendiente").length;
  const colorBarra = porcentaje>=100 ? "var(--accent2)" : (porcentaje>=40 ? "var(--warn)" : "var(--danger)");
  cont.innerHTML = `
    <div style="margin:10px 0;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <b>Avance de la reunión</b><b>${porcentaje}%</b>
      </div>
      <div style="background:var(--panel2);border-radius:6px;height:10px;overflow:hidden;">
        <div style="background:${colorBarra};height:100%;width:${porcentaje}%;transition:width .3s;"></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:4px;">
        ✅ ${cerrados} cerrado(s) · 🟡 ${enProceso} en proceso · ⚪ ${pendientes} pendiente(s) — de ${puntos.length} punto(s) total
      </p>
    </div>`;
}

function pintarTablaActas(){
  const cont = document.getElementById("tablaActas");
  if(!actasCache.length){ cont.innerHTML = `<div class="emptyState">Aún no hay actas registradas.</div>`; return; }
  cont.innerHTML = `<table><thead><tr><th>Tema</th><th>Fecha</th><th>Asistentes</th><th>Avance</th><th></th></tr></thead><tbody>
    ${actasCache.map(a => `<tr>
      <td><b>${escapeHtml(a.titulo||'-')}</b></td>
      <td>${fmtFecha(a.fecha)}</td>
      <td>${normalizarAsistentes(a.asistentes).length}</td>
      <td>${badgeAvanceActa(calcularAvanceActa(a.puntos))}</td>
      <td>
        <button class="btn small" onclick="abrirFormularioActa('${a.id}')">Editar</button>
        <button class="btn small" onclick="abrirDetalleSeguimientoActa('${a.id}')">📌 Seguimiento</button>
        <button class="btn small" onclick="imprimirActa('${a.id}')">🖨️ Imprimir</button>
        <button class="btn small green" onclick="abrirEnvioWhatsAppActa('${a.id}')">📲 WhatsApp</button>
        <button class="btn small danger" onclick="confirmarEliminarActa('${a.id}')">Eliminar</button>
      </td>
    </tr>`).join("")}
  </tbody></table>`;
}

async function confirmarEliminarActa(id){
  if(!confirm("¿Eliminar esta acta?")) return;
  await eliminarActa(id);
  actasCache = await cargarActas();
  pintarTablaActas();
}

/* --- Seguimiento de puntos tratados: cada punto puede recibir tantas
   actualizaciones (seguimientos) como haga falta, en cualquier momento,
   no solo al crear el acta. --- */
async function abrirDetalleSeguimientoActa(id){
  let a = actasCache.find(x=>x.id===id);
  if(!a) return;
  // Migración de compatibilidad: actas creadas antes de este cambio solo
  // tienen "asuntos" como texto libre; se convierte una sola vez a puntos
  // estructurados (sin perder el texto original, que se conserva para imprimir).
  // IMPORTANTE: se guarda de inmediato en Firebase (no solo en memoria), para
  // que la tabla principal y el % de Avance la reflejen también, no solo esta vista.
  if(!a.puntos && a.asuntos){
    const puntosMigrados = a.asuntos.split("\n").map(l=>l.trim()).filter(Boolean).map(linea => ({
      id: "pt_"+Date.now()+"_"+Math.floor(Math.random()*10000),
      descripcion: linea, estado: "pendiente", seguimientos: []
    }));
    await guardarActa({ puntos: puntosMigrados }, id);
    actasCache = await cargarActas();
    a = actasCache.find(x=>x.id===id);
  }
  if(!a.puntos){ await guardarActa({ puntos: [] }, id); actasCache = await cargarActas(); a = actasCache.find(x=>x.id===id); }
  const host = document.getElementById("modalActaHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:760px;">
        <button class="closeX" onclick="document.getElementById('modalActaHost').innerHTML=''; pintarTablaActas();">×</button>
        <h3>📌 Puntos tratados — Para Avance</h3>
        <p style="color:var(--muted);margin-top:-8px;"><b>${escapeHtml(a.titulo)}</b> — ${fmtFecha(a.fecha)}</p>
        <div id="avanceActaWrap"></div>
        <p class="helpNote">Estos son los puntos que determinan el % de Avance de la reunión. Agrégalos aquí y ve sumándoles seguimiento las veces que haga falta (en esta sesión o en cualquier momento posterior) sin perder el historial de avances anteriores.</p>
        <div class="field"><label>Nuevo punto (Para Avance)</label><input type="text" id="nuevoPuntoActa" placeholder="Describe un punto tratado y presiona 'Agregar'" style="width:100%;"></div>
        <button class="btn small" onclick="agregarPuntoActa('${id}')">+ Agregar punto</button>
        <div id="listaPuntosActa" style="margin-top:14px;"></div>
      </div>
    </div>`;
  pintarListaPuntosActa(id);
}

async function agregarPuntoActa(id){
  const input = document.getElementById("nuevoPuntoActa");
  const desc = input.value.trim();
  if(!desc){ alert("Escribe la descripción del punto."); return; }
  const a = actasCache.find(x=>x.id===id);
  const nuevoPunto = { id:"pt_"+Date.now()+"_"+Math.floor(Math.random()*10000), descripcion:desc, estado:"pendiente", seguimientos:[] };
  const nuevosPuntos = [...(a.puntos||[]), nuevoPunto];
  await guardarActa({ puntos: nuevosPuntos }, id);
  actasCache = await cargarActas();
  input.value = "";
  pintarListaPuntosActa(id);
}

const ESTADO_PUNTO_ACTA_INFO = {
  pendiente: {label:"Pendiente", pill:"warn"},
  en_proceso: {label:"En proceso", pill:"warn"},
  cerrado: {label:"Cerrado", pill:"ok"}
};

function pintarListaPuntosActa(id){
  pintarAvanceActa(id);
  const cont = document.getElementById("listaPuntosActa");
  const a = actasCache.find(x=>x.id===id);
  const puntos = a.puntos||[];
  if(!puntos.length){ cont.innerHTML = `<p style="color:var(--muted);">Aún no hay puntos tratados registrados.</p>`; return; }
  cont.innerHTML = puntos.map((p) => `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
        <b style="flex:1;">${escapeHtml(p.descripcion)}</b>
        <select onchange="actualizarEstadoPuntoActa('${id}','${p.id}',this.value)">
          ${Object.keys(ESTADO_PUNTO_ACTA_INFO).map(k=>`<option value="${k}" ${p.estado===k?'selected':''}>${ESTADO_PUNTO_ACTA_INFO[k].label}</option>`).join("")}
        </select>
        <span class="pill ${ESTADO_PUNTO_ACTA_INFO[p.estado]?.pill||'muted'}">${ESTADO_PUNTO_ACTA_INFO[p.estado]?.label||''}</span>
        <button class="btn small danger" onclick="eliminarPuntoActa('${id}','${p.id}')">Quitar</button>
      </div>
      <div style="margin-top:10px;">
        <b style="font-size:12px;">Seguimiento (${(p.seguimientos||[]).length}):</b>
        <div style="margin:6px 0;">
          ${(p.seguimientos||[]).slice().reverse().map(s=>`<div style="border-left:2px solid var(--border);padding-left:8px;margin-bottom:6px;font-size:13px;">
            <span style="color:var(--muted);">${fmtFecha(s.fecha)}</span> — ${escapeHtml(s.nota)}
          </div>`).join("") || `<p style="color:var(--muted);font-size:12px;">Sin seguimiento aún.</p>`}
        </div>
        <div style="display:flex;gap:6px;">
          <input type="text" id="notaSeguimiento_${p.id}" placeholder="Escribe la novedad/avance de este punto...">
          <button class="btn small" onclick="agregarSeguimientoPuntoActa('${id}','${p.id}')">+ Agregar seguimiento</button>
        </div>
      </div>
    </div>`).join("");
}

async function actualizarEstadoPuntoActa(id, puntoId, estado){
  const a = actasCache.find(x=>x.id===id);
  const puntos = (a.puntos||[]).map(p => p.id===puntoId ? {...p, estado} : p);
  await guardarActa({ puntos }, id);
  actasCache = await cargarActas();
  pintarListaPuntosActa(id);
}

async function eliminarPuntoActa(id, puntoId){
  if(!confirm("¿Quitar este punto y todo su seguimiento?")) return;
  const a = actasCache.find(x=>x.id===id);
  const puntos = (a.puntos||[]).filter(p=>p.id!==puntoId);
  await guardarActa({ puntos }, id);
  actasCache = await cargarActas();
  pintarListaPuntosActa(id);
}

async function agregarSeguimientoPuntoActa(id, puntoId){
  const input = document.getElementById("notaSeguimiento_"+puntoId);
  const nota = input.value.trim();
  if(!nota){ alert("Escribe la novedad de seguimiento."); return; }
  const a = actasCache.find(x=>x.id===id);
  const puntos = (a.puntos||[]).map(p => {
    if(p.id!==puntoId) return p;
    const nuevoSeguimiento = { id:"sg_"+Date.now()+"_"+Math.floor(Math.random()*10000), fecha: Date.now(), nota };
    return {...p, seguimientos: [...(p.seguimientos||[]), nuevoSeguimiento]};
  });
  await guardarActa({ puntos }, id);
  actasCache = await cargarActas();
  pintarListaPuntosActa(id);
}

  if(Array.isArray(a)) return a;
  if(typeof a === "string"){

      const partes = l.split(" - ");
      return {nombre:(partes[0]||l).trim(), cargo:(partes[1]||"").trim(), whatsapp:""};

  }
  return [];
}

/* --- Envío del acta por WhatsApp, con las referencias personalizadas de cada asistente --- */
function extraerReferenciasAsistente(nombreAsistente, textoAsuntos){
  if(!nombreAsistente || !textoAsuntos) return [];
  const primerNombre = nombreAsistente.trim().split(/\s+/)[0].toLowerCase();
  const lineas = textoAsuntos.split("\n").map(l=>l.trim()).filter(Boolean);
  return lineas.filter(l => l.toLowerCase().includes(primerNombre));
}

function abrirEnvioWhatsAppActa(id){
  const a = actasCache.find(x=>x.id===id);
  const asistentes = normalizarAsistentes(a.asistentes);
  const host = document.getElementById("modalActaHost");
  host.innerHTML = `
    <div class="modalBg">
      <div class="modalBox" style="max-width:600px;">
        <button class="closeX" onclick="document.getElementById('modalActaHost').innerHTML=''">×</button>
        <h3>📲 Enviar acta por WhatsApp</h3>
        <p class="helpNote">Se genera un mensaje para cada asistente con los datos generales de la reunión y, si se le nombra en "Asuntos tratados", las líneas específicas que le corresponden.</p>
        ${!asistentes.length ? `<p style="color:var(--muted);">Esta acta no tiene asistentes con datos registrados. Edita el acta y agrégalos.</p>` :
        asistentes.map((asis, idx) => {
          const sinWsp = !asis.whatsapp;
          return `<div class="checklistItem">
            <div style="flex:1;">
              <b>${escapeHtml(asis.nombre)}</b> ${asis.cargo?`<span class="pill muted">${escapeHtml(asis.cargo)}</span>`:''}
              ${sinWsp ? `<div class="meta" style="color:var(--warn);">Sin número de WhatsApp registrado</div>` : `<div class="meta">${escapeHtml(asis.whatsapp)}</div>`}
            </div>
            ${!sinWsp ? `<button class="btn small green" onclick="enviarActaWhatsApp('${id}', ${idx})">Enviar</button>` : ''}
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

function enviarActaWhatsApp(actaId, idxAsistente){
  const a = actasCache.find(x=>x.id===actaId);
  const asistentes = normalizarAsistentes(a.asistentes);
  const asis = asistentes[idxAsistente];
  if(!asis?.whatsapp) return;
  const referencias = extraerReferenciasAsistente(asis.nombre, a.asuntos);
  let mensaje = `Hola ${asis.nombre}, te comparto un resumen del Acta de Reunión "${a.titulo}" (${fmtFecha(a.fecha)}).\n`;
  if(referencias.length){
    mensaje += `\nPuntos que te corresponden:\n${referencias.map(r=>'• '+r).join('\n')}\n`;
  }
  if(a.pendientes){
    mensaje += `\nPuntos pendientes generales:\n${a.pendientes.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>'• '+l).join('\n')}\n`;
  }
  if(a.proximaReunion){
    mensaje += `\nPróxima reunión: ${a.proximaReunion}\n`;
  }
  const numeroLimpio = asis.whatsapp.replace(/[^0-9]/g,"");
  const url = `https://wa.me/${numeroLimpio}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

function pintarAuditoriaEquipos(){
  const cont = document.getElementById("equiposVistaContenido");
  const hoy = new Date();
  const filas = [];
  equiposVisiblesParaUsuarioActual().forEach(eq => {
    (eq.miembros||[]).forEach(m => {
      if(!m.fechaTermino || m.estado==="terminado") return;
      const dias = diasEntre(hoy, new Date(m.fechaTermino));
      if(dias<=7){
        filas.push({
          proyecto: eq.nombreProyecto, integrante: m.nombre, tarea: m.tarea,
          fechaTermino: m.fechaTermino, dias, estado: m.estado, equipoId: eq.id
        });
      }
    });
    // También el proyecto en general, si tiene fecha término vencida
    if(eq.fechaTermino){
      const diasProy = diasEntre(hoy, new Date(eq.fechaTermino));
      const pendientes = (eq.miembros||[]).some(m=>m.estado!=="terminado");
      if(diasProy<=7 && pendientes){
        filas.push({ proyecto: eq.nombreProyecto, integrante:"(Proyecto completo)", tarea:"Fecha término del proyecto", fechaTermino: eq.fechaTermino, dias: diasProy, estado:"proyecto", equipoId: eq.id });
      }
    }
  });
  filas.sort((a,b)=>a.fechaTermino-b.fechaTermino);

  cont.innerHTML = `
    <div class="card">
      <p class="helpNote">Muestra tareas e integrantes con fecha de término vencida o dentro de los próximos 7 días, que no estén marcadas como "Terminado".</p>
      ${!filas.length ? `<div class="emptyState">✅ No hay vencimientos próximos ni atrasados. Todo al día.</div>` : `

        ${filas.map(f => `<tr>
          <td>${escapeHtml(f.proyecto)}</td>
          <td>${escapeHtml(f.integrante)}</td>
          <td>${escapeHtml(f.tarea||'-')}</td>
          <td>${fmtFecha(f.fechaTermino)} ${f.dias<0?'<span class="pill danger">Vencido</span>':'<span class="pill warn">Próximo</span>'}</td>
          <td>${ESTADO_TAREA_INFO[f.estado]?.label || (f.estado==='proyecto'?'Proyecto':f.estado)}</td>
          <td><button class="btn small" onclick="abrirDetalleEquipo('${f.equipoId}')">Abrir</button></td>
        </tr>`).join("")}
      </tbody></table>`}
    </div>`;
}

function pintarTablaEquipos(){
  const cont = document.getElementById("equiposVistaContenido");
  const equiposVisibles = equiposVisiblesParaUsuarioActual();
  if(!equiposVisibles.length){ cont.innerHTML = `<div class="card emptyState">Aún no hay proyectos/equipos registrados${equiposCache.length?' donde participes':''}.</div>`; return; }
  cont.innerHTML = `<div class="card"><table><thead><tr><th>Proyecto</th><th>Integrantes</th><th>Fechas</th><th></th></tr></thead><tbody>

// Filtra los equipos visibles para el usuario actual: los administradores ven
// todos; un usuario "solo lectura" vinculado a un Miembro (por su correo de
// acceso) solo ve los equipos donde ese miembro participa — no los demás.
function equiposVisiblesParaUsuarioActual(){
  if(!usuarioPermisos || usuarioPermisos.rol==="admin") return equiposCache;
  const miEmail = (currentUser?.email||"").toLowerCase();
  const miMiembro = colaboradoresCache.find(c=>c.emailAcceso && c.emailAcceso===miEmail);
  if(!miMiembro) return equiposCache; // no vinculado a ningún miembro: sin restricción adicional
  return equiposCache.filter(eq => (eq.miembros||[]).some(m => m.miembroId===miMiembro.id));
}


async function confirmarEliminarEquipo(id){
  if(!confirm("¿Eliminar este proyecto/equipo?")) return;
  await eliminarEquipo(id);
  equiposCache = await cargarEquipos();
  pintarTablaEquipos();
}
