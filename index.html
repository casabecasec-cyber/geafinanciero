function descargarExcelComparativoSri(){
  if(!empresaComparativoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const clave = empresaComparativoSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const filas = calcularFilasComparativo(clave);
  const encabezados = ["Año","SRI","Súper Cías","Contable","Fuente Valor Real","Valor Real",
    "Participación Trabajadores","¿Participación auto o manual?","Participación Trabajadores Repartida",
    "Impuesto Causado","Reserva Legal","Otras Reservas",
    "Utilidad a Distribuir","¿Utilidad auto o manual?","Utilidad Acumulada","¿Acumulada auto o manual?"];
  const fuenteLabel = {sri:"SRI", superCias:"Súper Cías", contable:"Contable"};
  const filasDatos = filas.map(f => [
    f.anio, f.raw.sri, f.raw.superCias, f.raw.contable, fuenteLabel[f.raw.valorRealFuente], f.valorReal,
    f.participacionMostrada, f.participacionEsAuto?"Auto":"Manual", f.raw.participacionTrabajadoresRepartida,
    f.raw.impuestoCausado, f.raw.reservaLegal, f.raw.otrasReservas,
    f.utilidadMostrada, f.utilidadEsAuto?"Auto":"Manual", f.acumuladoMostrado, f.acumuladoEsAuto?"Auto":"Manual"
  ]);
  const ws = XLSX.utils.aoa_to_sheet([
    [`Comparativo SRI / Súper Cías / Contable — ${nombreEmpresa}`],
    [`Generado el ${fmtFecha(Date.now())}`],
    [],
    encabezados,
    ...filasDatos
  ]);
  ws["!cols"] = encabezados.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Comparativo");
  XLSX.writeFile(wb, `Comparativo_SRI_${nombreEmpresa}`.replace(/\s+/g,"_")+".xlsx");
}

// Construye el HTML del informe ejecutivo profesional de "Trabajar con
// Resúmenes": Capital Social + Historial de Dividendos + Conciliación con el
// Comparativo SRI, todo para la empresa seleccionada (vista completa, no
// filtrada por accionista). Se usa tanto para Imprimir como para Descargar PDF.
function construirHtmlInformeResumenes(){
  const clave = empresaDividendoSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const aniosCapital = datosDividendosCache.resumenCapital.anios;
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios;
  const fmtMoneda = v => (v===null||v===undefined) ? "—" : "$"+Number(v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});

  const { filas: filasConciliacion, totalDiferencia, totalComparativo, totalDividendos } = calcularConciliacionComparativoVsDividendos(clave);
  const cuadraTodo = Math.abs(totalDiferencia) < 0.5;

  const ultimoAnioCap = aniosCapital[aniosCapital.length-1];
  const capitalTotalActual = datosCapital ? (datosCapital.suman[ultimoAnioCap]||0) : 0;
  const filasComp = calcularFilasComparativo(clave).filter(f=>f.valorReal!==null&&f.valorReal!==undefined);
  const utilidadAcumuladaActual = filasComp.length ? (filasComp[filasComp.length-1].acumuladoMostrado||0) : 0;

  const filasCapitalHtml = (datosCapital?.filas||[]).map(f => `<tr>
      <td>${escapeHtml(f.accionista)}</td>
      ${aniosCapital.map(a=>`<td class="num">${fmtMoneda(f.valores[a]||0)}</td>`).join("")}
    </tr>`).join("");
  const filaSumanCapitalHtml = `<tr style="font-weight:700;background:#eef2f6;"><td>SUMAN</td>${aniosCapital.map(a=>`<td class="num">${fmtMoneda(datosCapital?.suman[a]||0)}</td>`).join("")}</tr>`;

  const filasDividendoHtml = (datosResumen?.filas||[]).map(f => `<tr>
      <td>${escapeHtml(f.accionista)}</td>
      ${aniosDividendos.map(a=>`<td class="num">${fmtMoneda(f.valores[a]||0)}</td>`).join("")}
      <td class="num" style="font-weight:700;">${fmtMoneda(f.total||0)}</td>
    </tr>`).join("");
  const filaSumanDivHtml = `<tr style="font-weight:700;background:#eef2f6;"><td>SUMAN</td>${aniosDividendos.map(a=>`<td class="num">${fmtMoneda(datosResumen?.suman[a]||0)}</td>`).join("")}<td class="num">${fmtMoneda(aniosDividendos.reduce((s,a)=>s+(datosResumen?.suman[a]||0),0))}</td></tr>`;

  const filasConciliacionHtml = filasConciliacion.map(f => `<tr class="${!f.cuadra?'celda-alerta-fila':''}">
      <td>${f.anio}</td>
      <td class="num">${fmtMoneda(f.utilidadDistribuirComparativo)}</td>
      <td class="num">${fmtMoneda(f.sumanDividendos)}</td>
      <td class="num">${fmtMoneda(f.acumuladoComparativo)}</td>
      <td class="num">${fmtMoneda(f.acumuladoDividendosCorrido)}</td>
      <td class="num" style="font-weight:700;">${f.cuadra?'✓ $0.00':fmtMoneda(f.diferencia)}</td>
    </tr>`).join("");

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Informe Ejecutivo — ${escapeHtml(nombreEmpresa)}</title>
    <style>
      @page { size: A4 landscape; margin: 14mm; }
      body{font-family:'Segoe UI',Arial,sans-serif;color:#1b2733;margin:0;padding:0;}
      .portada-linea{height:5px;background:linear-gradient(90deg,#1a73c7,#178f5c);}
      .encabezado{padding:18px 4px 10px;border-bottom:2px solid #1a73c7;margin-bottom:14px;}
      .encabezado h1{font-size:19px;margin:0 0 2px;color:#1a2733;}
      .encabezado .sub{font-size:12px;color:#5c6b7a;}
      .encabezado .meta{font-size:11px;color:#8ea2b3;margin-top:4px;}
      .resumen{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
      .tarjeta{flex:1;min-width:150px;background:#f4f6f9;border:1px solid #d7dee6;border-radius:8px;padding:10px 12px;}
      .tarjeta .valor{font-size:16px;font-weight:700;color:#1a73c7;}
      .tarjeta .valor.verde{color:#178f5c;}
      .tarjeta .valor.rojo{color:#c8382c;}
      .tarjeta .label{font-size:10px;color:#5c6b7a;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
      h2.seccion{font-size:13px;color:#1a2733;border-left:4px solid #1a73c7;padding-left:8px;margin:18px 0 8px;page-break-after:avoid;}
      table{width:100%;border-collapse:collapse;font-size:9.5px;}
      th{background:#1a2733;color:#fff;padding:5px 4px;text-align:left;white-space:nowrap;}
      td{padding:4px;border-bottom:1px solid #e3e8ee;}
      td.num{text-align:right;font-variant-numeric:tabular-nums;}
      tbody tr:nth-child(even){background:#f9fafb;}
      .celda-alerta-fila td{background:#fbdcdc!important;color:#c8382c;}
      .parrafo-ia{font-size:11px;line-height:1.5;color:#33414d;background:#f4f6f9;border-radius:8px;padding:10px 12px;margin-bottom:14px;}
      .pie{margin-top:20px;font-size:9px;color:#8ea2b3;border-top:1px solid #d7dee6;padding-top:8px;display:flex;justify-content:space-between;}
    </style>
    </head><body>
    <div class="portada-linea"></div>
    <div class="encabezado">
      <h1>Informe Ejecutivo — Capital Social y Dividendos</h1>
      <div class="sub">${escapeHtml(nombreEmpresa)}</div>
      <div class="meta">Generado el ${fmtFecha(Date.now())}</div>
    </div>

    <h2 class="seccion">Resumen ejecutivo</h2>
    <div class="resumen">
      <div class="tarjeta"><div class="valor">${fmtMoneda(capitalTotalActual)}</div><div class="label">Capital social actual (${ultimoAnioCap})</div></div>
      <div class="tarjeta"><div class="valor verde">${fmtMoneda(utilidadAcumuladaActual)}</div><div class="label">Utilidad Acumulada a la fecha (Comparativo SRI...)</div></div>
      <div class="tarjeta"><div class="valor">${fmtMoneda(totalDividendos)}</div><div class="label">Total distribuido histórico (Historial de Dividendos)</div></div>
      <div class="tarjeta"><div class="valor ${cuadraTodo?'verde':'rojo'}">${cuadraTodo?'✓ Cuadra':fmtMoneda(totalDiferencia)}</div><div class="label">Diferencia total vs. Comparativo SRI</div></div>
    </div>

    <h2 class="seccion">Historial de Capital Social por Accionista</h2>
    <table><thead><tr><th>Accionista</th>${aniosCapital.map(a=>`<th>${a}</th>`).join("")}</tr></thead>
    <tbody>${filasCapitalHtml}${filaSumanCapitalHtml}</tbody></table>

    <h2 class="seccion">Historial de Dividendos por Accionista</h2>
    <table><thead><tr><th>Accionista</th>${aniosDividendos.map(a=>`<th>${a}</th>`).join("")}<th>TOTAL ACUMULADO</th></tr></thead>
    <tbody>${filasDividendoHtml}${filaSumanDivHtml}</tbody></table>

    <h2 class="seccion">Conciliación: Comparativo SRI vs. Historial de Dividendos (acumulado corrido)</h2>
    <p class="parrafo-ia">Compara, año por año, la Utilidad Acumulada corrida del Comparativo SRI/Súper Cías/Contable contra el acumulado corrido de lo efectivamente repartido en el Historial de Dividendos (mismo criterio que "Recalcular desde Comparativo SRI", que reparte según el aumento real del acumulado de cada año). En teoría deben coincidir siempre; las filas resaltadas en rojo muestran una diferencia acumulada a partir de ese año — usa "🔄 Recalcular desde Comparativo SRI + % de Capital" en la app para volver a alinearlas.</p>
    ${filasConciliacion.length ? `<table><thead><tr><th>Año</th><th>Utilidad a Distribuir (año, Comparativo)</th><th>SUMAN (año, Dividendos)</th><th>Acumulado Comparativo</th><th>Acumulado Dividendos</th><th>Diferencia acumulada</th></tr></thead>
    <tbody>${filasConciliacionHtml}
      <tr style="font-weight:700;background:#eef2f6;"><td>TOTAL / FINAL</td><td class="num"></td><td class="num"></td><td class="num">${fmtMoneda(totalComparativo)}</td><td class="num">${fmtMoneda(totalDividendos)}</td><td class="num">${cuadraTodo?'✓ Cuadra':fmtMoneda(totalDiferencia)}</td></tr>
    </tbody></table>` : `<p style="color:#8ea2b3;">Sin años para comparar.</p>`}

    <div class="pie">
      <span>${escapeHtml(nombreEmpresa)} — Informe generado automáticamente por Geafinanciero</span>
      <span>Página <span class="pageNumber"></span></span>
    </div>
    </body></html>`;
}

function imprimirInformeResumenes(){
  if(!empresaDividendoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const win = window.open("", "_blank");
  win.document.write(construirHtmlInformeResumenes());
  win.document.close();
  win.focus();
  win.print();
}

function descargarPDFInformeResumenes(){
  if(!empresaDividendoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const win = window.open("", "_blank");
  win.document.write(construirHtmlInformeResumenes().replace(
    "</body></html>",
    `<script>window.onload = () => setTimeout(() => window.print(), 250);<\/script></body></html>`
  ));
  win.document.close();
  win.focus();
}

function descargarExcelInformeResumenes(){
  if(!empresaDividendoSeleccionada){ alert("Selecciona una empresa primero."); return; }
  const clave = empresaDividendoSeleccionada;
  const nombreEmpresa = datosDividendosCache.porEmpresa[clave]?.nombreHoja || clave;
  const datosCapital = datosDividendosCache.resumenCapital.empresas[clave];
  const datosResumen = datosDividendosCache.resumenDividendos.empresas[clave];
  const aniosCapital = datosDividendosCache.resumenCapital.anios;
  const aniosDividendos = datosDividendosCache.resumenDividendos.anios;
  const { filas: filasConciliacion, totalDiferencia, totalComparativo, totalDividendos } = calcularConciliacionComparativoVsDividendos(clave);

  // Hoja 1: Capital Social
  const encCapital = ["Accionista", ...aniosCapital.map(String)];
  const filasCapital = (datosCapital?.filas||[]).map(f => [f.accionista, ...aniosCapital.map(a=>f.valores[a]||0)]);
  filasCapital.push(["SUMAN", ...aniosCapital.map(a=>datosCapital?.suman[a]||0)]);
  const wsCapital = XLSX.utils.aoa_to_sheet([
    [`Historial de Capital Social — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encCapital, ...filasCapital
  ]);
  wsCapital["!cols"] = encCapital.map(()=>({wch:16}));

  // Hoja 2: Historial de Dividendos
  const encDiv = ["Accionista", ...aniosDividendos.map(String), "TOTAL ACUMULADO"];
  const filasDiv = (datosResumen?.filas||[]).map(f => [f.accionista, ...aniosDividendos.map(a=>f.valores[a]||0), f.total||0]);
  filasDiv.push(["SUMAN", ...aniosDividendos.map(a=>datosResumen?.suman[a]||0), aniosDividendos.reduce((s,a)=>s+(datosResumen?.suman[a]||0),0)]);
  const wsDiv = XLSX.utils.aoa_to_sheet([
    [`Historial de Dividendos por Accionista — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encDiv, ...filasDiv
  ]);
  wsDiv["!cols"] = encDiv.map(()=>({wch:16}));

  // Hoja 3: Conciliación (acumulado corrido — misma lógica que "Recalcular")
  const encConc = ["Año", "Utilidad a Distribuir (año, Comparativo)", "SUMAN (año, Dividendos)", "Acumulado Comparativo", "Acumulado Dividendos", "Diferencia acumulada", "¿Cuadra?"];
  const filasConc = filasConciliacion.map(f => [f.anio, f.utilidadDistribuirComparativo, f.sumanDividendos, f.acumuladoComparativo, f.acumuladoDividendosCorrido, f.diferencia, f.cuadra?"Sí":"No"]);
  filasConc.push(["TOTAL / FINAL", "", "", totalComparativo, totalDividendos, totalDiferencia, Math.abs(totalDiferencia)<0.5?"Sí":"No"]);
  const wsConc = XLSX.utils.aoa_to_sheet([
    [`Conciliación Comparativo SRI vs. Historial de Dividendos (acumulado corrido) — ${nombreEmpresa}`], [`Generado el ${fmtFecha(Date.now())}`], [],
    encConc, ...filasConc
  ]);
  wsConc["!cols"] = encConc.map(()=>({wch:20}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsCapital, "Capital Social");
  XLSX.utils.book_append_sheet(wb, wsDiv, "Historial Dividendos");
  XLSX.utils.book_append_sheet(wb, wsConc, "Conciliación");
  XLSX.writeFile(wb, `Informe_Resumenes_${nombreEmpresa}`.replace(/\s+/g,"_")+".xlsx");
}
